const THAPP_CSS = `
#W {
  --hh: 60px;
  --bg: #0c0d12;
  --card: #1d2130;
  --field: #282d3f;
  --line: rgba(255, 255, 255, 0.14);
  --line2: rgba(255, 255, 255, 0.24);
  --ink: #f4f4f6;
  --ink2: rgba(244, 244, 246, 0.78);
  --btn: #323850;
  --accent: #34d399;
}
#W.light {
  --bg: #f6f4ee;
  --card: #ebe7dc;
  --field: #dfdacb;
  --line: rgba(0, 0, 0, 0.08);
  --line2: rgba(0, 0, 0, 0.12);
  --ink: #18191c;
  --ink2: rgba(24, 25, 28, 0.7);
  --btn: #ded8ca;
  --accent: #059669;
}
#W, #W * { box-sizing: border-box; margin: 0; }
#W {
  min-height: 100vh;
  font-family: Cairo, Inter, sans-serif;
  color: var(--ink);
  background-color: var(--bg);
  overflow-x: clip;
}

/* الهيدر العلوي واللوجو */
#hdr {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: calc(var(--hh) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 16px 0;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: space-between;
  direction: ltr;
}
#hlg { display: flex; align-items: center; gap: 10px; }
.sdlogo {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  cursor: pointer;
}
.sdlogo img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

#hctl { display: flex; gap: 10px; align-items: center; }

#prof {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line2);
  background: var(--card);
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  font: 800 15px Cairo, sans-serif;
  cursor: pointer;
}

.lvl {
  width: 32px; height: 32px;
  border: 0; background: transparent;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #e0a100;
}
.lvl svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; }
.lvl svg circle:first-child { fill: rgba(224, 161, 0, 0.25); }
.lvl.sk { color: #7c8cf8; }

.stdot {
  width: 30px; height: 36px; border: 0; background: transparent;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.stdot i {
  width: 11px; height: 11px; border-radius: 50%;
  background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
}

/* السايد بار بالكونتراست والتوسيط */
#side {
  position: fixed;
  z-index: 28;
  left: 12px;
  top: calc(var(--hh) + 6px);
  bottom: 12px;
  width: 242px;
  padding: 16px 10px;
  border-radius: 24px;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line2);
  box-shadow: 0 12px 36px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07);
  overflow-y: auto;
  scrollbar-width: none;
}
#side::-webkit-scrollbar { display: none; }

.sdh { font: 800 13px Cairo, sans-serif; color: var(--ink2); margin: 10px 14px 6px; }
.sdl { height: 1px; margin: 8px 12px; background: var(--line); }
.sdg { font: 700 11.5px Cairo, sans-serif; color: var(--ink2); margin: 6px 14px 4px; }

.sdi {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  height: 44px;
  padding: 0 12px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: transparent;
  color: var(--ink);
  font: 600 13px Cairo, sans-serif;
  text-align: start;
  cursor: pointer;
  transition: all 0.2s ease;
}
.sdi svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; opacity: 0.85; flex: none; }
.sdi:hover { background: var(--btn); border-color: var(--line2); }
.sdr .sdi.hm, .sdr .sdi.sub4, .sdr .sdi.sub3 { border-color: var(--line2); }
.sdr .sdi.hm:hover, .sdr .sdi.sub4:hover, .sdr .sdi.sub3:hover { background: var(--btn); }
.sdr .sdi.hm.on { border-color: var(--accent); }
.sdi.on { background: var(--btn); border-color: var(--accent); color: var(--accent); font-weight: 700; }

/* شبكة الزراير ومحاذاة السنتر الدقيقة */
.sdr {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 6px;
  padding: 0 2px;
}
.sdr .sdi.hm {
  grid-column: span 12;
  height: 44px;
  padding: 0 14px;
  justify-content: center;
  text-align: center;
  background: var(--field);
  border: 1px solid var(--line);
}
.sdr .sdi.sub4 {
  grid-column: span 3;
  height: 40px;
  padding: 0;
  justify-content: center;
  background: var(--field);
  border: 1px solid var(--line2);
}
.sdr .sdi.sub3 {
  grid-column: span 4;
  height: 40px;
  padding: 0;
  justify-content: center;
  background: var(--field);
  border: 1px solid var(--line2);
}
.sdr .sdi.sub4 span, .sdr .sdi.sub3 span { display: none!important; }

/* عداد النوتيفيكيشن التنازلي */
.badge-count {
  position: absolute;
  top: -4px;
  left: -4px;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 9px;
  background: #ef4444;
  color: #fff;
  font: 800 10.5px/18px Inter, sans-serif;
  text-align: center;
  box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
  pointer-events: none;
  z-index: 5;
  transition: transform 0.2s ease;
}

/* مساحة العرض الرئيسية */
#layer {
  position: fixed;
  inset: 0;
  left: 266px;
  right: 14px;
  top: calc(var(--hh) + 6px);
  bottom: 12px;
  z-index: 20;
}
#lbody {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  scrollbar-width: none;
}
#lbody::-webkit-scrollbar { display: none; }

/* شريط العنوان التفاعلي فوق */
#crumb {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  left: 270px;
  right: 170px;
  height: 32px;
  z-index: 26;
  display: none;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
#crumb .cn {
  font: 800 15px Cairo, sans-serif;
  color: var(--accent);
}

/* شاشة العرض للميزة قيد التطوير مع الشاكوش والشرار الذهبي */
.showroom-maint {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  text-align: center;
}
.maint-target {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 44px;
  border-radius: 24px;
  background: var(--card);
  border: 1px solid var(--line2);
  box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.07);
  min-width: 220px;
}
.maint-target .maint-title {
  font: 800 1.3rem Cairo, sans-serif;
  color: var(--ink);
  margin-bottom: 6px;
}
.maint-target .maint-status {
  font: 600 0.85rem Cairo, sans-serif;
  color: #fbbf24;
}

/* أنيميشن المطرقة والشرار الذهبي */
.maint-hammer {
  position: absolute;
  top: -16px;
  right: 20px;
  width: 48px;
  height: 24px;
  pointer-events: none;
  color: #e2e8f0;
}
.maint-hammer svg {
  width: 100%;
  height: 100%;
  overflow: visible;
  transform-origin: 6.25% 50%;
  stroke: currentColor;
}
.maint-hammer .uc-sp {
  position: absolute;
  top: 0;
  right: 8px;
  width: 8px;
  height: 2px;
  border-radius: 1px;
  background: #fbbf24;
  box-shadow: 0 0 8px #f59e0b;
}

/* نوافذ النظام الموحدة بالألوان البيضاء المقروءة 100% */
.sys-modal {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.7); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.sys-modal .box {
  width: min(90vw, 360px); padding: 26px 20px;
  border-radius: 22px; background: #1c1f2b!important; border: 1px solid rgba(255,255,255,0.15)!important;
  color: #ffffff!important; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,0.5);
}
.sys-modal .content {
  display: flex; align-items: center; gap: 14px;
  padding: 14px; border-radius: 16px;
  background: #262a38!important; border: 1px solid rgba(255,255,255,0.1)!important;
  margin-bottom: 18px; text-align: start;
}
.sys-modal .title {
  font: 800 1.05rem Cairo, sans-serif!important;
  color: #ffffff!important;
  display: block; margin-bottom: 4px;
}
.sys-modal .desc {
  font: 500 0.88rem/1.55 Cairo, sans-serif!important;
  color: #cbd5e1!important;
  display: block;
}
.sys-modal .btn-ok {
  width: 140px; height: 42px; border-radius: 21px;
  border: 0; background: linear-gradient(135deg, #fb923c, #ea7a0c);
  color: #ffffff!important; font: 800 0.95rem Cairo, sans-serif; cursor: pointer;
  box-shadow: 0 6px 20px rgba(234, 122, 12, 0.4);
}

/* نافذة البروفايل */
.ov {
  position: fixed; inset: 0; z-index: 100;
  display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.6);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.ov.on { display: flex; }
.pop {
  width: min(92vw, 360px);
  padding: 24px 20px;
  border-radius: 20px;
  background: var(--card);
  border: 1px solid var(--line2);
  color: var(--ink);
  text-align: center;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}
.pav {
  width: 58px; height: 58px; margin: 0 auto 12px;
  border-radius: 50%;
  background: var(--field);
  border: 1px solid var(--line2);
  display: flex; align-items: center; justify-content: center;
  font: 800 22px Cairo, sans-serif;
  color: var(--accent);
}
.ptools { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
.cb {
  height: 32px; padding: 0 12px; border-radius: 16px;
  border: 1px solid var(--line2); background: var(--field);
  color: var(--ink); cursor: pointer; font: 700 12px Cairo, sans-serif;
  display: flex; align-items: center; justify-content: center;
}
.cb.ic { width: 32px; padding: 0; }
.cb svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }

.prow {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 4px; border-bottom: 1px solid var(--line);
  font: 600 13px Cairo, sans-serif;
}
.plan { padding: 10px 4px; border-bottom: 1px solid var(--line); text-align: start; }
.plan > b { font: 700 12.5px Cairo, sans-serif; color: var(--ink2); }
.plbtn {
  display: flex; gap: 4px; margin-top: 6px; padding: 4px;
  border-radius: 12px; background: var(--field); border: 1px solid var(--line);
}
.plbtn span {
  flex: 1; text-align: center; padding: 5px 2px;
  border-radius: 8px; font: 600 11.5px Cairo, sans-serif;
  cursor: pointer; color: var(--ink2);
}
.plbtn span.on {
  background: var(--card); color: var(--accent); font-weight: 800;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.btn-logout {
  width: 100%; height: 40px; margin-top: 16px;
  border-radius: 10px; border: 1px solid var(--line2);
  background: var(--field); color: var(--ink);
  font: 700 13px Cairo, sans-serif; cursor: pointer;
}
`;

const THN = (() => {
  const en = new Map(), en2 = new Map(), ar = new Map();
  const nz = s => s.replace(/[ً-ٰٟـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  const dd = s => s.replace(/(.)\1+/g, '$1'), cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s;
  TH_NAMES.forEach(r => {
    const x = r.split('|'), p = x[0].split(':'), vs = p[1].split(' ');
    vs.forEach(v => { if (!en.has(v)) en.set(v, e); const d = dd(v); if (!en2.has(d)) en2.set(d, e); });
    ar.set(nz(x[1]), e);
  });
  return function (raw, wantAr) {
    let t = String(raw || '').trim().split(/[\s._\-@]+/)[0] || '';
    t = t.replace(/[0-9]+/g, '');
    if (!t) return { n: '', g: '' };
    if (/[؀-ۿ]/.test(t)) {
      const e = ar.get(nz(t));
      return { n: wantAr ? t : (e ? e.c : t), g: e ? e.g : (/ة$/.test(t) ? 'f' : '') };
    }
    const key = t.toLowerCase().replace(/[^a-z]/g, '');
    let e = en.get(key) || en2.get(dd(key));
    return { n: wantAr && e ? e.a : cap(t), g: e ? e.g : '' };
  };
})();

function THApp(cfg) {
  'use strict';
  const R = cfg.host.attachShadow({ mode: 'open' });
  R.innerHTML = '<style>' + THAPP_CSS + '</style>' + THAPP_HTML;

  const $ = id => R.getElementById(id), W = $('W');
  let L = 'ar', cur = 'home';

  // نافذة الإشعارات الموحدة
  function showNotice(title, desc, btnText = 'فهمت', iconHtml = '') {
    const o = document.createElement('div');
    o.className = 'sys-modal';
    o.innerHTML = `
      <div class="box">
        <div class="content">
          ${iconHtml ? `<div>${iconHtml}</div>` : ''}
          <div>
            <span class="title">${title}</span>
            <span class="desc">${desc}</span>
          </div>
        </div>
        <button type="button" class="btn-ok">${btnText}</button>
      </div>`;
    o.querySelector('.btn-ok').onclick = () => o.remove();
    o.onclick = e => { if (e.target === o) o.remove(); };
    R.appendChild(o);
  }

  const STR = {
    en: { name: 'English', sh: 'EN', grp: 'Linguistic Services', sec_train: 'Training Program', sec_gen: 'General Services', sec_prod: 'Production', sec_smart: 'Smart Services', sec_pers: 'Personal Services', i_finance: 'Katmanas' },
    ar: { name: 'العربية', sh: 'ع', grp: 'الخدمات اللغوية', sec_train: 'البرنامج التدريبي', sec_gen: 'خدمات لغوية عامة', sec_prod: 'إنتاج', sec_smart: 'الخدمات الذكية', sec_pers: 'خدمات شخصية', i_finance: 'كاتمانص' }
  };

  const IC = { train: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v5"/>' };
  const MOD = {};

  // مفاتيح أقسام الصيانة
  const maintKeys = ['compass', 'support', 'calendar', 'res'];
  const maintTitles = { compass: 'البوصلة', support: 'الدعم', calendar: 'التقويم', res: 'الموارد' };

  // تشغيل المطرقة في وسط شاشة العرض مع الشرار الذهبي
  function renderShowroomMaintenance(b, key) {
    const title = maintTitles[key] || 'الخدمة';
    b.innerHTML = `
      <div class="showroom-maint">
        <div class="maint-target" id="maintTarget">
          <div class="maint-title">${title}</div>
          <div class="maint-status">قيد التطوير والتجهيز</div>
          <div class="maint-hammer" id="maintH">
            <span class="uc-h">
              <svg viewBox="0 0 48 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
                <rect x="3" y="10.5" width="31" height="3" rx="1.5"/>
                <rect x="31" y="8" width="3.5" height="8" rx="1"/>
                <rect x="34" y="1.5" width="12" height="21" rx="2.5"/>
              </svg>
            </span>
          </div>
        </div>
      </div>
    `;

    const hBox = b.querySelector('#maintH');
    const svg = hBox.querySelector('svg');
    
    function strikeHit(delay, hasSparks) {
      setTimeout(() => {
        svg.animate([
          { transform: 'rotate(-45deg)' },
          { transform: 'rotate(0deg)', offset: 0.7 },
          { transform: 'rotate(-10deg)', offset: 0.85 },
          { transform: 'rotate(0deg)', offset: 1 }
        ], { duration: 160, easing: 'ease-out' });

        if (hasSparks) {
          for (let i = 0; i < 6; i++) {
            const sp = document.createElement('i');
            sp.className = 'uc-sp';
            const ang = -(20 + Math.random() * 140);
            const dist = 14 + Math.random() * 18;
            hBox.appendChild(sp);
            sp.animate([
              { transform: `rotate(${ang}deg) translateX(0) scale(0.5)`, opacity: 1 },
              { transform: `rotate(${ang}deg) translateX(${dist}px) scale(1)`, opacity: 0 }
            ], { duration: 320, easing: 'ease-out' }).onfinish = () => sp.remove();
          }
        }
      }, delay);
    }

    // إيقاع الدقات: تن... تن تن... تن
    strikeHit(300, true);
    strikeHit(520, false);
    strikeHit(680, true);
    strikeHit(950, true);
  }

  function ucPage(b, msgKey, cards) {
    renderShowroomMaintenance(b, cur);
  }

  // تحميل موديلات الخدمات
  ['calendar', 'compass', 'store', 'support', 'ydict', 'passist', 'view', 'res', 'finance', 'consult', 'digital', 'voice', 'dash', 'feed', 'messenger', 'translate', 'home', 'mirror', 'dict', 'library', 'space'].forEach(k => {
    if (window.ThabitBtn && window.ThabitBtn[k]) {
      MOD[k] = window.ThabitBtn[k]({
        R, $, STR, IC, MOD, cfg,
        lang: () => L, ucPage,
        esc: x => x,
        thName: (a, b) => THN(a, b),
        tidyFrame: () => {},
        get W() { return W; }, get L() { return L; }, get cur() { return cur; },
        get openLayer() { return openLayer; },
        get sbDot() { return () => {}; },
        get crumb() { return updateCrumb; }
      });
    }
  });

  const SEC = [['sec_train', ['compass', 'dash', 'ydict', 'res', 'dict', 'mirror', 'space', 'library', 'passist']], ['sec_gen', ['translate']]];
  const EXTRA = [['sec_prod', 'voice'], ['sec_smart', 'digital'], ['sec_pers', 'consult']];
  const sdi = k => '<button type="button" class="sdi" data-k="' + k + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + (IC[k] || '') + '</svg><span data-t="i_' + k + '"></span></button>';

  const storeBtn = (MOD.store && MOD.store.button ? MOD.store.button.replace('class="sdi"', 'class="sdi sub4"') : '<button type="button" class="sdi sub4" data-k="store"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5M3 9v11a1 1 0 001 1h16a1 1 0 001-1V9"/></svg></button>');
  const feedBtn = (MOD.feed && MOD.feed.button ? MOD.feed.button.replace('class="sdi"', 'class="sdi sub4"') : '<button type="button" class="sdi sub4" data-k="feed"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg></button>');
  const msgBtn = (MOD.messenger && MOD.messenger.button ? MOD.messenger.button.replace('class="sdi"', 'class="sdi sub4"') : '<button type="button" class="sdi sub4" data-k="messenger"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg></button>');
  const calBtn = (MOD.calendar && MOD.calendar.button ? MOD.calendar.button.replace('class="sdi"', 'class="sdi sub4"') : '<button type="button" class="sdi sub4" data-k="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>');
  
  const finBtn = (MOD.finance && MOD.finance.button ? MOD.finance.button.replace('class="sdi"', 'class="sdi sub3"') : '<button type="button" class="sdi sub3" data-k="finance"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 10h20"/></svg></button>');
  const viewBtn = (MOD.view && MOD.view.button ? MOD.view.button.replace('class="sdi"', 'class="sdi sub3"') : '<button type="button" class="sdi sub3" data-k="view"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>');
  const supBtn = (MOD.support && MOD.support.button ? MOD.support.button.replace('class="sdi"', 'class="sdi sub3"') : '<button type="button" class="sdi sub3" data-k="support"><svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0118 0v6M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3v5zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3v5z"/></svg></button>');

  const LINE = '<div class="sdl sp"></div>';

  // بناء السايد بار بالتقسيم المسنتر
  $('side').innerHTML = `
    <div class="sdr">
      <button type="button" class="sdi hm on" data-k="home">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        <span>الرئيسية</span>
      </button>
      ${storeBtn}
      ${feedBtn}
      ${msgBtn}
      ${calBtn}
      ${finBtn}
      ${viewBtn}
      ${supBtn}
    </div>
    ${LINE}
    <div class="sdh" data-t="grp">الخدمات اللغوية</div>
    ${SEC.map((sc, n) => (n ? '<div class="sps"></div>' : '') + '<div class="sdg" data-t="' + sc[0] + '"></div>' + sc[1].map(sdi).join('')).join('')}
    ${EXTRA.map(x => LINE + '<div class="sdh" data-t="' + x[0] + '"></div>' + sdi(x[1])).join('')}
  `;

  // عداد النوتيفيكيشن مع الـ Countdown التنازلي
  function applyBadgeCountdown(selector, targetCount) {
    const btn = R.querySelector(selector);
    if (!btn) return;
    let b = btn.querySelector('.badge-count');
    if (!b) {
      b = document.createElement('div');
      b.className = 'badge-count';
      btn.appendChild(b);
    }
    let current = 25;
    b.textContent = current;
    const interval = setInterval(() => {
      current--;
      b.textContent = current;
      if (current <= targetCount) {
        clearInterval(interval);
        b.textContent = targetCount;
        b.style.transform = 'scale(1.25)';
        setTimeout(() => b.style.transform = 'scale(1)', 200);
      }
    }, 45);
  }

  // تركيب الميدالية والمهارات بجوار اللوجو
  (function () {
    const hlg = $('hlg');
    const lv = document.createElement('button'); lv.type = 'button'; lv.className = 'lvl'; lv.id = 'lvlBtn';
    lv.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="15" r="5"/><circle cx="12" cy="15" r="1.6"/><path d="M8.7 11.4 6.6 3h4.1l1.3 4.2M15.3 11.4 17.4 3h-4.1L12 7.2"/></svg>';
    hlg.appendChild(lv);
    lv.onclick = () => showNotice('مستواك الحالي: المستوى الذهبي', 'أنت جيد في المهارات الأربعة جميعها، ولديك قدرات إضافية ممتازة.', 'حسناً', '<span style="color:#e0a100;font-size:24px">★</span>');

    const sk = document.createElement('button'); sk.type = 'button'; sk.className = 'lvl sk'; sk.id = 'skillsBtn';
    sk.innerHTML = '<svg viewBox="0 0 24 24"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/></svg>';
    hlg.appendChild(sk);
    sk.onclick = () => showNotice('المهارات الشخصية', 'الملكة الإبداعية • القدرة على الرصف • التلاعب بالنبرة والتعبير اللغوي.', 'حسناً', '<span style="color:#7c8cf8;font-size:24px">✦</span>');
  })();

  // الزر الأخضر (أونلاينر)
  $('stDot').onclick = e => {
    e.stopPropagation();
    showNotice('أنت الآن: Onliner', 'حالة ملفك خضراء، تعني متابعة كاملة من مدربك الخاص.', 'فهمت', '<span style="color:#22c55e;font-size:22px">●</span>');
  };

  // نظام تحديث العنوان في الهيدر (يختفي في الرئيسية)
  function updateCrumb() {
    const cr = $('crumb');
    if (cur === 'home') {
      cr.style.display = 'none';
    } else {
      cr.style.display = 'flex';
      let title = (STR[L] && STR[L]['i_' + cur]) || cur || '';
      if (cur === 'finance') title = 'كاتمانص';
      $('crumbTitle').textContent = title;
    }
  }

  // نظام تشغيل الماسنجر والفيد
  const PERS = { el: null, f: {} };
  function persBox() {
    if (PERS.el) return PERS.el;
    const d = document.createElement('div');
    d.style.cssText = 'position:absolute;inset:0;display:none;z-index:2;border-radius:20px;overflow:hidden;background:var(--card);';
    $('layer').appendChild(d);
    PERS.el = d;
    return d;
  }
  function persShow(k) {
    const box = persBox();
    box.style.display = 'block';
    if (!PERS.f[k]) {
      const f = document.createElement('iframe');
      f.style.cssText = 'width:100%;height:100%;border:0;background:transparent;';
      if (MOD[k] && MOD[k].srcdoc) f.srcdoc = MOD[k].srcdoc({ hash: location.hash });
      box.appendChild(f);
      PERS.f[k] = f;
    }
    Object.keys(PERS.f).forEach(x => { PERS.f[x].style.display = x === k ? 'block' : 'none'; });
  }
  function persHide() {
    if (PERS.el) PERS.el.style.display = 'none';
    Object.keys(PERS.f).forEach(x => { PERS.f[x].style.display = 'none'; });
  }

  // تبديل الطبقات
  function openLayer(k) {
    Object.keys(MOD).forEach(m => {
      if (m !== k && MOD[m] && typeof MOD[m].stop === 'function') MOD[m].stop();
    });
    persHide();

    const b = $('lbody');
    b.innerHTML = '';
    cur = k;

    R.querySelectorAll('.sdi').forEach(btn => btn.classList.toggle('on', btn.dataset.k === k));
    apply();
    updateCrumb();

    // لو قسم قيد التطوير: افتح الشاكوش في وسط الشاشة
    if (maintKeys.includes(k)) {
      renderShowroomMaintenance(b, k);
      return;
    }

    // فتح شاشات الـ iframe أو العرض العادي
    if (k === 'messenger' || k === 'feed' || (MOD[k] && MOD[k].srcdoc)) {
      persShow(k);
    } else if (MOD[k] && MOD[k].render) {
      MOD[k].render(b);
    }
  }

  $('side').addEventListener('click', e => {
    const b = e.target.closest('.sdi');
    if (b) openLayer(b.dataset.k);
  });
  $('logo').onclick = () => openLayer('home');

  function apply() {
    const t = STR[L] || {};
    W.dir = 'rtl';
    W.classList.add('ar');
    R.querySelectorAll('[data-t]').forEach(e => {
      if (e.dataset.t === 'i_finance') {
        e.textContent = 'كاتمانص';
      } else if (t[e.dataset.t]) {
        e.textContent = t[e.dataset.t];
      }
    });
  }

  // تعبئة البيانات والاسم الأول
  function fillUser() {
    const u = (cfg.getUser && cfg.getUser()) || {};
    const parsed = THN(u.name, true);
    const firstName = parsed.n || 'فاطمة';
    const initChar = firstName.charAt(0);
    $('profInit').textContent = initChar;
    $('pavInit').textContent = initChar;
    $('pn').textContent = firstName;
    $('pus').textContent = u.username || 'user';
  }

  $('prof').onclick = e => {
    e.stopPropagation();
    fillUser();
    $('pov').classList.add('on');
  };
  $('pov').onclick = e => { if (e.target === $('pov')) $('pov').classList.remove('on'); };

  // تبديل صورة اللوجو حسب الثيم من assets مباشرة
  function updateBrandLogo(isLight) {
    const img = $('mainLogoImg');
    if (img) {
      img.src = isLight ? 'assets/thabit-black.png' : 'assets/thabit-logo.png';
    }
  }

  // أيقونة الشمس والقمر
  function updateThemeIcon(isLight) {
    const svg = $('themeIconSvg');
    if (isLight) {
      svg.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" fill="none"/>';
    } else {
      svg.innerHTML = '<circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2"/>';
    }
  }

  $('btnThemeToggle').onclick = () => {
    const isLight = !W.classList.contains('light');
    W.classList.toggle('light', isLight);
    document.body.classList.toggle('light-theme', isLight);
    updateThemeIcon(isLight);
    updateBrandLogo(isLight);
    if (cfg.setLight) cfg.setLight(isLight);
  };

  $('btnLangToggle').onclick = () => {
    L = L === 'ar' ? 'en' : 'ar';
    $('btnLangToggle').textContent = L === 'ar' ? 'ع' : 'EN';
    apply();
    updateCrumb();
  };

  R.querySelectorAll('.plbtn span').forEach(sp => {
    sp.onclick = function() {
      this.parentElement.querySelectorAll('span').forEach(s => s.classList.remove('on'));
      this.classList.add('on');
    };
  });

  $('lout').onclick = () => cfg.logout();

  function start() {
    if (MOD.home && MOD.home.homeCss) MOD.home.homeCss();
    if (MOD.mirror && MOD.mirror.mirCss) MOD.mirror.mirCss();
    
    const isLight = W.classList.contains('light');
    fillUser();
    updateThemeIcon(isLight);
    updateBrandLogo(isLight);
    apply();
    openLayer('home');
    
    // تشغيل عداد النوتيفيكيشن التنازلي
    setTimeout(() => {
      applyBadgeCountdown('.sdr .sdi[data-k="messenger"]', 2);
      applyBadgeCountdown('.sdr .sdi[data-k="feed"]', 5);
    }, 600);

    return Promise.resolve();
  }
  return { start, openLayer };
}

function user() {
  var p = {};
  try { p = JSON.parse(localStorage.getItem('currentTrainee') || '{}'); } catch (e) { }
  var mem = {};
  try { mem = JSON.parse(localStorage.getItem('thMember') || '{}'); } catch (e) { }

  var rawName = p.full_name || p.name || p.first_name || mem.username || 'فاطمة';
  var firstNameOnly = rawName.trim().split(/\s+/)[0];

  return {
    name: firstNameOnly,
    username: p.username || mem.username || 'user'
  };
}

function logout() {
  localStorage.clear();
  sessionStorage.clear();
  location.replace('landing.html');
}

const app = THApp({
  host: document.getElementById('thApp'),
  lang: 'ar',
  light: localStorage.getItem('thThemeChoice') === 'light',
  setLight: function (b) {
    document.body.classList.toggle('light-theme', b);
    localStorage.setItem('thThemeChoice', b ? 'light' : 'dark');
  },
  getUser: user,
  logout: logout
});
app.start();
</script>
