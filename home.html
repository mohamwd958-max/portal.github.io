})();

      transition:scale var(--rc-slow) var(--rc-ease)!important}
    /* any older hover effect on the card (Css/portal.css) is cancelled here; hover now comes only from Real-click animation */

const THN = (() => {
  const en = new Map(), en2 = new Map(), ar = new Map();
  const nz = s => s.replace(/[ً-ٰٟـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  const dd = s => s.replace(/(.)\1+/g, '$1'), cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s;

    vs.forEach(v => { if (!en.has(v)) en.set(v, e); const d = dd(v); if (!en2.has(d)) en2.set(d, e); });
    ar.set(nz(x[1]), e);
  });
  const near = (a, b) => {
    if (Math.abs(a.length - b.length) > 1) return false;
    let i = 0, j = 0, e = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++e > 1) return false;
      if (a.length > b.length) i++; else if (a.length < b.length) j++; else { i++; j++; }
    }
    return e + (a.length - i) + (b.length - j) <= 1;

  return function (raw, wantAr) {

    if (!t) return { n: '', g: '' };
