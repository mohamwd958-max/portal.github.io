const THN = (() => {
  const en = new Map(), ar = new Map();
  const nz = s => s.replace(/[ً-ٰٟـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه');
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : s;
  TH_NAMES.forEach(r => {
    const x = r.split('|'), p = x[0].split(':'), vs = p[1].split(' ');
    vs.forEach(v => { en.set(v.toLowerCase(), { a: x[1], c: cap(v) }); });
    ar.set(nz(x[1]), { a: x[1], c: cap(vs[0]) });
  });
  return function (raw, wantAr) {
    let t = String(raw || '').trim().split(/[\s._\-@]+/)[0] || '';
    t = t.replace(/[0-9]+/g, '');
    if (!t) return { n: '', g: '' };
    if (/[؀-ۿ]/.test(t)) {
      const e = ar.get(nz(t));
      return { n: wantAr ? t : (e ? e.c : t), g: '' };
    }
    const key = t.toLowerCase().replace(/[^a-z]/g, '');
    const e = en.get(key);
    return { n: wantAr && e ? e.a : cap(t), g: '' };
  };
})();

function THApp(cfg) {
  'use strict';
  const R = cfg.host.attachShadow({ mode: 'open' });
  R.innerHTML = '<style>' + THAPP_CSS + '</style>' + THAPP_HTML;

  const $ = id => R.getElementById(id), W = $('W'), isDk = () => window.matchMedia('(min-width:876px)').matches;
  let L = cfg.lang === 'ar' ? 'ar' : 'en', cur = null;

  const IC = { train: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v5"/>' };
  const MOD = {};
  ['calendar', 'compass', 'store', 'support', 'ydict', 'passist', 'view', 'res', 'finance', 'consult', 'digital', 'voice', 'dash', 'feed', 'messenger', 'translate', 'home', 'mirror', 'dict', 'library', 'space'].forEach(k => {
    if (window.ThabitBtn && window.ThabitBtn[k]) {
      MOD[k] = window.ThabitBtn[k]({
        R, $, STR: { en: {}, ar: {} }, IC, MOD, cfg,
        lang: () => L, esc: x => x,
        thName: (a, b) => THN(a, b),
        tidyFrame: () => {},
        get W() { return W; }, get L() { return L; }, get cur() { return cur; }, openLayer
      });
    }
  });

  const SEC = [['sec_train', ['compass', 'dash', 'ydict', 'res', 'dict', 'mirror', 'space', 'library', 'passist']], ['sec_gen', ['translate']]];
  const EXTRA = [['sec_prod', 'voice'], ['sec_smart', 'digital'], ['sec_pers', 'consult']];
  const sdi = k => !IC[k] ? '' : '<button type="button" class="sdi" data-k="' + k + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + IC[k] + '</svg><span data-t="i_' + k + '"></span></button>';

  // بناء القائمة الجانبية بالـ 7 زراير بالكامل تحت الهوم
  const storeBtn = (MOD.store && MOD.store.button) || '';
  const msgBtn = (MOD.messenger && MOD.messenger.button) || '';
  const feedBtn = (MOD.feed && MOD.feed.button) || '';
  const calBtn = (MOD.calendar && MOD.calendar.button) || '';
  const supBtn = (MOD.support && MOD.support.button) || '';
  const viewBtn = (MOD.view && MOD.view.button) || '';
  const finBtn = (MOD.finance && MOD.finance.button) || '';
  const LINE = '<div class="sdl sp"></div>';

  $('side').innerHTML = '<div class="sdr">' + sdi('home').replace('class="sdi"', 'class="sdi hm"') + '<i class="sdbr"></i>' + storeBtn + feedBtn + msgBtn + calBtn + '<i class="sdbr"></i>' + supBtn + viewBtn + finBtn + '</div>' + LINE +
    '<div class="sdh">الخدمات اللغوية</div>' +
    SEC.map(sc => '<div class="sdg">' + (sc[0] === 'sec_train' ? 'البرنامج التدريبي' : 'خدمات عامة') + '</div>' + sc[1].map(sdi).join('')).join('') +
    EXTRA.map(x => LINE + '<div class="sdh">' + (x[0] === 'sec_prod' ? 'إنتاج' : x[0] === 'sec_smart' ? 'الخدمات الذكية' : 'خدمات شخصية') + '</div>' + sdi(x[1])).join('');

  // تركيب أزرار الليفل والمهارات جنب اللوجو
  (function () {
    const lg = $('logo'); if (!lg || $('hlg')) return;
    const g = document.createElement('div'); g.id = 'hlg'; lg.parentNode.insertBefore(g, lg); g.appendChild(lg);
    const lv = document.createElement('button'); lv.type = 'button'; lv.className = 'lvl'; lv.id = 'lvlBtn';
    lv.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="15" r="5"/><circle cx="12" cy="15" r="1.6"/><path d="M8.7 11.4 6.6 3h4.1l1.3 4.2M15.3 11.4 17.4 3h-4.1L12 7.2"/></svg>';
    g.appendChild(lv);
    const sk = document.createElement('button'); sk.type = 'button'; sk.className = 'lvl sk'; sk.id = 'skillsBtn';
    sk.innerHTML = '<svg viewBox="0 0 24 24"><path d="M11 3l1.9 5.1L18 10l-5.1 1.9L11 17l-1.9-5.1L4 10l5.1-1.9z"/></svg>';
    g.appendChild(sk);
  })();

  // تفعيل الدائرة الخضراء (أونلاينر)
  const sd = $('stDot');
  if (sd) {
    sd.onclick = () => alert('حالة ملفك هي Onliner: متابعة كاملة من المدرب.');
  }

  if (MOD.home && MOD.home.homeCss) MOD.home.homeCss();

  $('sbtn').onclick = () => W.classList.toggle('sbo');

  function openLayer(k) {
    cur = k;
    const b = $('lbody');
    if (MOD[k] && MOD[k].render) MOD[k].render(b);
    R.querySelectorAll('.sdi').forEach(btn => btn.classList.toggle('on', btn.dataset.k === k));
    W.classList.remove('sbo');
  }

  $('side').addEventListener('click', e => { const b = e.target.closest('.sdi'); if (b) openLayer(b.dataset.k); });
  $('logo').onclick = () => openLayer('home');

  // جلب وتنسيق الاسم الأول فقط
  function fillUser() {
    const u = (cfg.getUser && cfg.getUser()) || {};
    const parsed = THN(u.name, L === 'ar');
    $('pn').textContent = parsed.n || 'متدرب';
    $('pus').textContent = u.username || 'user';
    $('pph').textContent = u.phone || '-';
    $('pem').textContent = u.email || '-';
  }

  $('prof').onclick = e => {
    e.stopPropagation();
    fillUser();
    $('pov').classList.add('on');
  };
  $('pov').onclick = e => { if (e.target === $('pov')) $('pov').classList.remove('on'); };
  $('lout').onclick = () => cfg.logout();

  W.style.setProperty('--thlogo', TH_LOGO);

  function start() {
    openLayer('home');
    return Promise.resolve();
  }
  return { start, openLayer };
}

// دالة جلب بيانات المتدرب الحقيقي (الاسم الأول والبيانات)
function user() {
  var p = {};
  try { p = JSON.parse(localStorage.getItem('currentTrainee') || '{}'); } catch (e) { }
  var mem = {};
  try { mem = JSON.parse(localStorage.getItem('thMember') || '{}'); } catch (e) { }

  // استخراج الاسم الأول فقط
  var rawName = p.full_name || p.name || p.first_name || mem.username || '';
  var firstNameOnly = rawName.trim().split(/\s+/)[0];

  return {
    name: firstNameOnly,
    username: p.username || mem.username || '',
    phone: p.phone || p.phone_number || '',
    email: p.email || ''
  };
}

function logout() {
  localStorage.clear();
  sessionStorage.clear();
  location.replace('landing.html');
}

const app = THApp({
  host: document.getElementById('thApp'),
  lang: 'ar',
  getUser: user,
  logout: logout
});
app.start();
</script>
