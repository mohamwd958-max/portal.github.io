<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="js/thabit-loader.js"></script>
<title>Welcome to Thabit</title>
<link rel="icon" type="image/svg+xml" href="assets/thabit-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   WELCOME PAGE  -  first thing a visitor sees
   Language: detected from the visitor's location (timezone / browser). Arabic countries -> Arabic, everything else -> English.
   The visitor can change it from the small button next to the theme button.
   ROUTES at the bottom of the script say where each button goes.
   ========================================================= */
:root{
  --ink:#ece8df; --ink2:rgba(236,232,223,.72);
  --gbg:rgba(255,255,255,.08); --gbd:rgba(255,255,255,.14); --gfield:rgba(255,255,255,.1);
  --btn:#ece8df; --onbtn:#15130f; --acc:#fbbf24; --bad:#f87171; --ok:#34d399;
  --ov1:rgba(10,14,26,.84); --ov2:rgba(10,14,26,.5);
  --ease:cubic-bezier(.22,1,.36,1)
}
body.light{
  --ink:#1c1a16; --ink2:rgba(28,26,22,.7);
  --gbg:rgba(255,255,255,.42); --gbd:rgba(28,26,22,.1); --gfield:rgba(255,255,255,.55);
  --btn:#1c1a16; --onbtn:#f4f1ea; --acc:#b45309; --bad:#dc2626; --ok:#059669;
  --ov1:rgba(244,241,234,.92); --ov2:rgba(244,241,234,.55)
}
*{box-sizing:border-box;margin:0}
html{font-size:90%}
html,body{min-height:100%;background:#121419}
body{font-family:Inter,Cairo,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.ar{font-family:Cairo,Inter,system-ui,sans-serif}
.bg{position:fixed;inset:0;z-index:0;background:#121419;opacity:0;animation:fadeIn 1.4s ease .1s forwards;overflow:hidden}
.bg i{position:absolute;display:block;background-repeat:no-repeat;transition:opacity 1.4s ease}
.bg .bn{background-image:url(assets/welcome-bg.jpg)}
.bg .bd{background-image:url(assets/welcome-bg-day.jpg);opacity:0}
body.light .bg .bd{opacity:1}   /* light theme: the day photo fades in over the night one */
/* the photo always FILLS the screen (no frame). The script slides it so the door + stairs stay in view:
   sideways on phones (stairs in the middle), up/down on laptops (door near the top edge) */
.bg .bs{inset:0;background-size:cover;background-position:var(--dx,50%) var(--dy,50%)}
/* two veils that cross-fade, so the theme changes slowly and softly */
.vd,.vl{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity 1.4s ease}
.vd{background:linear-gradient(180deg,rgba(18,20,26,.55) 0%,rgba(18,20,26,.15) 38%,rgba(18,20,26,.6) 100%);opacity:1}
.vl{background:linear-gradient(180deg,rgba(236,232,222,.92) 0%,rgba(236,232,222,.62) 38%,rgba(236,232,222,.86) 100%);opacity:0}
body.light .vd{opacity:0}body.light .vl{opacity:1}
body.th-fade,body.th-fade *,body.th-fade *::before,body.th-fade *::after{transition:background-color 1.4s ease,color 1.4s ease,border-color 1.4s ease,box-shadow 1.4s ease,fill 1.4s ease,stroke 1.4s ease,opacity 1.4s ease!important}

main{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;text-align:center}
.intro{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
.intro>.hello,.intro>.brand,.intro>.tag{padding:0 20px}

/* ---------- title ---------- */
.hello{font:italic 500 clamp(1.3rem,4.6vw,2rem)/1 'Playfair Display',Georgia,serif;letter-spacing:.5px;color:var(--ink2)}
.brand{font:800 clamp(3.2rem,15vw,7rem)/1 'Playfair Display',Georgia,serif;letter-spacing:-.02em;margin:.08em 0 .14em;color:var(--ink)}
.tag{font:600 clamp(.72rem,2.6vw,.95rem)/1.2 Inter,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:var(--ink2)}
body.ar .hello{font:600 clamp(1.3rem,4.6vw,2rem)/1.2 Cairo,sans-serif;letter-spacing:0}
body.ar .brand{font:900 clamp(3.2rem,15vw,7rem)/1.15 Cairo,sans-serif;letter-spacing:0}
body.ar .tag{letter-spacing:.04em;text-transform:none;font-size:clamp(.95rem,3.2vw,1.15rem)}
body.light .hello,body.light .tag{color:var(--ink);text-shadow:0 0 14px rgba(255,255,255,.9),0 0 5px rgba(255,255,255,.7)}
body.light .tag{font-weight:700}
body:not(.light) .hello,body:not(.light) .tag{text-shadow:0 1px 12px rgba(0,0,0,.55)}
/* name | TH logo: so it is clear this is the Thabit program */
.brand{display:flex;align-items:center;justify-content:center;gap:.2em}
.brand .bar{flex:none;width:2px;height:.62em;border-radius:2px;background:var(--ink);opacity:.45}
.brand .mk{flex:none;width:.74em;height:.74em;background:var(--ink);-webkit-mask:var(--thlogo) center/contain no-repeat;mask:var(--thlogo) center/contain no-repeat}
.rise{opacity:0;filter:blur(14px);translate:0 18px;animation:rise 1.1s cubic-bezier(.16,1,.3,1) forwards}
.hello.rise{animation-delay:.5s}.brand.rise{animation-delay:.8s}.tag.rise{animation-delay:1.25s}
.wrap.rise{animation-delay:1.8s}
@keyframes rise{to{opacity:1;filter:blur(0);translate:0 0}}
@keyframes fadeIn{to{opacity:1}}

/* ---------- top buttons: theme (sun / moon) + language name ---------- */
.ctl{position:fixed;top:max(9px,env(safe-area-inset-top,0px));right:14px;z-index:5;display:flex;gap:8px;direction:ltr;opacity:0;transition:opacity .8s}
.ctl.on{opacity:1}
.cb{position:relative;height:34px;min-width:34px;padding:0 14px;border-radius:20px;border:1px solid var(--gbd);background:var(--gbg);color:var(--ink);cursor:pointer;font:700 .8rem Inter,Cairo,sans-serif;
  display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-tap-highlight-color:transparent;transition:scale .6s var(--ease)}
.cb:hover{scale:1.05}.cb:active{scale:.94}
.cb.ic{width:34px;padding:0}
.cb svg{position:absolute;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:opacity 1.2s ease,rotate 1.2s var(--ease)}
.cb .sun{opacity:0;rotate:-70deg}.cb .moon{opacity:1;rotate:0deg}
body.light .cb .sun{opacity:1;rotate:0deg}body.light .cb .moon{opacity:0;rotate:70deg}

/* ---------- the two cards: always one under the other, almost full width ---------- */
.wrap{margin:0;padding:0 clamp(12px,2vw,28px);width:100%;display:flex;flex-direction:column;align-items:center}
.stack{width:100%;display:flex;flex-direction:column;gap:10px;direction:ltr}
.card{background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(64px) saturate(1.5);backdrop-filter:blur(64px) saturate(1.5);box-shadow:0 10px 40px rgba(0,0,0,.18);
  position:relative;isolation:isolate;overflow:hidden;width:100%;padding:24px 20px;border-radius:24px;border:1px solid var(--gbd);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:start;color:var(--ink)}
.card>*{position:relative;z-index:2;width:100%;max-width:340px}
.card h2{font:700 1.2rem Inter,Cairo,sans-serif;text-align:center;margin-bottom:14px}
.ncard{text-align:center}
.hold{opacity:0}.hid{display:none}
.tag,body.ar .tag,body.light .tag{font:italic 500 clamp(1.05rem,3.6vw,1.5rem)/1.5 'Playfair Display',Georgia,serif;letter-spacing:0;text-transform:none;color:var(--ink2)}
body.ar .tag{font:600 clamp(1.1rem,3.8vw,1.5rem)/1.6 Cairo,Inter,sans-serif}
.card.ready{min-height:0;padding:12px 20px;cursor:pointer;appearance:none;-webkit-appearance:none;font:700 1rem Inter,Cairo,sans-serif;color:var(--ink);margin-bottom:10px;-webkit-tap-highlight-color:transparent;transition:scale .6s var(--ease)}
body.ar .card.ready{font-family:Cairo,Inter,sans-serif}
@media(hover:hover){.card.ready:hover{scale:1.01}}
.card.ready:active{scale:.98}
.stack .rise{animation-duration:.7s}.stack .rise2{animation-duration:.6s}
.hlogo{position:fixed;z-index:5;background:var(--ink);-webkit-mask:var(--thlogo) center/contain no-repeat;mask:var(--thlogo) center/contain no-repeat;pointer-events:none;transition:left .9s cubic-bezier(.65,0,.35,1),top .9s cubic-bezier(.65,0,.35,1),width .9s cubic-bezier(.65,0,.35,1),height .9s cubic-bezier(.65,0,.35,1)}
.hlogo.fin{left:16px;top:max(14px,env(safe-area-inset-top,0px));width:30px;height:30px}
.gl{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;padding:62px 16px 24px;overflow:auto;overscroll-behavior:contain;background:rgba(14,16,22,.55);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}
body.light .gl{background:rgba(236,232,222,.6)}
.gl.on{display:flex;animation:fadeFrom .35s ease}
.gl .card{width:100%;max-width:none;margin:auto;padding:0;background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;overflow:visible}
.gl .card h2{margin-bottom:6px}
.gl .fl{opacity:1}
.gl.on .fl{animation:gdrop .45s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(var(--i)*.09s + .1s)}
.gl.on .card h2{animation:fadeUp .4s ease backwards}
.gl.on .gform .btn{animation:fadeUp .4s ease 1s backwards}
.gl.on .gform .btn+.btn{animation-delay:1.08s}
@keyframes gdrop{from{opacity:0;translate:0 -60px}to{opacity:1;translate:0 0}}
@keyframes fadeUp{from{opacity:0;translate:0 14px}to{opacity:1;translate:0 0}}
body.lock{overflow:hidden;height:100%}
.card>.gform{max-width:none;display:grid;grid-template-columns:1fr;gap:0}
.gform .btn{grid-column:1/-1;width:100%;max-width:340px;justify-self:center;margin-top:14px}
.gform .btn+.btn{margin-top:8px}
.gform .rem{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;font:600 .85rem Inter,Cairo,sans-serif;color:var(--ink2);cursor:pointer}
.rem input{width:18px;height:18px;accent-color:var(--ink)}
.gl.on .rem{animation:fadeUp .4s ease .95s backwards}
.q{font:600 clamp(1rem,2.4vw,1.2rem)/1.3 Inter,Cairo,sans-serif;text-align:center;color:var(--ink);padding:0 12px;text-shadow:0 1px 12px rgba(0,0,0,.55)}
body.ar .q{font-family:Cairo,Inter,sans-serif}
body.light .q{text-shadow:0 0 14px rgba(255,255,255,.9),0 0 5px rgba(255,255,255,.7)}
.q2{margin-top:14px}
.rise2{opacity:0;translate:0 22px;animation:rise2 1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rise2{to{opacity:1;translate:0 0}}
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.meteor{position:absolute;width:90px;height:1.5px;border-radius:2px;transform-origin:100% 50%;opacity:0;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(190,215,255,.85) 70%,#fff);box-shadow:0 0 6px 1px rgba(170,200,255,.3)}
body.light .card{background:rgba(255,255,255,.5);border-color:rgba(255,255,255,.7)}
.pop .btn+.btn{margin-top:10px}
.ncard h2{margin-bottom:16px;font-size:clamp(1.1rem,2.1vw,1.55rem);font-weight:600}
.card>.nact{width:auto;max-width:none;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.nact .btn{width:auto;min-width:140px;padding:0 24px}

/* login card: floating labels */
.fl{position:relative;padding-top:18px;margin:0 0 2px}
.fl input{display:block;width:100%;height:42px;padding:0 14px;border-radius:14px;border:1px solid var(--gbd);background:var(--gfield);color:var(--ink);font:500 .92rem Inter,Cairo,sans-serif;outline:0;text-align:left;direction:ltr;
  caret-color:var(--ink);-webkit-text-fill-color:var(--ink);transition:border-color .3s,box-shadow .3s,background .3s,scale .9s var(--ease)}
.fl input::placeholder{color:transparent}
.fl.pw input{padding-right:46px}
@media(hover:hover){.fl input:hover{scale:1.02}}
.fl input:active{scale:.975;transition:scale .45s ease-out}
.fl input:-webkit-autofill,.fl input:-webkit-autofill:focus{-webkit-text-fill-color:var(--ink)!important;caret-color:var(--ink);transition:background-color 600000s 0s,color 600000s 0s}
.fl.act input{border-color:var(--ink);box-shadow:0 0 0 3px rgba(128,128,128,.16)}
.fl label{position:absolute;left:15px;top:39px;transform:translateY(-50%);margin:0;font:500 .92rem Inter,Cairo,sans-serif;opacity:.6;pointer-events:none;white-space:nowrap;transition:top .3s var(--ease),font-size .3s,opacity .3s,color .3s}
.fl.act label,.fl input:not(:placeholder-shown)+label,.fl input:-webkit-autofill+label{top:6px;font-size:.72rem;font-weight:700;opacity:.9}
.fl.act label{color:var(--ink);opacity:1}
.fl.ok input{border-color:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.12)}
.fl.ok label{color:var(--ok);opacity:1}
.fl.bad input{border-color:var(--bad);box-shadow:0 0 0 3px rgba(248,113,113,.14)}
.fl.bad label{color:var(--bad);opacity:1}
.fmsg{max-height:0;overflow:hidden;opacity:0;color:var(--bad);font:600 .72rem Inter,Cairo,sans-serif;transition:max-height .3s,opacity .3s,margin .3s}
.fmsg.show{max-height:24px;opacity:1;margin-top:6px}
.fhint{position:absolute;left:15px;top:39px;transform:translateY(-50%);direction:ltr;white-space:nowrap;pointer-events:none;font:500 .92rem Inter,sans-serif;opacity:.4;transition:opacity .35s}
.lalert{max-height:0;overflow:hidden;opacity:0;margin:0;font:600 .8rem/1.4 Inter,Cairo,sans-serif;color:var(--bad);text-align:center;transition:max-height .3s,opacity .3s,margin .3s}
.lalert.show{max-height:60px;opacity:1;margin:0 0 6px}
/* eye */
.eye{position:absolute;right:10px;top:39px;translate:0 -50%;width:30px;height:30px;padding:0;border:0;background:none;color:var(--ink);opacity:.65;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:scale .9s var(--ease),opacity .25s}
@media(hover:hover){.eye:hover{opacity:1;scale:1.05}}
.eye:active{scale:.94;transition:scale .45s ease-out}
.eye svg{width:19px;height:19px;display:block;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.eye .pup{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:center}
.eye.glow .pup{animation:pupGlow 1.3s ease-in-out 1}
@keyframes pupGlow{0%{fill:currentColor;filter:none;scale:1}35%{fill:#fbbf24;filter:drop-shadow(0 0 3px #fbbf24) drop-shadow(0 0 8px rgba(251,191,36,.9));scale:1.5}100%{fill:currentColor;filter:none;scale:1}}
.fl.show input{color:transparent;-webkit-text-fill-color:transparent}
.pwv{position:absolute;left:0;right:0;top:18px;height:42px;padding:0 46px 0 14px;overflow:hidden;pointer-events:none;-webkit-user-select:none;user-select:none;direction:ltr;display:none;align-items:center}
.fl.show .pwv{display:flex}
.pwi{display:flex;white-space:pre;font:500 .92rem Inter,Cairo,sans-serif;color:var(--ink)}
.pwi span{display:inline-block;transition:filter .55s ease,opacity .55s ease}
.pwi span.bl{filter:blur(9px);opacity:.25}
/* Get In: square -> circle -> check */
.lbtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;width:100%;height:42px;margin:18px auto 0;border:0;border-radius:14px;background:var(--btn);color:var(--onbtn);font:800 .92rem Inter,Cairo,sans-serif;cursor:pointer;
  transition:width .5s cubic-bezier(.65,0,.35,1),border-radius .5s cubic-bezier(.65,0,.35,1),background .3s,color .3s,opacity .3s,scale .9s var(--ease)}
@media(hover:hover){.lbtn[data-state=idle]:hover{scale:1.03;opacity:.93}}
.lbtn[data-state=idle]:active{scale:.975;transition:scale .45s ease-out,width .5s,border-radius .5s}
.lbtn[data-state=busy],.lbtn[data-state=done]{width:42px;border-radius:21px}
.lbtn .bt{white-space:nowrap;transition:opacity .15s}
.lbtn[data-state=busy] .bt,.lbtn[data-state=done] .bt{opacity:0}
.lbtn .sp{position:absolute;left:50%;top:50%;translate:-50% -50%;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;opacity:0;animation:lgSpin .8s linear infinite;transition:opacity .25s}
.lbtn[data-state=busy] .sp{opacity:1}
.lbtn .ck{position:absolute;left:50%;top:50%;translate:-50% -50%;width:26px;height:26px;opacity:0;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.lbtn .ck path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s ease .1s}
.lbtn[data-state=done]{background:#16a34a;color:#fff}
.lbtn[data-state=done] .ck{opacity:1}.lbtn[data-state=done] .ck path{stroke-dashoffset:0}
@keyframes lgSpin{to{rotate:360deg}}

.btn{width:100%;height:42px;border:0;border-radius:14px;background:var(--btn);color:var(--onbtn);font:800 .92rem Inter,Cairo,sans-serif;cursor:pointer;transition:opacity .25s,scale .9s var(--ease)}
@media(hover:hover){.btn:hover{opacity:.93;scale:1.02}}
.btn:active{scale:.975;transition:scale .45s ease-out}
.btn.ghost{background:var(--gfield);color:var(--ink);border:1px solid var(--gbd)}
.or{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0;font:600 .78rem Inter,Cairo,sans-serif;color:var(--ink2)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--gbd)}

/* ---------- pop-up ("coming soon") ---------- */
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov.on{display:flex;animation:fadeFrom .35s ease}
.pop{position:relative;width:min(100%,380px);padding:28px 24px 22px;border-radius:24px;border:1px solid var(--gbd);color:var(--ink);text-align:center;-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);animation:pop .5s cubic-bezier(.16,1,.3,1)}
body.light .pop{background:rgba(250,248,243,.88)}body:not(.light) .pop{background:rgba(18,22,34,.78)}
@keyframes pop{from{opacity:0;scale:.94;translate:0 14px}to{opacity:1;scale:1;translate:0 0}}
.pop h3{font:700 1.2rem/1.35 Inter,Cairo,sans-serif;margin:6px 0}
.pop p{font:500 .88rem/1.6 Inter,Cairo,sans-serif;color:var(--ink2);margin-bottom:18px}
.gears{display:flex;justify-content:center;align-items:flex-end;gap:2px;color:var(--acc);margin-bottom:8px}
.gears svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gears svg:first-child{width:46px;height:42px;animation:spin 5s linear infinite}
.gears svg:last-child{width:32px;height:32px;margin-bottom:2px;animation:spin 3.4s linear infinite reverse}
@keyframes spin{to{rotate:360deg}}
@media(prefers-reduced-motion:reduce){.rise,.rise2,.bg,.ctl{animation-duration:.01s!important;animation-delay:0s!important}}

/* =========================================================
   NEW FLOW: intro centered -> "Ready" at the bottom -> layer with the two cards
   ========================================================= */
/* language / theme buttons stay hidden (and untouchable) until the intro ends */
.ctl{pointer-events:none}.ctl.on{pointer-events:auto}

/* the Ready button: almost full width, a finger of space on each side */
.rbtn{position:absolute;top:100%;left:28px;right:28px;max-width:460px;margin:clamp(26px,5vh,46px) auto 0;height:54px;border-radius:20px;border:1px solid var(--gbd);
  background:var(--gbg);color:var(--ink);font:700 1.05rem Inter,Cairo,sans-serif;cursor:pointer;-webkit-backdrop-filter:blur(40px) saturate(1.4);backdrop-filter:blur(40px) saturate(1.4);
  box-shadow:0 10px 40px rgba(0,0,0,.18);-webkit-tap-highlight-color:transparent;transition:scale .9s var(--ease)}
body.ar .rbtn{font-family:Cairo,Inter,sans-serif}
@media(hover:hover){.rbtn:hover{scale:1.015}}

/* the cards layer: a new layer on the same page, cards start from the top */
.wrap{position:fixed;inset:0;z-index:3;overflow-y:auto;overscroll-behavior:contain;padding:calc(58px + env(safe-area-inset-top,0px)) clamp(12px,2vw,28px) calc(64px + env(safe-area-inset-bottom,0px))}
.wrap.on{animation:none}

/* invisible header: appears (thin, bottom border + heavy blur) only when something passes under it */
.hdr{position:fixed;top:0;left:0;right:0;z-index:4;height:calc(max(9px,env(safe-area-inset-top,0px)) + 43px);pointer-events:none;opacity:0;
  border-bottom:1px solid var(--gbd);background:rgba(18,20,26,.28);-webkit-backdrop-filter:blur(28px) saturate(1.4);backdrop-filter:blur(28px) saturate(1.4);transition:opacity .35s ease}
body.light .hdr{background:rgba(244,241,234,.4)}
.hdr.on{opacity:1}

/* "Become one of us" layer text */
.jp{grid-column:1/-1;text-align:center;font:500 1rem/1.7 Inter,Cairo,sans-serif;color:var(--ink);margin:10px 0 6px}
body.ar .jp{font-family:Cairo,Inter,sans-serif}
/* =========================================================
   v3: one glass for everything, press feel, centered cards, soft backdrop
   ========================================================= */
:root{--gblur:blur(40px) saturate(1.4)}
.stack .card,body.light .stack .card,.pop,body.light .pop,body:not(.light) .pop,.cb,.rbtn{background:var(--gbg);-webkit-backdrop-filter:var(--gblur);backdrop-filter:var(--gblur)}
.stack .card,body.light .stack .card{border-color:var(--gbd);box-shadow:0 10px 40px rgba(0,0,0,.18)}

/* cards: in the middle of the screen, with room to pull them up under the buttons */
.stack{gap:18px;margin-block:auto}
.wrap::after{content:"";position:absolute;left:0;top:140vh;width:1px;height:1px}

/* the questions live inside their cards */
.card .q{text-shadow:none!important;padding:0;margin:0 0 14px;text-align:center;font:600 1rem/1.4 Inter,Cairo,sans-serif;color:var(--ink)}
body.ar .card .q{font-family:Cairo,Inter,sans-serif}
.card .q1{margin:-8px 0 14px;font-size:.88rem;color:var(--ink2)}

/* no blue box / highlight when a button is pressed */
button{-webkit-tap-highlight-color:transparent;outline:none;-webkit-user-select:none;user-select:none}
button:focus,button:focus-visible{outline:none}

/* real click: goes down quickly like a finger pressing, comes back up slowly and softly */
.cb,.rbtn{transition:scale .9s var(--ease)}
.btn:active,.rbtn:active,.cb:active,.eye:active{scale:.94;transition:scale .12s ease-out}
.lbtn[data-state=idle]:active{scale:.94;transition:scale .12s ease-out,width .5s cubic-bezier(.65,0,.35,1),border-radius .5s cubic-bezier(.65,0,.35,1)}

/* a soft shade behind the intro so it stands out from the stairs */
body.light .sky{display:none}
.intro::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1.4s ease;
  background:radial-gradient(ellipse 62% 38% at 50% 50%,rgba(8,11,20,.62) 0%,rgba(8,11,20,.36) 45%,rgba(8,11,20,0) 100%)}
body.light .intro::before{background:radial-gradient(ellipse 62% 38% at 50% 50%,rgba(244,241,234,.75) 0%,rgba(244,241,234,.45) 45%,rgba(244,241,234,0) 100%)}
.intro.lit::before{opacity:1}

/* the page itself never moves: no sideways / up-down drag, everything is centred */
html,body{height:100%;overflow:hidden}
@keyframes fadeFrom{from{opacity:0}}
/* pop-ups: the dark scrim is a separate layer, so the pop-up glass can really blur the page behind it */
.ov{background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.ov::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

/* =========================================================
   v4: brand in the top-left, saved-passwords pop-up, green autofill
   ========================================================= */
:root{--sugbg:rgba(20,24,36,.9)}
body.light{--sugbg:rgba(250,248,243,.94)}

/* the logo alone fades in at the top-left (left -> right) once "Ready" is pressed; a little smaller than the theme circle */
.hb{position:fixed;z-index:5;left:15px;top:calc(max(9px,env(safe-area-inset-top,0px)) + 4.5px);width:25px;height:25px;pointer-events:none;opacity:0;translate:-10px 0;clip-path:inset(-8px 100% -8px -8px)}
.hb .mk{display:block;width:100%;height:100%;background:var(--ink);-webkit-mask:var(--thlogo) center/contain no-repeat;mask:var(--thlogo) center/contain no-repeat}
.hb.on{animation:hbIn 1.4s cubic-bezier(.22,1,.36,1) .25s forwards}
.hb.out{animation:hbOut .35s ease forwards}
@keyframes hbIn{0%{opacity:0;translate:-10px 0;clip-path:inset(-8px 100% -8px -8px)}55%{opacity:1}100%{opacity:1;translate:0 0;clip-path:inset(-8px -10px -8px -8px)}}
@keyframes hbOut{from{opacity:1;translate:0 0;clip-path:inset(-8px -10px -8px -8px)}to{opacity:0;translate:0 0;clip-path:inset(-8px -10px -8px -8px)}}
@media(prefers-reduced-motion:reduce){.hb.on{animation-duration:.01s!important;animation-delay:0s!important}}

 /* pop-ups ("Welcome back, are you ...?" etc.): the page behind blurs the very instant you tap and the card rises with it.
   The container never fades (an opacity on it switches the blur off until the end), and it stays laid out, so nothing has to be built on tap */
.ov,.ov.on{display:flex;animation:none}
.ov{visibility:hidden;pointer-events:none;transition:visibility 0s .3s}
.ov.on{visibility:visible;pointer-events:auto;transition:visibility 0s}
.ov::before{opacity:0;transition:opacity .28s ease;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ov.on::before{opacity:1}
.ov .pop{animation:none;opacity:0;scale:.94;translate:0 14px;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);transition:opacity .3s ease,scale .45s var(--ease),translate .45s var(--ease)}
.ov.on .pop{opacity:1;scale:1;translate:0 0;transition-delay:.05s}

/* saved passwords on touch screens: small cells right above the keyboard */
.kbs{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:8px;padding:8px 10px;overflow-x:auto;overscroll-behavior:contain;scrollbar-width:none;direction:ltr;
  background:var(--sugbg);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);border-top:1px solid var(--gbd);
  opacity:0;visibility:hidden;translate:0 10px;pointer-events:none;transition:opacity .2s ease,translate .3s var(--ease),visibility 0s .2s}
.kbs.on{opacity:1;visibility:visible;translate:0 0;pointer-events:auto;transition:opacity .2s ease,translate .3s var(--ease),visibility 0s}
.kbs::-webkit-scrollbar{display:none}
.kc{flex:none;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;height:46px;max-width:78vw;padding:0 14px;border-radius:12px;border:1px solid var(--gbd);background:var(--gfield);color:var(--ink);font:600 .85rem Inter,Cairo,sans-serif;cursor:pointer;text-align:left;transition:scale .9s var(--ease)}
.kc:active{scale:.95;transition:scale .12s ease-out}
.kc .sn{max-width:100%}
.kc .sd{font-size:.62rem}

/* login card: lets the saved-passwords pop-up sit above the next card */
#c0{overflow:visible;z-index:3}
#flU{z-index:4}

/* saved passwords pop-up: same width as the username field, a small gap under it, height = its content */
.sug{position:absolute;left:0;right:0;top:66px;z-index:6;direction:ltr;padding:6px;border-radius:16px;border:1px solid var(--gbd);background:var(--sugbg);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 14px 36px rgba(0,0,0,.28);
  opacity:0;visibility:hidden;translate:0 -6px;pointer-events:none;transition:opacity .22s ease,translate .3s var(--ease),visibility 0s .22s}
.sug.on{opacity:1;visibility:visible;translate:0 0;pointer-events:auto;transition:opacity .22s ease,translate .3s var(--ease),visibility 0s}
.sugt{padding:4px 8px 6px;font:700 .66rem Inter,Cairo,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);text-align:left}
body.ar .sugt{direction:rtl;text-align:right;letter-spacing:0;text-transform:none;font-size:.74rem}
.si{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:38px;padding:0 10px;border:0;border-radius:11px;background:none;color:var(--ink);
  font:600 .86rem Inter,Cairo,sans-serif;cursor:pointer;text-align:left;transition:background .2s,scale .9s var(--ease)}
.sug.on .si{animation:fadeUp .3s ease backwards;animation-delay:calc(var(--n)*.05s + .04s)}
@media(hover:hover){.si:hover{background:var(--gfield)}}
.si:active{background:var(--gfield);scale:.97;transition:background .2s,scale .12s ease-out}
.sn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{flex:none;font-size:.7rem;letter-spacing:.12em;opacity:.45}

/* fields filled from a saved password: green, until the person edits them */
.fl.af:not(.bad) input{border-color:var(--ok);background:rgba(52,211,153,.16);box-shadow:0 0 0 3px rgba(52,211,153,.12)}
.fl.af:not(.bad) label{color:var(--ok);opacity:1}

/* =========================================================
   v5: real daytime for the light theme + twinkling stars at night
   ========================================================= */
body.light .vl{background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,rgba(255,255,255,0) 40%,rgba(255,255,255,.08) 100%)}
body.light .intro::before{background:radial-gradient(ellipse 62% 38% at 50% 50%,rgba(255,255,255,.42) 0%,rgba(255,255,255,.2) 45%,rgba(255,255,255,0) 100%)}
body.light .gl{background:rgba(220,238,252,.5)}
:root *{-webkit-tap-highlight-color:transparent}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.twk{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 5px 1px rgba(200,220,255,.8);opacity:0;pointer-events:none}

/* =========================================================
   v6: the two cards side by side (wide screens) + trainees' comments under them
   ========================================================= */
.stack{margin-block:auto 0}
@media(min-width:720px){
  .stack{flex-direction:row;align-items:stretch;max-width:860px}
  .stack .card{flex:1 1 0;width:auto;min-width:0}
}

/* =========================================================
   v7: bolder / whiter intro words with room between them, cards slide in left -> right,
   glass review cards with big green quote marks, carousel moving left -> right
   ========================================================= */
body .intro .hello,body .intro .tag{color:var(--ink);font-weight:700}
body.ar .intro .hello{font-weight:800}
body.ar .intro .tag{font-weight:800}
body .intro .hello{margin-bottom:clamp(16px,3.4vh,32px)}
body .intro .brand{margin:0 0 clamp(16px,3.4vh,32px)}
.intro .rbtn{margin-top:clamp(46px,9vh,84px)}

/* both login cards come in from the left, one after the other */
@keyframes slideR{from{opacity:0;translate:-110vw 0}to{opacity:1;translate:0 0}}
.stack .card.rise2{animation-name:slideR;animation-duration:.95s;animation-timing-function:cubic-bezier(.16,1,.3,1)}
.wrap{overflow-x:hidden}

/* ===== comments: a deck of playing cards (thrown, flipped, fanned, read one by one) ===== */
.rev{position:relative;width:100%;height:clamp(460px,74vh,640px);margin-block:12px auto;direction:ltr;touch-action:pan-y}
.dkp{position:absolute;left:0;top:0;visibility:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.dkc{position:relative;width:100%;height:100%;perspective:1100px;border-radius:var(--dkr,18px);box-shadow:0 0 0 1px rgba(0,0,0,.16),0 10px 26px rgba(0,0,0,.4);transition:box-shadow .6s ease}
.dkp.act .dkc{box-shadow:0 0 0 1px rgba(0,0,0,.16),0 22px 60px rgba(0,0,0,.5)}
.dki{position:absolute;inset:0;transform-style:preserve-3d}
.dkb,.dkf{position:absolute;inset:0;border-radius:var(--dkr,18px);-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}

  try { const tk = localStorage.getItem(TOKEN_KEY); if (tk && !deviceProfile()) rpc('guest_recall', { p_token: tk }).then(d => { if (d && d.firstName) { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(d)); } catch (e) { } } }); } catch (e) { }
  function askWho(d) {   /* never enters on its own: someone else may be using this computer */
    const t = T(); $('rT').textContent = t.rT; $('rP').textContent = t.rP.replace('{f}', d.firstName).replace('{l}', d.lastName);
    $('rov').classList.add('on');
    $('rYes').onclick = () => { try { sessionStorage.setItem(GUEST_KEY, JSON.stringify({ firstName: d.firstName, lastName: d.lastName, phone: d.phone, email: d.email, at: Date.now() })); } catch (e) { } go(ROUTES.guest, true); };
    $('rNo').onclick = () => { $('rov').classList.remove('on'); openGuest(); };   /* a new person: the form, and he is remembered instead */
  }

  /* ============ guest session key (the guest page reads it; leaving guest mode is handled there) ============ */
  const GUEST_KEY = 'thabitGuest', GUEST_HOME = 'index.html';
  window.addEventListener('pageshow', () => { document.body.getAnimations().forEach(a => a.cancel()); });

  /* ============ the buttons of card 2 ============ */
  const ov = $('ov');
  /* "Become one of us": a new layer; Back returns to the two cards where we stopped */
  const jl = $('jl'); let jlOpen = false;
  function openJoin() { if (jlOpen) return; jlOpen = true; pushLayer(closeJoin); jl.classList.add('on'); body.classList.add('lock'); }
  function closeJoin() { if (!jlOpen) return; jlOpen = false; jl.classList.remove('on'); body.classList.remove('lock'); }
  $('jBack').onclick = () => history.back();
  $('joinBtn').onclick = openJoin;
  $('soonBack').onclick = () => ov.classList.remove('on');
  ov.addEventListener('pointerdown', e => { if (e.target === ov) ov.classList.remove('on'); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { ov.classList.remove('on'); $('rov').classList.remove('on'); } });
  $('rov').addEventListener('pointerdown', e => { if (e.target === $('rov')) $('rov').classList.remove('on'); });   /* tap anywhere outside: it just closes */
  $('guestBtn').onclick = () => { const d = deviceProfile(); d ? askWho(d) : openGuest(); };

  /* ============ LOGIN (same behaviour as the portal card) ============ */
  const uIn = $('lgU'), pIn = $('lgP'), btn = $('lgGo'), eye = $('lgEye'), uFl = $('flU'), pFl = $('flP'), box = $('lgAlert');
  const S = { failU: 0, failP: 0, busy: false, hinted: false, hintT: 0, hintX: 0, uShown: '', uc: null, noRpc: false };
  const HINT = 'yourname@thabit.com';
  const anim = (el, kf, d) => { try { el.animate(kf, { duration: d, easing: 'cubic-bezier(.4,0,.2,1)' }); } catch (e) { } };
  const bob = el => anim(el, [{ translate: '0 0' }, { translate: '0 -9px', offset: .45 }, { translate: '0 0' }], 850);
  const shake = el => anim(el, [{ translate: '0 0' }, { translate: '-9px 0', offset: .15 }, { translate: '9px 0', offset: .32 }, { translate: '-7px 0', offset: .5 }, { translate: '6px 0', offset: .68 }, { translate: '-3px 0', offset: .84 }, { translate: '0 0' }], 1000);

  /* hint that types itself once */
  function cancelHint() { clearInterval(S.hintT); clearTimeout(S.hintX); const s = uFl.querySelector('.fhint'); if (s) s.remove(); }
  function hint() {
    if (uIn.value || document.activeElement !== uIn) return; cancelHint();   /* types itself once every time the field is opened empty */
    const s = document.createElement('span'); s.className = 'fhint'; s.setAttribute('aria-hidden', 'true'); uFl.appendChild(s);
    let i = 0;
    S.hintT = setInterval(() => { i++; s.textContent = HINT.slice(0, i); if (i >= HINT.length) { clearInterval(S.hintT); S.hintX = setTimeout(() => { s.style.opacity = 0; setTimeout(() => s.remove(), 350); }, 800); } }, 38);
  }
  $('c0').addEventListener('focusin', e => { const t = e.target; if (t !== uIn && t !== pIn) return; t.parentNode.classList.add('act'); if (t === uIn) { showSug(); setTimeout(hint, 250); } });
  $('c0').addEventListener('focusout', e => { const t = e.target; if (t !== uIn && t !== pIn) return; t.parentNode.classList.remove('act'); cancelHint(); if (t === uIn) { hideSug(); onUserBlur(); } });

  /* shown password: blurred letters that clear one by one, no copy */
  const pwv = document.createElement('div'); pwv.className = 'pwv'; pwv.setAttribute('aria-hidden', 'true'); pwv.innerHTML = '<div class="pwi"></div>';
  pFl.appendChild(pwv); const pwi = pwv.firstChild; let shown = false;
  const syncPw = () => { pwi.style.transform = 'translateX(' + (-pIn.scrollLeft) + 'px)'; };
  function buildPw(fade) {
    pwi.textContent = '';
    [...pIn.value].forEach((ch, i) => {
      const s = document.createElement('span'); s.textContent = ch === ' ' ? '\u00a0' : ch;
      if (fade) { s.className = 'bl'; s.style.transitionDelay = (i * 55) + 'ms'; }
      pwi.appendChild(s);
    });
    if (fade) requestAnimationFrame(() => requestAnimationFrame(() => pwi.querySelectorAll('.bl').forEach(s => s.classList.remove('bl'))));
    syncPw();
  }
  ['copy', 'cut', 'dragstart', 'contextmenu'].forEach(ev => pIn.addEventListener(ev, e => e.preventDefault()));
  pIn.addEventListener('input', () => { if (shown) buildPw(false); });
  ['scroll', 'keyup', 'click'].forEach(ev => pIn.addEventListener(ev, () => { if (shown) syncPw(); }));
  eye.addEventListener('mousedown', e => e.preventDefault());
  eye.addEventListener('click', () => {
    shown = !shown; eye.classList.remove('glow'); void eye.offsetWidth; eye.classList.add('glow'); eye.setAttribute('aria-pressed', shown ? 'true' : 'false');
    if (shown) { pFl.classList.add('show'); pIn.type = 'text'; buildPw(true); } else { pFl.classList.remove('show'); pIn.type = 'password'; pwi.textContent = ''; }
  });

  /* right / wrong marks */
  const hideMsg = fl => fl.querySelector('.fmsg').classList.remove('show');
  function markOk(fl) { fl.classList.remove('bad'); fl.classList.add('ok'); hideMsg(fl); bob(fl); }
  function markBad(fl, key, txt) {
    fl.classList.remove('ok', 'af'); fl.classList.add('bad'); shake(fl);
    const n = key === 'U' ? ++S.failU : ++S.failP, m = fl.querySelector('.fmsg');
    if (n >= 2) { m.textContent = txt; m.classList.add('show'); }   /* first time: only the red shake, no words */
  }
  uIn.addEventListener('input', e => {
    cancelHint(); hideSug(); uFl.classList.remove('ok', 'bad', 'af'); hideMsg(uFl); S.uShown = '';
    /* typing "@" completes the domain at once (selected, so typing another domain simply replaces it) */
    const v = uIn.value;
    if (!/^delete/.test(e.inputType || '') && v.length > 1 && v.indexOf('@') === v.length - 1) {
      const DOM = 'thabit.com'; uIn.value = v + DOM;
      const sel = () => { try { uIn.setSelectionRange(v.length, v.length + DOM.length); } catch (x) { } };
      sel(); requestAnimationFrame(sel);
    }
  });
  uIn.addEventListener('keydown', e => { cancelHint(); hideSug(); if (e.key === 'Enter') { e.preventDefault(); pIn.focus(); } });
  uIn.addEventListener('pointerdown', () => { if (document.activeElement === uIn) hideSug(); });   /* tapping the field again = "I will type myself" */
  pIn.addEventListener('input', () => { pFl.classList.remove('ok', 'bad', 'af'); hideMsg(pFl); });

  /* a tap anywhere outside the two fields (and the pop-up) closes the keyboard and puts everything back */
  let pdn = null;
  document.addEventListener('pointerdown', e => { const t = e.target; pdn = { x: e.clientX, y: e.clientY, inside: !!(t.closest && t.closest('#flU,#flP,#sug,#kbs')) }; }, true);
  document.addEventListener('pointerup', e => {
    const a = document.activeElement; if (!pdn || (a !== uIn && a !== pIn)) return;
    if (!pdn.inside && Math.hypot(e.clientX - pdn.x, e.clientY - pdn.y) < 10) a.blur();
  }, true);

  /* ============ saved passwords: our own small pop-up under the username field ============ */
  const SAVED_KEY = 'thSavedLogins', sug = $('sug'), sugL = $('sugL'), kbs = $('kbs'), coarse = matchMedia('(pointer:coarse)').matches; S.sugTok = 0;
  function placeKbs() { const vv = window.visualViewport; kbs.style.bottom = vv ? Math.max(0, Math.round(innerHeight - vv.offsetTop - vv.height)) + 'px' : '0px'; }   /* sits exactly on top of the keyboard */
  if (window.visualViewport) ['resize', 'scroll'].forEach(ev => visualViewport.addEventListener(ev, () => { if (kbs.classList.contains('on')) placeKbs(); }));
  const getSaved = () => { try { const a = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); return Array.isArray(a) ? a.filter(x => x && x.u && x.p) : []; } catch (e) { return []; } };
  function saveLogin(u, p) { try { const a = getSaved().filter(x => x.u.toLowerCase() !== u.toLowerCase()); a.unshift({ u, p }); localStorage.setItem(SAVED_KEY, JSON.stringify(a.slice(0, 4))); } catch (e) { } }
  function hideSug() { S.sugTok++; sug.classList.remove('on'); kbs.classList.remove('on'); }
  function showSug() {
    const all = getSaved(), q = uIn.value.trim().toLowerCase();
    const list = (!q || all.some(x => x.u.toLowerCase() === q)) ? all : all.filter(x => x.u.toLowerCase().startsWith(q));
    if (!list.length) { hideSug(); return; }
    const tok = ++S.sugTok, host = coarse ? kbs : sugL; host.textContent = '';
    list.forEach((x, n) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = coarse ? 'kc' : 'si'; b.setAttribute('role', 'option'); b.style.setProperty('--n', n);
      const a = document.createElement('span'); a.className = 'sn'; a.textContent = x.u;
      const d = document.createElement('span'); d.className = 'sd'; d.setAttribute('aria-hidden', 'true'); d.textContent = '••••••••';
      b.append(a, d);
      b.addEventListener('mousedown', e => e.preventDefault());   /* the field keeps focus until the choice is made */
      b.addEventListener('click', () => pickSaved(x));
      host.appendChild(b);
    });
    if (!coarse) { sug.classList.add('on'); return; }
    kbs.scrollLeft = 0; placeKbs();   /* touch: the cells appear when the keyboard has come up */
    setTimeout(() => { if (tok === S.sugTok && document.activeElement === uIn) { placeKbs(); kbs.classList.add('on'); } }, 260);
  }
  function pickSaved(x) {   /* fills both fields in green; it never logs in by itself */
    cancelHint(); uIn.value = x.u; pIn.value = x.p; S.uShown = '';
    [uFl, pFl].forEach(f => { f.classList.remove('bad'); f.classList.add('af'); }); hideMsg(uFl); hideMsg(pFl);
    if (shown) buildPw(false);
    hideSug(); uIn.blur();
  }
  pIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); login(); } });

  /* username check (server function portal_username_exists; without it everything else still works) */
  async function checkUser(v) {
    if (!v || S.noRpc || typeof REPORT_SUPABASE_URL === 'undefined' || typeof sbHeaders === 'undefined') return null;
    try {
      const r = await fetch(REPORT_SUPABASE_URL + '/rest/v1/rpc/portal_username_exists', { method: 'POST', headers: sbHeaders(), body: JSON.stringify({ p_username: v.includes('@') ? v : v + '@thabit.com' }) });
      if (r.status === 404 || r.status === 400) { S.noRpc = true; return null; }
      if (!r.ok) return null;
      const j = await r.json(); return j === true ? true : j === false ? false : null;
    } catch (e) { return null; }
  }
  function ensureUser(v) { if (S.uc && S.uc.v === v) return S.uc.p; const p = checkUser(v); S.uc = { v, p }; return p; }
  function onUserBlur() {
    const v = uIn.value.trim(); if (!v) return;
    ensureUser(v).then(r => {
      if (uIn.value.trim() !== v || S.uShown === v) return;
      if (r === true) { S.uShown = v; markOk(uFl); } else if (r === false) { S.uShown = v; markBad(uFl, 'U', T().userBad); }
    });
  }

  function say(m) { if (!m) { box.classList.remove('show'); return; } box.textContent = m; box.classList.add('show'); setTimeout(() => box.classList.remove('show'), 4500); }
  const btnState = s => { btn.dataset.state = s; btn.disabled = s !== 'idle'; };
  async function attempt(u, p) {
    try {
      if (typeof REPORT_SUPABASE_URL === 'undefined' || typeof sbHeaders === 'undefined') return { ok: false, kind: 'net', msg: T().na };
      if (u.includes('@')) {
        const res = await staffSignIn(u, p);
        if (res.ok) {
          const role = await fetchMyRole(res.session.access_token);
          if (role) { saveStaffSession(res.session, role); return { ok: true, staff: true, route: ROLE_ROUTES[role] }; }
          return { ok: false, kind: 'wrong' };
        }
        if (res.status === 429) return { ok: false, kind: 'rate' };
      }
      const uname = u.includes('@') ? u : u + '@thabit.com';
      const r = await fetch(REPORT_SUPABASE_URL + '/rest/v1/rpc/trainee_login', { method: 'POST', headers: sbHeaders(), body: JSON.stringify({ p_username: uname, p_password: p }) });
      const d = await r.json().catch(() => null);
      if (r.ok && d && d.token) {
        localStorage.setItem('thabit_trainee_token', d.token);
        localStorage.setItem('currentTrainee', JSON.stringify(d.profile));
        return { ok: true, route: ROLE_ROUTES.trainee };
      }
      if (d && d.message === 'too_many_attempts') return { ok: false, kind: 'rate' };
      if (!r.ok) return { ok: false, kind: 'server', msg: T().srv + ' ' + r.status + ': ' + ((d && (d.message || d.hint || d.error)) || '') };
      return { ok: false, kind: 'wrong' };
    } catch (err) { return { ok: false, kind: 'net', msg: T().conn }; }
  }
  async function win(route, u, p, staff) {
    saveLogin(u, p);
    uFl.classList.remove('bad'); hideMsg(uFl); hideMsg(pFl); uFl.classList.add('ok'); markOk(pFl);
    await sleep(800); btnState('done'); await sleep(650);
    anim(btn, [{ translate: '0 0' }, { translate: '0 -8px', offset: .45 }, { translate: '0 0' }], 750);
    await sleep(800);
    $('c0').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' }); await sleep(450);
    let last = ''; try { last = localStorage.getItem('thLastPage') || ''; } catch (e) { }   /* the last page they had open, if a page saved it */
    if (staff) { go(route, true); return; }   /* admin / trainer: straight to their own page, same as index.html does */
    /* trainee: index.html opens the member app by itself when it finds the token + 'thMember', so it never asks for the login again */
    try { localStorage.setItem('thMember', JSON.stringify({ route: route, username: u })); } catch (e) { }
    go(GUEST_HOME, true);   /* replace: the landing is not in history, so Back leaves the app */
  }
  async function login() {
    if (S.busy) return;
    const u = uIn.value.trim(), p = pIn.value.trim(); let empty = false;
    if (!u) { markBad(uFl, 'U', T().req); empty = true; }
    if (!p) { markBad(pFl, 'P', T().req); empty = true; }
    if (empty) return;
    S.busy = true; btnState('busy'); say('');
    const [res, known] = await Promise.all([attempt(u, p), ensureUser(u)]);
    if (res.ok) { await win(res.route, u, p, res.staff); return; }
    btnState('idle'); S.busy = false;
    if (res.kind === 'rate') { say(T().rate); return; }
    if (res.kind === 'server' || res.kind === 'net') { say(res.msg); return; }
    if (known === false) markBad(uFl, 'U', T().userBad);
    else { if (known === true) { uFl.classList.remove('bad'); uFl.classList.add('ok'); } markBad(pFl, 'P', known === true ? T().pwBad : T().both); }
  }
  btn.addEventListener('click', login);
})();
</script>
</body>
