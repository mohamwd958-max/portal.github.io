<script>
/* ROUTER: index.html is the entry/routing page.
   member session (token + thMember) -> home.html | nothing -> landing.html (the front door). Add ?login to see the login card here. */
(function () {
  try {
    if (window.top !== window.self) return;
    if (/[?&]login\b/.test(location.search)) return;
    var m = null; if (localStorage.getItem('thabit_trainee_token')) m = JSON.parse(localStorage.getItem('thMember') || 'null');
    location.replace(m ? 'home.html' : 'landing.html');
  } catch (e) { }
})();
</script>

    <script>

      const shake = el => anim(el, [{ translate: '0 0' }, { translate: '-9px 0', offset: .15 }, { translate: '9px 0', offset: .32 }, { translate: '-7px 0', offset: .5 }, { translate: '6px 0', offset: .68 }, { translate: '-3px 0', offset: .84 }, { translate: '0 0' }], 1000);

      orb.innerHTML = '<b class="le l"></b><b class="le b"></b><b class="le r"></b><b class="le t"></b>';

      function place() { orb.style.left = card.offsetLeft + 'px'; orb.style.top = card.offsetTop + 'px'; orb.style.width = card.offsetWidth + 'px'; orb.style.height = card.offsetHeight + 'px'; }

      [0, 300, 900, 1800, 3000].forEach(t => setTimeout(dropAuto, t)); window.addEventListener('load', dropAuto);

      /* ---------- hint that types itself once ---------- */

           - dragged, or pointer left its border = not a click: it comes back slowly, nothing runs.

        pwi.textContent = '';
        [...pIn.value].forEach((ch, i) => {
          const s = document.createElement('span'); s.textContent = ch === ' ' ? '\u00a0' : ch;

      };

      /* ---------- right / wrong marks ---------- */
      function hideMsg(fl) { fl.querySelector('.fmsg').classList.remove('show'); }
      function markOk(fl) { fl.classList.remove('bad'); fl.classList.add('ok'); hideMsg(fl); bob(fl); }
      function markBad(fl, key, txt) {
        fl.classList.remove('ok'); fl.classList.add('bad'); shake(fl);
        const n = key === 'U' ? ++LG.failU : ++LG.failP;
        const m = fl.querySelector('.fmsg');
        if (n >= 2) { m.textContent = txt; m.classList.add('show'); }   /* first time: only the red shake, no words */
      }
      uIn.addEventListener('input', () => { cancelHint(); uFl.classList.remove('ok', 'bad'); hideMsg(uFl); LG.uShown = ''; });
      uIn.addEventListener('keydown', e => { cancelHint(); if (e.key === 'Enter') { e.preventDefault(); pIn.focus(); } });
      pIn.addEventListener('input', () => { pFl.classList.remove('ok', 'bad'); hideMsg(pFl); });
      pIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); window.handleLogin(); } });

      /* ---------- username check (needs the server function portal_username_exists; without it everything else still works) ---------- */
      async function checkUser(v) {
        if (!v || LG.noRpc) return null;
        try {
          const r = await fetch(REPORT_SUPABASE_URL + '/rest/v1/rpc/portal_username_exists', { method: 'POST', headers: sbHeaders(), body: JSON.stringify({ p_username: v.includes('@') ? v : v + '@thabit.com' }) });
          if (r.status === 404 || r.status === 400) { LG.noRpc = true; return null; }
          if (!r.ok) return null;
          const j = await r.json(); return j === true ? true : j === false ? false : null;
        } catch (e) { return null; }
      }
      function ensureUser(v) { if (LG.uc && LG.uc.v === v) return LG.uc.p; const p = checkUser(v); LG.uc = { v, p }; return p; }
      function onUserBlur() {
        const v = uIn.value.trim(); if (!v) return;
        ensureUser(v).then(r => {
          if (uIn.value.trim() !== v || LG.uShown === v) return;
          if (r === true) { LG.uShown = v; markOk(uFl); }
          else if (r === false) { LG.uShown = v; markBad(uFl, 'U', L().userBad); }
        });
      }

      /* ---------- the login itself (same logic as before) ---------- */
      const box = $('webAlertBox');
      function say(m) { if (!m) { box.classList.remove('show'); return; } box.innerText = m; box.className = 'show alert-error'; setTimeout(() => box.classList.remove('show'), 4500); }
      function btnState(s) { btn.dataset.state = s; btn.disabled = s !== 'idle'; }

      async function attempt(u, p) {
        try {
          if (u.includes('@')) {
            const res = await staffSignIn(u, p);
            if (res.ok) {
              const role = await fetchMyRole(res.session.access_token);
              if (role) { saveStaffSession(res.session, role); return { ok: true, staff: true, route: ROLE_ROUTES[role] }; }
              return { ok: false, kind: 'wrong' };
            }
            if (res.status === 429) return { ok: false, kind: 'rate' };
          }
          const uname = u.includes('@') ? u : u + '@thabit.com';
          const r = await fetch(REPORT_SUPABASE_URL + '/rest/v1/rpc/trainee_login', { method: 'POST', headers: sbHeaders(), body: JSON.stringify({ p_username: uname, p_password: p }) });
          const d = await r.json().catch(() => null);
          if (r.ok && d && d.token) {
            localStorage.setItem('thabit_trainee_token', d.token);
            localStorage.setItem('currentTrainee', JSON.stringify(d.profile));
            return { ok: true, route: ROLE_ROUTES.trainee };
          }
          if (d && d.message === 'too_many_attempts') return { ok: false, kind: 'rate' };
          if (!r.ok) return { ok: false, kind: 'server', msg: 'Server error ' + r.status + ': ' + ((d && (d.message || d.hint || d.error)) || 'unknown') };
          return { ok: false, kind: 'wrong' };
        } catch (err) {
          return { ok: false, kind: 'net', msg: PAGE_I18N[currentLang].errConn + ' (' + (err && err.message) + ')' };
        }
      }

      async function win(route, staff) {
        uFl.classList.remove('bad'); hideMsg(uFl); hideMsg(pFl);
        uFl.classList.add('ok'); markOk(pFl);
        await sleep(800);
        btnState('done');
        await sleep(650);
        anim(btn, [{ translate: '0 0' }, { translate: '0 -8px', offset: .45 }, { translate: '0 0' }], 750);
        await sleep(800);
        RC.held = false; card.style.setProperty('transition', 'opacity .5s', 'important'); orb.style.transition = 'opacity .5s';
        card.style.opacity = 0; orb.style.opacity = 0;
        await sleep(450);
        if (staff || !window.thEnterMember) window.location.replace(route); else window.thEnterMember(route, uIn.value.trim());   /* admin / trainer: straight to their page. trainee: the member page opens first, not the dashboard */
      }

      window.handleLogin = async function () {
        if (LG.busy) return;
        const u = uIn.value.trim(), p = pIn.value.trim();
        let empty = false;
        if (!u) { markBad(uFl, 'U', L().req); empty = true; }
        if (!p) { markBad(pFl, 'P', L().req); empty = true; }
        if (empty) return;
        LG.busy = true; btnState('busy'); say('');
        const [res, known] = await Promise.all([attempt(u, p), ensureUser(u)]);
        if (res.ok) { await win(res.route, res.staff); return; }
        btnState('idle'); LG.busy = false;
        if (res.kind === 'rate') { say(L().rate); return; }
        if (res.kind === 'server' || res.kind === 'net') { say(res.msg); return; }
        if (known === false) markBad(uFl, 'U', L().userBad);
        else { if (known === true) { uFl.classList.remove('bad'); uFl.classList.add('ok'); } markBad(pFl, 'P', known === true ? L().pwBad : L().both); }
      };
    })();
    </script>

<script>
/* index.html no longer contains the member app (that is home.html). It only routes. */
(function () {
  'use strict';
  var framed = window.top !== window.self;
  function M() { try { if (!localStorage.getItem('thabit_trainee_token')) return null; return JSON.parse(localStorage.getItem('thMember') || 'null'); } catch (e) { return null; } }
  /* called by the login card after a successful trainee sign-in: the member page opens (home.html) */
  window.thEnterMember = function (route, uname) {
    try { localStorage.setItem('thMember', JSON.stringify({ route: route, username: uname })); } catch (e) { }
    if (framed) { try { window.top.location.replace(location.href); } catch (e) { } return; }
    var nav = function () { location.replace('home.html'); };
    if (window.thLoader && thLoader.show) { try { thLoader.show().then(nav, nav); } catch (e) { nav(); } } else nav();
  };
  function showLogin() { document.body.classList.add('th-ready'); var ls = document.getElementById('login-screen'); if (ls) ls.classList.remove('page-content-hidden'); }
  if (framed && M()) {   /* inside the member page: never show a login card here */
    document.documentElement.style.visibility = 'hidden';
    try { if (!sessionStorage.getItem('thFrameTry')) { sessionStorage.setItem('thFrameTry', '1'); location.replace((M().route) || 'dashboard.html'); } } catch (e) { }
  } else if (!framed && M()) location.replace('home.html');
  else if (!framed && !/[?&]login\b/.test(location.search)) location.replace('landing.html');
  else (window.thLoader ? thLoader.ready : Promise.resolve()).then(showLogin);
})();
</script>
