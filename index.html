<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="js/thabit-loader.js"></script>
<title>Thabit</title>
<link rel="icon" href="assets/thabit-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#ece8df;--ink2:rgba(236,232,223,.72);--gbd:rgba(255,255,255,.18);--gbg:rgba(255,255,255,.12);--sel:rgba(255,255,255,.16);--shade:rgba(10,12,18,.38);--layer:rgba(14,16,22,.74);--ease:cubic-bezier(.22,1,.36,1)}
body.light{--ink:#1c1a16;--ink2:rgba(28,26,22,.7);--gbd:rgba(255,255,255,.75);--gbg:rgba(255,255,255,.5);--sel:rgba(255,255,255,.8);--shade:rgba(236,232,222,.45);--layer:rgba(236,232,222,.8)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:90%}
html,body{min-height:100%;background:#121419}
body{font-family:Inter,Cairo,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.ar{font-family:Cairo,Inter,system-ui,sans-serif}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bg{position:fixed;inset:0;z-index:0;background:#121419 url(assets/welcome-bg.jpg) 50% 22%/cover no-repeat}
.vd,.vl{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity 1.4s ease}
.vd{background:linear-gradient(180deg,rgba(18,20,26,.55),rgba(18,20,26,.15) 38%,rgba(18,20,26,.6));opacity:1}
.vl{background:linear-gradient(180deg,rgba(236,232,222,.92),rgba(236,232,222,.62) 38%,rgba(236,232,222,.86));opacity:0}
body.light .vd{opacity:0}body.light .vl{opacity:1}
body.th-fade,body.th-fade *{transition:background-color 1s ease,color 1s ease,border-color 1s ease,opacity 1s ease!important}
.glass{background:var(--gbg);border:1px solid var(--gbd);-webkit-backdrop-filter:blur(60px) saturate(1.5);backdrop-filter:blur(60px) saturate(1.5);box-shadow:0 10px 40px rgba(0,0,0,.16)}

/* top bar: logo left, profile circle right */
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;direction:ltr;padding:max(12px,env(safe-area-inset-top,0px)) 16px 10px}
.logo{display:block;width:30px;height:30px;background:var(--ink);-webkit-mask:url(assets/thabit-logo.png) center/contain no-repeat;mask:url(assets/thabit-logo.png) center/contain no-repeat}
.prof{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}

/* pages */
main{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:78px 16px calc(112px + env(safe-area-inset-bottom,0px));touch-action:pan-y}
#pages{display:grid;min-height:60vh}
.pg{grid-area:1/1;display:none}.pg.on{display:block}
.ph{font:700 1.3rem Inter,Cairo,sans-serif;text-align:center;margin:6px 0 18px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:18px 20px;border-radius:22px;font-weight:700;font-size:1rem;text-align:start;transition:transform .5s var(--ease),background .4s}
@media(hover:hover){.opt:hover{transform:translateY(-2px)}}
.opt:active{transform:scale(.985)}
.pg.on .opt{animation:drop .5s var(--ease) backwards;animation-delay:calc(var(--i)*.07s)}
@keyframes drop{from{opacity:0;translate:0 -40px}to{opacity:1;translate:0 0}}
.soon{padding:34px 20px;border-radius:22px;text-align:center;color:var(--ink2);font-weight:600}
[dir=rtl] .chev{transform:scaleX(-1)}
.chev{display:inline-grid;color:var(--ink2)}

/* bottom bar */
.bar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;max-width:560px;margin:0 auto;padding:6px;border-radius:28px}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border-radius:22px;color:var(--ink2);font:600 .62rem/1.15 Inter,Cairo,sans-serif;text-align:center;transition:background .4s,color .4s}
body.ar .tb{font-family:Cairo,Inter,sans-serif}
.tb svg{width:19px;height:19px}
.tb.on{background:var(--sel);color:var(--ink)}

/* popups (centre of the screen, blurred page behind) */
.shade{position:fixed;inset:0;z-index:15;background:var(--shade);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .3s}
.shade.on{opacity:1;pointer-events:auto}
.pop{position:fixed;left:50%;top:50%;z-index:16;width:min(360px,calc(100vw - 32px));padding:18px;border-radius:24px;opacity:0;pointer-events:none;transform:translate(-50%,-47%) scale(.97);transition:opacity .3s,transform .4s var(--ease)}
.pop.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.pt{font:700 1.05rem Inter,Cairo,sans-serif;text-align:center;margin-bottom:12px}
.pi{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 12px;border-radius:14px;font-weight:600;text-align:start;transition:background .3s}
.pi:hover{background:var(--sel)}
.pn{text-align:center;color:var(--ink2);font-weight:600;margin-bottom:10px}
.pr{display:flex;justify-content:space-between;gap:14px;padding:9px 4px;border-top:1px solid var(--gbd);font-weight:600}
.pr span:first-child{color:var(--ink2)}

/* full page layer */
.layer{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:var(--layer);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.layer.on{display:flex;animation:lin .35s var(--ease)}
@keyframes lin{from{opacity:0;translate:0 16px;filter:blur(8px)}to{opacity:1;translate:0 0;filter:blur(0)}}
.lh{display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top,0px)) 16px 10px}
.lb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
[dir=rtl] .lb svg{transform:scaleX(-1)}
.lh h2{font:700 1.15rem Inter,Cairo,sans-serif}
.lc{flex:1;display:grid;place-items:center;padding:24px;text-align:center;font-weight:600;color:var(--ink2);overflow:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script>try{if(localStorage.getItem('thThemeChoice')==='light')document.body.classList.add('light')}catch(e){}</script>
<div class="bg"></div><div class="vd"></div><div class="vl"></div>

<header class="top">
  <i class="logo" role="img" aria-label="Thabit"></i>
  <button class="prof glass" id="prof" type="button" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
</header>

<main id="main"><div id="pages">
  <section class="pg on" id="p0"><h1 class="ph" data-t="tLang"></h1>
    <div class="opts">
      <button class="opt glass" style="--i:0" data-open="train" type="button"><span data-t="train"></span><i class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></i></button>
      <button class="opt glass" style="--i:1" data-open="dict" type="button"><span data-t="dict"></span><i class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></i></button>
      <button class="opt glass" style="--i:2" data-open="mirror" type="button"><span data-t="mirror"></span><i class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></i></button>
      <button class="opt glass" style="--i:3" data-open="trans" type="button"><span data-t="trans"></span><i class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></i></button>
    </div></section>
  <section class="pg" id="p1"><h1 class="ph" data-t="tVo"></h1><div class="soon glass" data-t="soon"></div></section>
  <section class="pg" id="p2"><h1 class="ph" data-t="tDig"></h1><div class="soon glass" data-t="soon"></div></section>
  <section class="pg" id="p3"><h1 class="ph" data-t="tCons"></h1><div class="soon glass" data-t="soon"></div></section>
</div></main>

<nav class="bar glass" id="bar">
  <button class="tb on" data-tab="0" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span data-t="tLang"></span></button>
  <button class="tb" data-tab="1" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-t="tVo"></span></button>
  <button class="tb" data-tab="2" type="button"><svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13 6l-2 12"/></svg><span data-t="tDig"></span></button>
  <button class="tb" data-tab="3" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-t="tCons"></span></button>
  <button class="tb" id="more" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="more"></span></button>
</nav>

<div class="shade" id="shade"></div>
<div class="pop glass" id="pop" role="dialog"></div>
<div class="layer" id="layer" role="dialog">
  <div class="lh"><button class="lb glass" id="lback" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h2 id="lt"></h2></div>
  <div class="lc"><p id="lp"></p></div>
</div>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id), body = document.body, root = document.documentElement, AR_TZ = /^(Africa\/(Cairo|Tripoli|Tunis|Algiers|Casablanca|El_Aaiun|Khartoum|Djibouti|Nouakchott|Mogadishu)|Asia\/(Riyadh|Dubai|Baghdad|Amman|Beirut|Damascus|Kuwait|Qatar|Bahrain|Muscat|Aden|Gaza|Hebron)|Indian\/Comoro)$/;
  const D = {
    en: { tLang: 'Language', tVo: 'Voice Over', tDig: 'Digital Solutions', tCons: 'Personal Consultation', more: 'More', train: 'Language Training', dict: 'Dictation Pal', mirror: 'Mirroring Room', trans: 'Translation',
      store: 'Our Store', about: 'About', theme: 'Theme', dark: 'Dark', light: 'Light', guest: 'Guest', gnote: 'You are exploring as a guest', fn: 'First name', ln: 'Last name', ph: 'Phone', em: 'Email',
      soon: 'Services will appear here', soon2: 'The content will be here.', aboutTxt: 'Information about the Thabit program will be here.' },
    ar: { tLang: 'اللغة', tVo: 'التعليق الصوتي', tDig: 'الحلول الرقمية', tCons: 'الاستشارات الشخصية', more: 'المزيد', train: 'التدريب اللغوي', dict: 'رفيق الإملاء', mirror: 'غرفة المرآة', trans: 'الترجمة',
      store: 'متجرنا', about: 'عن ثابت', theme: 'المظهر', dark: 'داكن', light: 'فاتح', guest: 'ضيف', gnote: 'أنت تستكشف كضيف', fn: 'الاسم الأول', ln: 'الاسم الأخير', ph: 'الهاتف', em: 'البريد الإلكتروني',
      soon: 'ستظهر الخدمات هنا', soon2: 'سيكون المحتوى هنا.', aboutTxt: 'هنا ستكون المعلومات عن برنامج ثابت.' }
  };
  let L = 'en'; try { const v = localStorage.getItem('thLandLang'); if (v === 'ar' || v === 'en') L = v; else { let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { } L = (AR_TZ.test(tz) || (navigator.language || '').toLowerCase().indexOf('ar') === 0) ? 'ar' : 'en'; } } catch (e) { }
  const t = k => D[L][k];
  let G = null; try { G = JSON.parse(sessionStorage.getItem('thabitGuest') || 'null'); } catch (e) { }
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const chev = () => { const i = el('i', 'chev'); i.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'; return i; };

  /* ---------- layers: popups and pages, closed one by one with Back ---------- */
  const stack = []; let pending = null;
  const last = type => [...stack].reverse().find(l => l.type === type);
  function renderPop(k) {
    const p = $('pop'); p.textContent = '';
    if (k === 'more') {
      p.append(el('h3', 'pt', t('more')));
      [['store', t('store')], ['about', t('about')], ['theme', t('theme') + ' · ' + (body.classList.contains('light') ? t('light') : t('dark'))], ['lang', L === 'ar' ? 'English' : 'العربية']].forEach(([a, x]) => { const b = el('button', 'pi', x); b.type = 'button'; b.dataset.act = a; b.append(chev()); p.append(b); });
    } else {
      p.append(el('h3', 'pt', t('guest'))); p.append(el('p', 'pn', t('gnote')));
      [['fn', G && G.firstName], ['ln', G && G.lastName], ['ph', G && G.phone], ['em', G && G.email]].forEach(([k2, v]) => { const r = el('div', 'pr'), s = el('span', null, v || '—'); s.dir = 'ltr'; r.append(el('span', null, t(k2)), s); p.append(r); });
    }
  }
  function ui() {
    const pop = last('pop'), pg = last('page');
    $('shade').classList.toggle('on', !!pop); $('pop').classList.toggle('on', !!pop); if (pop) renderPop(pop.key);
    const ly = $('layer');
    if (pg) { $('lt').textContent = t(pg.key); $('lp').textContent = pg.key === 'about' ? t('aboutTxt') : t('soon2'); ly.classList.add('on'); } else ly.classList.remove('on');
    body.classList.toggle('lock', stack.length > 0);
  }
  function push(l) { stack.push(l); history.pushState({ d: stack.length }, ''); ui(); }
  function openPop(k) { const top = stack[stack.length - 1]; if (top && top.type === 'pop') { if (top.key === k) return closeAll(); top.key = k; ui(); } else push({ type: 'pop', key: k }); }
  function closeAll(fn) { if (!stack.length) { if (fn) fn(); return; } pending = fn || null; history.go(-stack.length); }
  window.addEventListener('popstate', e => {
    const d = (e.state && e.state.d) || 0; while (stack.length > d) stack.pop(); ui();
    if (pending) { const f = pending; pending = null; f(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) history.back(); });
  $('shade').onclick = () => closeAll();
  $('lback').onclick = () => history.back();
  $('prof').onclick = () => openPop('prof');
  $('more').onclick = () => openPop('more');
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => push({ type: 'page', key: b.dataset.open }));
  $('pop').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === 'store' || a === 'about') push({ type: 'page', key: a });                     /* opens a full page on top; Back returns to this menu */
    else if (a === 'theme') { body.classList.add('th-fade'); setTimeout(() => body.classList.remove('th-fade'), 1100); body.classList.toggle('light'); try { localStorage.setItem('thThemeChoice', body.classList.contains('light') ? 'light' : 'dark'); } catch (e2) { } ui(); }   /* applied at once */
    else if (a === 'lang') { L = L === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('thLandLang', L); } catch (e2) { } apply(); }   /* applied at once */
  };

  /* ---------- the four sections, swipe or tap, with a soft blur between them ---------- */
  let cur = 0; const tabs = document.querySelectorAll('.tb[data-tab]');
  function show(i) {
    if (i === cur || i < 0 || i > 3) return;
    const a = $('p' + cur), b = $('p' + i), s = (i > cur ? 1 : -1) * (root.dir === 'rtl' ? -1 : 1) * 34;
    document.querySelectorAll('.pg').forEach(p => { p.getAnimations().forEach(x => x.cancel()); if (p !== a) p.classList.remove('on'); });
    cur = i; tabs.forEach(x => x.classList.toggle('on', +x.dataset.tab === i));
    a.animate([{ opacity: 1, filter: 'blur(0)', transform: 'none' }, { opacity: 0, filter: 'blur(12px)', transform: 'translateX(' + (-s) + 'px)' }], { duration: 220, easing: 'ease-in', fill: 'forwards' }).finished.then(() => { a.classList.remove('on'); a.getAnimations().forEach(x => x.cancel()); }, () => { });
    b.classList.add('on');
    b.animate([{ opacity: 0, filter: 'blur(12px)', transform: 'translateX(' + s + 'px)' }, { opacity: 1, filter: 'blur(0)', transform: 'none' }], { duration: 340, delay: 120, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' });
    window.scrollTo(0, 0);
  }
  tabs.forEach(b => b.onclick = () => closeAll(() => show(+b.dataset.tab)));
  let sx = 0, sy = 0, st = 0; const pages = $('main');
  pages.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = Date.now(); });
  pages.addEventListener('pointerup', e => {
    if (stack.length) return; const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy) && Date.now() - st < 700) show(cur + ((dx < 0) !== (root.dir === 'rtl') ? 1 : -1));
  });

  function apply() {
    root.lang = L; root.dir = L === 'ar' ? 'rtl' : 'ltr'; body.classList.toggle('ar', L === 'ar');
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
    document.title = 'Thabit'; ui();
  }
  apply();
})();
</script>
</body>
</html>
