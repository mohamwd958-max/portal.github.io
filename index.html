<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="js/thabit-loader.js"></script>
<title>Thabit</title>
<link rel="icon" href="assets/thabit-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#ece8df;--ink2:rgba(236,232,223,.72);--gbd:rgba(255,255,255,.16);--gbg:rgba(255,255,255,.1);--sel:rgba(255,255,255,.14);--bar:rgba(92,100,128,.5);--cell:rgba(160,170,205,.16);--shade:rgba(10,12,18,.38);--layer:rgba(30,33,43,.78);--ease:cubic-bezier(.22,1,.36,1)}
body.light{--ink:#1c1a16;--ink2:rgba(28,26,22,.7);--gbd:rgba(28,26,22,.1);--gbg:rgba(255,255,255,.55);--sel:rgba(255,255,255,.85);--bar:rgba(255,255,255,.62);--cell:rgba(28,26,22,.05);--shade:rgba(236,232,222,.45);--layer:rgba(236,232,222,.82)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{font-size:90%}
html,body{min-height:100%;background:#262931}
body{font-family:Inter,Cairo,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.ar{font-family:Cairo,Inter,system-ui,sans-serif}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* background of the app: a quiet grey-blue (the picture belongs to the landing only) */
.bg,.bgl{position:fixed;inset:0;z-index:0;transition:opacity 1.2s ease}
.bg{background:radial-gradient(120% 80% at 50% 18%,#4c5162 0%,#343843 48%,#252831 100%)}
.bg::after{content:"";position:absolute;inset:0;opacity:.2;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.bgl{background:radial-gradient(120% 80% at 50% 18%,#f3f0e8 0%,#e8e4d9 50%,#dcd7ca 100%);opacity:0}
body.light .bgl{opacity:1}
body.th-fade,body.th-fade *{transition:background-color 1s ease,color 1s ease,border-color 1s ease,opacity 1s ease!important}
.glass{background:var(--gbg);border:1px solid var(--gbd);-webkit-backdrop-filter:blur(60px) saturate(1.5);backdrop-filter:blur(60px) saturate(1.5);box-shadow:0 10px 40px rgba(0,0,0,.14)}
.logo{display:block;width:34px;height:34px;background:var(--ink);-webkit-mask:url(assets/thabit-logo.png) center/contain no-repeat;mask:url(assets/thabit-logo.png) center/contain no-repeat}

/* top band (phone: logo + profile) */
.top{position:fixed;top:0;left:0;right:0;z-index:20;height:calc(62px + env(safe-area-inset-top,0px));display:flex;align-items:flex-end;justify-content:space-between;direction:ltr;padding:0 16px 12px;background:var(--bar);border-bottom:1px solid var(--gbd);-webkit-backdrop-filter:blur(40px) saturate(1.4);backdrop-filter:blur(40px) saturate(1.4)}
.prof{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}

/* phone: sections */
main{position:relative;z-index:2;padding:calc(82px + env(safe-area-inset-top,0px)) 16px calc(100px + env(safe-area-inset-bottom,0px));touch-action:pan-y}
#pages{display:grid;min-height:60vh}
.pg{grid-area:1/1;display:none}.pg.on{display:block}
#dpage{display:none}
.ph{font:700 1.3rem Inter,Cairo,sans-serif;text-align:center;margin:6px 0 18px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:18px 20px;border-radius:22px;font-weight:700;font-size:1rem;text-align:start;transition:transform .5s var(--ease)}
@media(hover:hover){.opt:hover{transform:translateY(-2px)}}
.opt:active{transform:scale(.985)}
.pg.on .opt{animation:drop .5s var(--ease) backwards;animation-delay:calc(var(--i)*.07s)}
@keyframes drop{from{opacity:0;translate:0 -40px}to{opacity:1;translate:0 0}}
.soon{padding:34px 20px;border-radius:22px;text-align:center;color:var(--ink2);font-weight:600}
.chev{display:inline-grid;color:var(--ink2)}
[dir=rtl] .chev{transform:scaleX(-1)}

/* phone: bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bar);border-top:1px solid var(--gbd);-webkit-backdrop-filter:blur(40px) saturate(1.4);backdrop-filter:blur(40px) saturate(1.4)}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px;border-radius:18px;color:var(--ink2);font:600 .62rem/1.15 Inter,Cairo,sans-serif;text-align:center;transition:background .4s,color .4s}
body.ar .tb{font-family:Cairo,Inter,sans-serif}
.tb svg{width:19px;height:19px}
.tb.on{background:var(--sel);color:var(--ink)}

/* computer: side bar on the left, logo cell on top, the rest is free for an ad */
.side{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:20;display:none;flex-direction:column;background:var(--bar);border-right:1px solid var(--gbd);-webkit-backdrop-filter:blur(40px) saturate(1.4);backdrop-filter:blur(40px) saturate(1.4)}
.sh{height:78px;flex:none;display:flex;align-items:center;padding:0 24px;background:var(--cell);border-bottom:1px solid var(--gbd)}
.sn{padding:12px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.sl{padding:14px 12px 6px;font:700 .68rem/1 Inter,Cairo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);opacity:.65}
body.ar .sl{letter-spacing:0;text-transform:none;font-size:.78rem}
.si{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;color:var(--ink2);font-weight:600;text-align:start;transition:background .3s,color .3s}
.si:hover,.si.on{background:var(--sel);color:var(--ink)}
.sep{height:1px;background:var(--gbd);margin:10px 8px}
.ic{display:inline-grid;color:#fbbf24}
@media(min-width:1101px){
  .side{display:flex}.bar,#pages,.top .logo{display:none}
  .top{left:280px;height:auto;padding:max(14px,env(safe-area-inset-top,0px)) 24px 0;background:none;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;justify-content:flex-end}
  main{margin-left:280px;padding:96px 40px 48px}
  #dpage{display:block;max-width:1000px;margin:0 auto}
  #dpage .soon{padding:60px 24px}
}

/* popups and full pages */
.shade{position:fixed;inset:0;z-index:15;background:var(--shade);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .3s}
.shade.on{opacity:1;pointer-events:auto}
.pop{position:fixed;left:50%;top:50%;z-index:16;width:min(360px,calc(100vw - 32px));padding:18px;border-radius:24px;opacity:0;pointer-events:none;transform:translate(-50%,-47%) scale(.97);transition:opacity .3s,transform .4s var(--ease)}
.pop.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.pt{font:700 1.05rem Inter,Cairo,sans-serif;text-align:center;margin-bottom:12px}
.pi{display:flex;align-items:center;gap:10px;width:100%;padding:14px 12px;border-radius:14px;font-weight:600;text-align:start;transition:background .3s}
.pi:hover{background:var(--sel)}.pi .chev{margin-inline-start:auto}
.pn{text-align:center;color:var(--ink2);font-weight:600;margin-bottom:10px}
.pr{display:flex;justify-content:space-between;gap:14px;padding:9px 4px;border-top:1px solid var(--gbd);font-weight:600}
.pr span:first-child{color:var(--ink2)}
.layer{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;background:var(--layer);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px)}
.layer.on{display:flex;animation:lin .35s var(--ease)}
@keyframes lin{from{opacity:0;translate:0 16px;filter:blur(8px)}to{opacity:1;translate:0 0;filter:blur(0)}}
.lh{display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top,0px)) 16px 10px}
.lb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
[dir=rtl] .lb svg{transform:scaleX(-1)}
.lh h2{font:700 1.15rem Inter,Cairo,sans-serif}
.lc{flex:1;display:grid;place-items:center;padding:24px;text-align:center;font-weight:600;color:var(--ink2);overflow:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script>try{if(localStorage.getItem('thThemeChoice')==='light')document.body.classList.add('light')}catch(e){}</script>
<div class="bg"></div><div class="bgl"></div>

<aside class="side" id="side"><div class="sh"><i class="logo" role="img" aria-label="Thabit"></i></div><nav class="sn" id="sn"></nav></aside>

<header class="top">
  <i class="logo" role="img" aria-label="Thabit"></i>
  <button class="prof glass" id="prof" type="button" aria-label="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></button>
</header>

<main id="main">
  <div id="pages">
    <section class="pg on" id="p0"><h1 class="ph" data-t="tLang"></h1><div class="opts"><button class="opt glass" style="--i:0" data-open="train" type="button"><span data-t="train"></span><i class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></i></button><button class="opt glass" style="--i:1" data-open="dict" type="button"><span data-t="dict"></span><i class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></i></button><button class="opt glass" style="--i:2" data-open="mirror" type="button"><span data-t="mirror"></span><i class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></i></button><button class="opt glass" style="--i:3" data-open="trans" type="button"><span data-t="trans"></span><i class="chev"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></i></button></div></section>
    <section class="pg" id="p1"><h1 class="ph" data-t="tVo"></h1><div class="soon glass" data-t="soon"></div></section>
    <section class="pg" id="p2"><h1 class="ph" data-t="tDig"></h1><div class="soon glass" data-t="soon"></div></section>
    <section class="pg" id="p3"><h1 class="ph" data-t="tCons"></h1><div class="soon glass" data-t="soon"></div></section>
  </div>
  <section id="dpage"><h1 class="ph" id="dt"></h1><div class="soon glass" id="dp"></div></section>
</main>

<nav class="bar" id="bar">
  <button class="tb on" data-tab="0" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg><span data-t="tLang"></span></button>
  <button class="tb" data-tab="1" type="button"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span data-t="tVo"></span></button>
  <button class="tb" data-tab="2" type="button"><svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13 6l-2 12"/></svg><span data-t="tDig"></span></button>
  <button class="tb" data-tab="3" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-t="tCons"></span></button>
  <button class="tb" id="more" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="more"></span></button>
</nav>

<div class="shade" id="shade"></div>
<div class="pop glass" id="pop" role="dialog"></div>
<div class="layer" id="layer" role="dialog">
  <div class="lh"><button class="lb glass" id="lback" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><h2 id="lt"></h2></div>
  <div class="lc"><p id="lp"></p></div>
</div>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id), body = document.body, root = document.documentElement, AR_TZ = /^(Africa\/(Cairo|Tripoli|Tunis|Algiers|Casablanca|El_Aaiun|Khartoum|Djibouti|Nouakchott|Mogadishu)|Asia\/(Riyadh|Dubai|Baghdad|Amman|Beirut|Damascus|Kuwait|Qatar|Bahrain|Muscat|Aden|Gaza|Hebron)|Indian\/Comoro)$/;
  const D = {
    en: { tLang: 'Language', tVo: 'Voice Over', tDig: 'Digital Solutions', tCons: 'Personal Consultation', vo: 'Voice Over', dig: 'Digital Solutions', cons: 'Personal Consultation', more: 'More', svcLang: 'Language services',
      train: 'Language Training', dict: 'Dictation Pal', mirror: 'Mirroring Room', trans: 'Translation', contact: 'Contact', store: 'Our Store', about: 'About', theme: 'Theme', dark: 'Dark', light: 'Light',
      guest: 'Guest', gnote: 'You are exploring as a guest', fn: 'First name', ln: 'Last name', ph: 'Phone', em: 'Email',
      soon: 'Services will appear here', soon2: 'The content will be here.', dash: 'The dashboard will be here.', contactTxt: 'Contact details will be here.', aboutTxt: 'Information about the Thabit program will be here.' },
    ar: { tLang: 'اللغة', tVo: 'التعليق الصوتي', tDig: 'الحلول الرقمية', tCons: 'الاستشارات الشخصية', vo: 'التعليق الصوتي', dig: 'الحلول الرقمية', cons: 'الاستشارات الشخصية', more: 'المزيد', svcLang: 'خدمات اللغة',
      train: 'التدريب اللغوي', dict: 'رفيق الإملاء', mirror: 'غرفة المرآة', trans: 'الترجمة', contact: 'تواصل معنا', store: 'متجرنا', about: 'عن ثابت', theme: 'المظهر', dark: 'داكن', light: 'فاتح',
      guest: 'ضيف', gnote: 'أنت تستكشف كضيف', fn: 'الاسم الأول', ln: 'الاسم الأخير', ph: 'الهاتف', em: 'البريد الإلكتروني',
      soon: 'ستظهر الخدمات هنا', soon2: 'سيكون المحتوى هنا.', dash: 'ستكون لوحة التحكم هنا.', contactTxt: 'ستكون بيانات التواصل هنا.', aboutTxt: 'هنا ستكون المعلومات عن برنامج ثابت.' }
  };
  let L = 'en'; try { const v = localStorage.getItem('thLandLang'); if (v === 'ar' || v === 'en') L = v; else { let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { } L = (AR_TZ.test(tz) || (navigator.language || '').toLowerCase().indexOf('ar') === 0) ? 'ar' : 'en'; } } catch (e) { }
  const t = k => D[L][k];
  let G = null; try { G = JSON.parse(sessionStorage.getItem('thabitGuest') || 'null'); } catch (e) { }
  window.thabitUser = G ? { isGuest: true, firstName: G.firstName, lastName: G.lastName, name: (G.firstName + ' ' + G.lastName).trim(), phone: G.phone, email: G.email } : null;   /* use it wherever a name is needed: account, messages, simulation... */
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const svg = p => '<svg viewBox="0 0 24 24">' + p + '</svg>';
  const chev = () => { const i = el('i', 'chev'); i.innerHTML = svg('<path d="M9 6l6 6-6 6"/>'); return i; };
  const isLight = () => body.classList.contains('light');
  const themeIc = () => { const i = el('i', 'ic'); i.innerHTML = isLight() ? svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>') : svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'); return i; };
  const isDesk = () => matchMedia('(min-width:1101px)').matches;
  const bodyText = k => k === 'about' ? t('aboutTxt') : k === 'train' ? t('dash') : k === 'contact' ? t('contactTxt') : t('soon2');

  /* ---------- theme / language: applied at once ---------- */
  function doAct(a) {
    if (a === 'theme') { body.classList.add('th-fade'); setTimeout(() => body.classList.remove('th-fade'), 1100); body.classList.toggle('light'); try { localStorage.setItem('thThemeChoice', isLight() ? 'light' : 'dark'); } catch (e) { } buildSide(); ui(); }
    else if (a === 'lang') { L = L === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('thLandLang', L); } catch (e) { } apply(); }
  }

  /* ---------- computer: the side bar and the page next to it ---------- */
  let dkey = 'train';
  function buildSide() {
    const n = $('sn'); n.textContent = '';
    const add = (k, txt) => { const b = el('button', 'si' + (k === dkey ? ' on' : ''), txt); b.type = 'button'; b.dataset.k = k; n.append(b); };
    n.append(el('div', 'sl', t('svcLang')));
    ['train', 'dict', 'mirror', 'trans'].forEach(k => add(k, t(k)));
    ['vo', 'dig', 'cons'].forEach(k => add(k, t(k)));
    n.append(el('div', 'sep')); ['contact', 'store', 'about'].forEach(k => add(k, t(k))); n.append(el('div', 'sep'));
    const th = el('button', 'si'); th.type = 'button'; th.dataset.act = 'theme'; th.append(themeIc(), document.createTextNode(t('theme') + ' · ' + (isLight() ? t('light') : t('dark')))); n.append(th);
    const lg = el('button', 'si', L === 'ar' ? 'English' : 'العربية'); lg.type = 'button'; lg.dataset.act = 'lang'; n.append(lg);
  }
  function fillDesk() { $('dt').textContent = t(dkey); $('dp').textContent = bodyText(dkey); document.querySelectorAll('.si[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === dkey)); }
  function showDesk(k) {
    if (k === dkey) return; dkey = k; const p = $('dpage'); p.getAnimations().forEach(x => x.cancel()); fillDesk();
    p.animate([{ opacity: 0, filter: 'blur(10px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 340, easing: 'ease-out' });
  }
  $('sn').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.k) showDesk(b.dataset.k); else if (b.dataset.act) doAct(b.dataset.act); };

  /* ---------- phone: layers (popups and pages), closed one by one with Back ---------- */
  const stack = []; let pending = null;
  const last = type => [...stack].reverse().find(l => l.type === type);
  function renderPop(k) {
    const p = $('pop'); p.textContent = '';
    if (k === 'more') {
      p.append(el('h3', 'pt', t('more')));
      ['contact', 'store', 'about'].forEach(a => { const b = el('button', 'pi', t(a)); b.type = 'button'; b.dataset.act = a; b.append(chev()); p.append(b); });
      const th = el('button', 'pi'); th.type = 'button'; th.dataset.act = 'theme'; th.append(themeIc(), document.createTextNode(t('theme') + ' · ' + (isLight() ? t('light') : t('dark')))); p.append(th);
      const lg = el('button', 'pi', L === 'ar' ? 'English' : 'العربية'); lg.type = 'button'; lg.dataset.act = 'lang'; p.append(lg);
    } else {
      p.append(el('h3', 'pt', G ? (G.firstName + ' ' + G.lastName).trim() : t('guest'))); p.append(el('p', 'pn', t('gnote')));
      [['fn', G && G.firstName], ['ln', G && G.lastName], ['ph', G && G.phone], ['em', G && G.email]].forEach(([k2, v]) => { const r = el('div', 'pr'), s = el('span', null, v || '—'); s.dir = 'ltr'; r.append(el('span', null, t(k2)), s); p.append(r); });
    }
  }
  function ui() {
    const pop = last('pop'), pg = last('page');
    $('shade').classList.toggle('on', !!pop); $('pop').classList.toggle('on', !!pop); if (pop) renderPop(pop.key);
    const ly = $('layer');
    if (pg) { $('lt').textContent = t(pg.key); $('lp').textContent = bodyText(pg.key); ly.classList.add('on'); } else ly.classList.remove('on');
    body.classList.toggle('lock', stack.length > 0);
  }
  function push(l) { stack.push(l); history.pushState({ d: stack.length }, ''); ui(); }
  function openPop(k) { const top = stack[stack.length - 1]; if (top && top.type === 'pop') { if (top.key === k) return closeAll(); top.key = k; ui(); } else push({ type: 'pop', key: k }); }
  function closeAll(fn) { if (!stack.length) { if (fn) fn(); return; } pending = fn || null; history.go(-stack.length); }
  window.addEventListener('popstate', e => {
    const d = (e.state && e.state.d) || 0; while (stack.length > d) stack.pop(); ui();
    if (pending) { const f = pending; pending = null; f(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) history.back(); });
  matchMedia('(min-width:1101px)').addEventListener('change', () => { if (stack.length) closeAll(); });
  $('shade').onclick = () => closeAll();
  $('lback').onclick = () => history.back();
  $('prof').onclick = () => openPop('prof');
  $('more').onclick = () => openPop('more');
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => push({ type: 'page', key: b.dataset.open }));
  $('pop').onclick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return; const a = b.dataset.act;
    if (a === 'contact' || a === 'store' || a === 'about') push({ type: 'page', key: a });   /* a full page on top; Back returns to this menu */
    else doAct(a);
  };

  /* ---------- phone: the four sections, swipe or tap, soft blur between them ---------- */
  let cur = 0; const tabs = document.querySelectorAll('.tb[data-tab]');
  function show(i) {
    if (i === cur || i < 0 || i > 3) return;
    const a = $('p' + cur), b = $('p' + i), s = (i > cur ? 1 : -1) * (root.dir === 'rtl' ? -1 : 1) * 34;
