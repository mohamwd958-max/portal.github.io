    <!-- PWA -->

    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="Css/portal.css">

    <style id="thPortalLook">
    /* ---------- page ---------- */
    html body:not(.light-theme){background-color:#050506!important;background-image:none!important}
    html body.light-theme{background-color:#f4f6f9!important;background-image:none!important}
    html body{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))!important}
    .thabit-moving-ornament{display:none!important}

    /* ---------- bottom bar ---------- */
    html body #mobileFloatingBar:not(#z):not(#y){
      position:fixed!important;left:0!important;right:0!important;top:auto!important;bottom:0!important;
      margin:0 auto!important;transform:none!important;translate:none!important;
      width:min(100%,520px)!important;max-width:none!important;
      height:calc(54px + env(safe-area-inset-bottom,0px))!important;min-height:0!important;box-sizing:border-box!important;
      padding:0 8px env(safe-area-inset-bottom,0px)!important;
      display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;
      justify-content:space-around!important;align-items:center!important;gap:0!important;
      direction:ltr!important;border-radius:16px 16px 0 0!important;
      border:0!important;outline:0!important;box-shadow:none!important;
      background:rgba(255,255,255,.09)!important;background-image:none!important;
      -webkit-backdrop-filter:blur(20px) saturate(1.8)!important;backdrop-filter:blur(20px) saturate(1.8)!important;
      z-index:2147483000!important;overflow:visible!important}
    @media(max-width:600px){html body #mobileFloatingBar:not(#z):not(#y){width:100%!important;border-radius:0!important}}
    html body.light-theme #mobileFloatingBar:not(#z):not(#y){background:rgba(255,255,255,.5)!important}
    html body #mobileFloatingBar .bar-divider{display:none!important}
    html body #mobileFloatingBar::before,html body #mobileFloatingBar::after{content:none!important;display:none!important}

    html body #mobileFloatingBar>.circle-badge-btn:not(#z){
      position:relative!important;box-sizing:border-box!important;flex:1 1 0!important;
      width:auto!important;min-width:0!important;max-width:76px!important;height:44px!important;
      margin:0!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;
      background:transparent!important;background-image:none!important;border:0!important;outline:0!important;box-shadow:none!important;
      -webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:50%!important;
      color:#fff!important;opacity:1!important;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none!important;
      touch-action:manipulation;-webkit-user-select:none;user-select:none;
      font:700 13px/1 Inter,Cairo,sans-serif!important;letter-spacing:0!important;
      transition:color .24s ease,scale .95s cubic-bezier(.22,1,.36,1),translate .95s cubic-bezier(.22,1,.36,1)!important}
    html body.light-theme #mobileFloatingBar>.circle-badge-btn:not(#z){color:#0f172a!important}
    html body #mobileFloatingBar>.circle-badge-btn::before,html body #mobileFloatingBar>.circle-badge-btn::after{content:none!important;display:none!important}
    html body #mobileFloatingBar>.circle-badge-btn i{font-size:21px!important;line-height:1!important;color:inherit!important}
    html body #mobileFloatingBar>.circle-badge-btn.active:not(#z){color:#34d399!important;font-weight:900!important;scale:1.2;translate:0 -2px}
    html body.light-theme #mobileFloatingBar>.circle-badge-btn.active:not(#z){color:#059669!important}
    @media(hover:hover){
      html body #mobileFloatingBar>.circle-badge-btn:not(.active):not(#z):hover{scale:1.2;translate:0 -2px}
    }
    /* pressed: sinks a little, springs back when released */
    html body #mobileFloatingBar>.circle-badge-btn.pr:not(#z){scale:.84!important;translate:0 1px!important;transition:scale .6s cubic-bezier(.3,.7,.3,1),translate .6s ease-out,color .24s ease!important}
    html body #mobileFloatingBar #floatBtnTheme{color:#fff!important}
    html body.light-theme #mobileFloatingBar #floatBtnTheme{color:#0f172a!important}
    html body #mobileFloatingBar #themeIcon{font-weight:400!important}
    html body #mobileFloatingBar #placementBtn .thabit-logo-mark{display:block!important;width:28px!important;height:28px!important;margin:0!important;flex:none}

    /* =====================================================================
       REAL-CLICK ANIMATION  (change the numbers here to tune it)
       hover  : grows a couple of px, slowly, and stays until the pointer leaves
       down   : sinks a few px and freezes (no sideways / upward movement)
       return : always slow
       classes: .rc-hov (hover, card + orb)   .rc-down (pressed / held)
       ===================================================================== */
    :root{--rc-hover-card:1.014;--rc-hover-ctl:1.03;--rc-down-card:.978;--rc-down-ctl:.94;
          --rc-fast:.2s;--rc-slow:.85s;--rc-ease:cubic-bezier(.22,1,.36,1)}

    /* ---------- login card: glass all the time ---------- */
    html body .portal-card:not(#z){
      border-radius:22px!important;-webkit-backdrop-filter:blur(24px) saturate(1.3)!important;backdrop-filter:blur(24px) saturate(1.3)!important;
      touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
      transition:scale var(--rc-slow) var(--rc-ease)!important}
    /* any older hover effect on the card (Css/portal.css) is cancelled here; hover now comes only from Real-click animation */
    html body:not(.light-theme) .portal-card:not(#z){
      background:rgba(255,255,255,.04)!important;background-image:none!important;
      border:1px solid rgba(255,255,255,.09)!important;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 10px 30px rgba(0,0,0,.45)!important;color:#f1f5f9!important}
    html body.light-theme .portal-card:not(#z){
      background:rgba(255,255,255,.55)!important;background-image:none!important;
      border:1px solid rgba(15,23,42,.1)!important;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 26px rgba(15,23,42,.1)!important;color:#0f172a!important}
    html body .portal-card::before,html body .portal-card::after{animation:none!important}
    html body .portal-card .card-header-title{margin-bottom:26px!important;font-weight:800!important}

    /* soft light that passes BEHIND the glass: left, bottom, right, top */
    html body .lgorb{--lc:255,255,255;position:absolute!important;overflow:hidden!important;border-radius:22px!important;pointer-events:none!important;z-index:0!important;
      transition:scale var(--rc-slow) var(--rc-ease)}
    html body.light-theme .lgorb{--lc:251,191,36}
    html body .portal-card.rc-hov:not(#z),html body .lgorb.rc-hov{scale:var(--rc-hover-card)}
    html body .portal-card.rc-down:not(#z),html body .lgorb.rc-down{scale:var(--rc-down-card);transition:scale var(--rc-fast) ease-out!important}
    .lgorb .le{position:absolute;inset:0;opacity:0}
    .lgorb .le.l{background:linear-gradient(90deg,rgba(var(--lc),.34),rgba(var(--lc),.1) 28%,transparent 58%)}
    .lgorb .le.r{background:linear-gradient(270deg,rgba(var(--lc),.34),rgba(var(--lc),.1) 28%,transparent 58%)}
    .lgorb .le.b{background:linear-gradient(0deg,rgba(var(--lc),.34),rgba(var(--lc),.1) 28%,transparent 58%)}
    .lgorb .le.t{background:linear-gradient(180deg,rgba(var(--lc),.34),rgba(var(--lc),.1) 28%,transparent 58%)}

    /* ---------- floating-label fields ---------- */
    .fl{position:relative;padding-top:18px;margin:0 0 2px}
    .fl input{
      display:block;width:100%;box-sizing:border-box;height:46px;padding:0 14px!important;margin:0!important;text-align:left;
      border-radius:14px!important;border:1px solid rgba(148,163,184,.35)!important;background:rgba(148,163,184,.07)!important;
      color:inherit!important;font:500 .92rem Inter,Cairo,sans-serif!important;outline:0!important;box-shadow:none!important;
      -webkit-user-select:text;user-select:text;
      caret-color:#fbbf24;color-scheme:dark;-webkit-text-fill-color:currentColor;
      transition:border-color .3s,box-shadow .3s,background .3s,scale var(--rc-slow) var(--rc-ease)!important}
    html body.light-theme .fl input{color-scheme:light}
    @media(hover:hover){html body .fl input:hover{scale:var(--rc-hover-ctl)}}
    html body .fl input.rc-down{scale:var(--rc-down-ctl)!important;transition:border-color .3s,box-shadow .3s,background .3s,scale var(--rc-fast) ease-out!important}

    /* browser autofill / saved or suggested password: keep OUR text colour, font and background, never the browser's white-on-white */
    html body .fl input:-webkit-autofill,html body .fl input:-webkit-autofill:hover,html body .fl input:-webkit-autofill:focus,html body .fl input:-webkit-autofill:active{
      -webkit-text-fill-color:#f1f5f9!important;caret-color:#fbbf24!important;font:500 .92rem Inter,Cairo,sans-serif!important;
      transition:background-color 600000s 0s,color 600000s 0s,border-color .3s,box-shadow .3s,scale var(--rc-slow) var(--rc-ease)!important}
    html body .fl input:autofill,html body .fl input:autofill:hover,html body .fl input:autofill:focus,html body .fl input:autofill:active{
      -webkit-text-fill-color:#f1f5f9!important;caret-color:#fbbf24!important;font:500 .92rem Inter,Cairo,sans-serif!important;
      transition:background-color 600000s 0s,color 600000s 0s,border-color .3s,box-shadow .3s,scale var(--rc-slow) var(--rc-ease)!important}
    html body.light-theme .fl input:-webkit-autofill,html body.light-theme .fl input:-webkit-autofill:hover,html body.light-theme .fl input:-webkit-autofill:focus,html body.light-theme .fl input:-webkit-autofill:active{-webkit-text-fill-color:#0f172a!important}
    html body.light-theme .fl input:autofill,html body.light-theme .fl input:autofill:hover,html body.light-theme .fl input:autofill:focus,html body.light-theme .fl input:autofill:active{-webkit-text-fill-color:#0f172a!important}
    .fl:not(.act) input{caret-color:transparent}
    .fl input::placeholder{color:transparent!important}
    .fl.pw input{padding-right:46px!important}
    html body.light-theme .fl input{background:rgba(255,255,255,.7)!important;color:#0f172a!important;border-color:rgba(15,23,42,.18)!important}
    html body .fl.act input{border-color:#fbbf24!important;box-shadow:0 0 0 3px rgba(251,191,36,.16)!important;background:rgba(251,191,36,.05)!important}

    .fl label{
      position:absolute;inset-inline-start:15px;top:41px;transform:translateY(-50%);margin:0;padding:0;
      font:500 .92rem Inter,Cairo,sans-serif;opacity:.55;pointer-events:none;white-space:nowrap;
      transition:top .3s cubic-bezier(.22,1,.36,1),font-size .3s,opacity .3s,color .3s,letter-spacing .3s}
    .fl.act input + label,.fl input:not(:placeholder-shown) + label,.fl input:-webkit-autofill + label{top:6px;font-size:.72rem;font-weight:700;opacity:.9;letter-spacing:.3px}
    .fl.act input + label{color:#fbbf24;opacity:1}
    html body.light-theme .fl.act input + label{color:#b45309}

    html body .fl.ok input{border-color:#34d399!important;background:rgba(52,211,153,.07)!important;box-shadow:0 0 0 3px rgba(52,211,153,.12)!important}
    html body .fl.ok input + label{color:#34d399!important;opacity:1!important}
    html body.light-theme .fl.ok input + label{color:#059669!important}
    html body .fl.bad input{border-color:#f87171!important;background:rgba(248,113,113,.08)!important;box-shadow:0 0 0 3px rgba(248,113,113,.14)!important}
    html body .fl.bad input + label{color:#f87171!important;opacity:1!important}

    .fmsg{max-height:0;overflow:hidden;opacity:0;margin:0;color:#f87171;font:600 .72rem Inter,Cairo,sans-serif;transition:max-height .3s,opacity .3s,margin .3s}
    .fmsg.show{max-height:24px;opacity:1;margin-top:6px}

    .fhint{position:absolute;left:15px;top:41px;transform:translateY(-50%);direction:ltr;white-space:nowrap;pointer-events:none;
      font:500 .92rem Inter,Cairo,sans-serif;opacity:.4;transition:opacity .35s}

    /* ---------- eye button ---------- */
    .fl .eye{position:absolute;right:10px;top:41px;translate:0 -50%;width:34px;height:34px;padding:0;margin:0;border:0;background:none;color:inherit;opacity:.7;
      display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
      transition:scale var(--rc-slow) var(--rc-ease),opacity .25s}
    @media(hover:hover){.fl .eye:hover{opacity:1;scale:var(--rc-hover-ctl)}}
    .fl .eye.rc-down{scale:var(--rc-down-ctl)!important;transition:scale var(--rc-fast) ease-out,opacity .25s!important}
    .eye svg{width:22px;height:22px;display:block;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .eye .pup{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:center}
    .eye.glow .pup{animation:pupGlow 1.3s ease-in-out 1}
    @keyframes pupGlow{0%{fill:currentColor;filter:none;scale:1}35%{fill:#fbbf24;filter:drop-shadow(0 0 3px #fbbf24) drop-shadow(0 0 8px rgba(251,191,36,.9));scale:1.5}100%{fill:currentColor;filter:none;scale:1}}

    /* shown password: blurred letters that clear one by one, not copyable */
    .fl.show input,html body .fl.show input:-webkit-autofill,html body .fl.show input:autofill{color:transparent!important;-webkit-text-fill-color:transparent!important}
    .fl.show input::selection{background:transparent}
    .pwv{position:absolute;left:0;right:0;top:18px;height:46px;box-sizing:border-box;padding:0 46px 0 14px;overflow:hidden;pointer-events:none;
      -webkit-user-select:none;user-select:none;direction:ltr;display:none;align-items:center;border-radius:14px}
    .fl.show .pwv{display:flex}
    .pwi{display:flex;white-space:pre;font:500 .92rem Inter,Cairo,sans-serif}
    .pwi span{display:inline-block;transition:filter .55s ease,opacity .55s ease}
    .pwi span.bl{filter:blur(9px);opacity:.25}

    /* ---------- login button: square -> circle -> check ---------- */
    html body .portal-card .btn:not(#z){
      position:relative!important;overflow:hidden!important;display:flex!important;align-items:center!important;justify-content:center!important;
      width:100%!important;height:46px!important;margin:18px auto 0!important;padding:0!important;
      border:1px solid rgba(251,191,36,.6)!important;border-radius:14px!important;
      background:rgba(251,191,36,.06)!important;background-image:none!important;color:#fbbf24!important;
      -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);touch-action:manipulation;
      font:800 .92rem Inter,Cairo,sans-serif!important;letter-spacing:.5px;cursor:pointer;box-shadow:none!important;
      transition:width .5s cubic-bezier(.65,0,.35,1),border-radius .5s cubic-bezier(.65,0,.35,1),background .3s,box-shadow .3s,color .3s,border-color .3s,scale var(--rc-slow) var(--rc-ease)!important}
    html body .portal-card .btn.rc-down:not(#z){scale:var(--rc-down-ctl);transition:width .5s cubic-bezier(.65,0,.35,1),border-radius .5s cubic-bezier(.65,0,.35,1),background .3s,box-shadow .3s,color .3s,border-color .3s,scale var(--rc-fast) ease-out!important}
    html body .portal-card .btn::before,html body .portal-card .btn::after{content:none!important;display:none!important}
    @media(hover:hover){html body .portal-card .btn[data-state="idle"]:hover{background:rgba(251,191,36,.16)!important;box-shadow:0 0 22px rgba(251,191,36,.22)!important;scale:var(--rc-hover-ctl)}}
    html body.light-theme .portal-card .btn:not(#z){color:#92400e!important;border-color:rgba(180,83,9,.55)!important;background:rgba(251,191,36,.12)!important}
    .btn .bt{white-space:nowrap;transition:opacity .15s}
    .btn .sp{position:absolute;left:50%;top:50%;translate:-50% -50%;width:18px;height:18px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;opacity:0;animation:lgSpin .8s linear infinite;transition:opacity .25s}
    .btn .ck{position:absolute;left:50%;top:50%;translate:-50% -50%;width:26px;height:26px;opacity:0;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
    .btn .ck path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s ease .1s}
    html body .portal-card .btn[data-state="busy"]:not(#z),html body .portal-card .btn[data-state="done"]:not(#z){width:46px!important;border-radius:23px!important}
    .btn[data-state="busy"] .bt,.btn[data-state="done"] .bt{opacity:0}
    .btn[data-state="busy"] .sp{opacity:1}
    html body .portal-card .btn[data-state="done"]:not(#z){color:#34d399!important;border-color:#34d399!important;background:rgba(52,211,153,.12)!important}
    .btn[data-state="done"] .ck{opacity:1}
    .btn[data-state="done"] .ck path{stroke-dashoffset:0}
    @keyframes lgSpin{to{rotate:360deg}}


    /* =====================================================================
       OPTION PAGES + bar appears only after the intro
       ===================================================================== */
    html body #login-screen{transition:opacity .9s ease}
    html body:not(.th-ready) #login-screen{opacity:0!important}
    html body:not(.th-ready) #mobileFloatingBar:not(#z):not(#y){opacity:0!important;visibility:hidden!important;pointer-events:none!important;translate:0 100%!important}
    html body #mobileFloatingBar:not(#z):not(#y){transition:opacity .9s ease,translate .9s var(--rc-ease),visibility 0s}

    #optPanel{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;box-sizing:border-box;padding:20px 16px calc(84px + env(safe-area-inset-bottom,0px));pointer-events:none;overflow:auto}
    #optPanel .optcard{pointer-events:auto;width:min(100%,380px);box-sizing:border-box;text-align:center;padding:38px 24px;border-radius:22px;color:#f1f5f9;
      background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 10px 30px rgba(0,0,0,.45)}
    html body.light-theme #optPanel .optcard{color:#0f172a;background:rgba(255,255,255,.55);border-color:rgba(15,23,42,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 8px 26px rgba(15,23,42,.1)}
    #optPanel .optcard i{font-size:34px;color:#fbbf24;margin-bottom:16px;display:block}
    html body.light-theme #optPanel .optcard i{color:#b45309}
    #optPanel .optcard h2{margin:0 0 10px;font:800 1.15rem Inter,Cairo,sans-serif}
    #optPanel .optcard p{margin:0;font:500 .88rem/1.6 Inter,Cairo,sans-serif;opacity:.65}


    /* =====================================================================
       BOTTOM BAR: Language (one button) + Services (pop-up menu) + Theme
       ===================================================================== */
    html body #mobileFloatingBar>.circle-badge-btn.pmbtn:not(#z){max-width:132px!important;border-radius:22px!important;gap:7px!important;padding:0 6px!important;touch-action:none!important;-webkit-touch-callout:none;white-space:nowrap;font-size:12.5px!important}
    html body #mobileFloatingBar>.pmbtn i{font-size:16px!important}
    html body #mobileFloatingBar>.pmbtn.open:not(#z){color:#34d399!important;scale:1.08;translate:0 -2px}
    html body.light-theme #mobileFloatingBar>.pmbtn.open:not(#z){color:#059669!important}

    .pmscrim{position:fixed;inset:0;z-index:2147482999;background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s ease}
    html body.light-theme .pmscrim{background:rgba(255,255,255,.35)}
    .pmscrim.on{opacity:1;pointer-events:auto}
    .pm{position:fixed;z-index:2147483001;display:none;box-sizing:border-box;padding:8px;border-radius:24px;color:#f1f5f9;
      background:rgba(28,30,36,.72);border:1px solid rgba(255,255,255,.12);-webkit-backdrop-filter:blur(28px) saturate(1.5);backdrop-filter:blur(28px) saturate(1.5);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 18px 50px rgba(0,0,0,.55);
      opacity:0;scale:.86;translate:0 14px;transition:opacity .22s ease,scale .45s cubic-bezier(.34,1.4,.64,1),translate .45s var(--rc-ease)}
    html body.light-theme .pm{color:#0f172a;background:rgba(255,255,255,.78);border-color:rgba(15,23,42,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 16px 44px rgba(15,23,42,.22)}
    .pm.open{opacity:1;scale:1;translate:0 0}
    .pmi{position:relative;display:flex;align-items:center;gap:13px;min-height:54px;box-sizing:border-box;padding:7px 12px;border-radius:16px;cursor:pointer;
      -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
      opacity:0;translate:0 10px;
      transition:opacity .35s ease calc(var(--i) * 38ms + 60ms),translate .5s var(--rc-ease) calc(var(--i) * 38ms + 60ms),scale var(--rc-slow) var(--rc-ease),background .25s,color .25s}
    .pm.open .pmi{opacity:1;translate:0 0}
    .pmi .pmt{flex:none;width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(148,163,184,.16);font:800 .74rem Inter,Cairo,sans-serif;transition:background .25s,color .25s}

    /* small buttons (Be Thabit / Continue as guest): outlined */
    html body:not(#zz):not(#zy) .xbtn,html body:not(#zz):not(#zy) .xbtn.gold{background:var(--bg)!important;border:1px solid var(--line2)!important;color:var(--ink)!important;border-radius:12px!important;box-shadow:none!important}
    html body:not(#zz):not(#zy) .xbtn:hover,html body:not(#zz):not(#zy) .xbtn.gold:hover{background:var(--chip)!important;box-shadow:none!important}
    html body:not(#zz):not(#zy) #thDots i{color:var(--ink)}

    /* header */
    html body:not(#zz):not(#zy) #thHead{background:var(--bg)!important;border-bottom:1px solid var(--line)!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
    html body:not(#zz):not(#zy) #thHeadLogo{background:var(--ink)!important}
    html body:not(#zz):not(#zy) #thHeadTxt{color:var(--muted)!important}

    /* bottom bar */
    html body:not(#zz):not(#zy) #mobileFloatingBar:not(#z):not(#y){background:var(--bar)!important;border:1px solid var(--line)!important;border-bottom:0!important;box-shadow:none!important;
      -webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-radius:18px 18px 0 0!important;height:calc(64px + env(safe-area-inset-bottom,0px))!important}
    @media(max-width:600px){html body:not(#zz):not(#zy) #mobileFloatingBar:not(#z):not(#y){border-radius:0!important;border-left:0!important;border-right:0!important}}
    html body:not(#zz):not(#zy) #mobileFloatingBar:not(#z):not(#y)>.circle-badge-btn:not(#z):not(#y){color:var(--muted)!important;border-radius:12px!important;font-size:11px!important;height:48px!important}
    html body:not(#zz):not(#zy) #mobileFloatingBar:not(#z):not(#y)>.circle-badge-btn.lbl:not(#z):not(#y) i{font-size:20px!important}
    html body:not(#zz):not(#zy) #mobileFloatingBar:not(#z):not(#y)>.circle-badge-btn.cur:not(#z):not(#y),
    html body:not(#zz):not(#zy) #mobileFloatingBar:not(#z):not(#y)>.circle-badge-btn.open:not(#z):not(#y){color:var(--ink)!important;background:var(--chip)!important}
    html body:not(#zz):not(#zy) #mobileFloatingBar #floatBtnTheme{color:var(--muted)!important}

    /* quick-access strip + pop-ups + sheet */
    html body:not(#zz):not(#zy) #svcStrip{background:var(--bar)!important;border:1px solid var(--line)!important;box-shadow:0 8px 24px rgba(0,0,0,.1)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;color:var(--ink)!important}
    html body:not(#zz):not(#zy) #svcStrip .sq{background:var(--card)!important;border:1px solid var(--line2)!important;color:var(--ink)!important}
    html body:not(#zz):not(#zy) #svcStrip .sq.on{color:var(--acc)!important;border-color:var(--acc)!important;background:rgba(251,191,36,.12)!important}
    html body:not(#zz):not(#zy) #svcStrip .sq .pin{color:var(--acc)!important}
    html body:not(#zz):not(#zy) .pmscrim{background:rgba(0,0,0,.18)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
    html body:not(#zz):not(#zy) .pmi.on,html body:not(#zz):not(#zy) .pmi.on .pmc{color:var(--acc)!important}
    html body:not(#zz):not(#zy) .pmi .pmt{background:var(--chip)!important}
    html body:not(#zz):not(#zy) #optPanel .optcard i,html body:not(#zz):not(#zy) #thSheet .shi i,html body:not(#zz):not(#zy) #thSheet .shg,html body:not(#zz):not(#zy) #thSheet .shi .shc{color:var(--acc)!important}
    html body:not(#zz):not(#zy) #thSheet .shi{background:var(--field)!important}
    html body:not(#zz):not(#zy) #thSheet .shf input,html body:not(#zz):not(#zy) #thSheet .shf textarea{background:var(--field)!important;border:1px solid var(--line2)!important;color:var(--ink)!important}
    html body:not(#zz):not(#zy) #thSheet .shs{background:var(--ink)!important;color:var(--onink)!important;border:0!important}

    html body:not(#zz):not(#zy){font-family:Inter,Cairo,sans-serif}
    html body:not(#zz):not(#zy) #portalLayout{width:min(92vw,380px)!important;max-width:none!important;margin:0 auto!important;padding:0!important}
    html body:not(#zz):not(#zy) #cardLogin:not(#z){width:100%!important;max-width:none!important;margin:0!important;box-sizing:border-box!important;padding:26px 28px 26px!important;text-align:start}

    html body:not(#zz):not(#zy) .bcard .xq{margin:0;text-align:start;opacity:1;font-weight:600;font-size:.9rem}
    html body:not(#zz):not(#zy) .bcard .xbtn{width:auto!important;height:38px;margin:0;padding:0 16px;font-size:.84rem}

    <!-- thGlassLight: ONE soft light (width = 1/4 of the bar, centered) rising through the glass from the bottom bar up to the header every 10 s. Never leaves a piece's border. -->
    <script>
    (function () {
      'use strict';
      const CYCLE = 20000, DUR = 3000;
      let t0 = 0, lit = false;
      const bar = document.getElementById('mobileFloatingBar');
      const sel = '#mobileFloatingBar,.portal-card,.xcard,.gcard,#optPanel .optcard,#thHead,[data-glass]';   /* any glass piece, whatever its size or count */
      const ready = setInterval(() => { if (document.body.classList.contains('th-ready')) { clearInterval(ready); t0 = performance.now() + 1500; requestAnimationFrame(tick); } }, 100);
      function blobOf(el) {
        let g = el.querySelector(':scope > .glw');
        if (!g) { g = document.createElement('div'); g.className = 'glw'; g.setAttribute('aria-hidden', 'true'); g.appendChild(document.createElement('b')); el.insertBefore(g, el.firstChild); }
        return g;
      }
      function tick(now) {
        requestAnimationFrame(tick);
        const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
        const p = (now < t0 || reduce || document.hidden) ? -1 : ((now - t0) % CYCLE) / DUR;
        const gw = Math.max(60, Math.round(bar.getBoundingClientRect().width / 4));
        const e = p >= 0 && p <= 1 ? 0.5 - 0.5 * Math.cos(Math.PI * p) : -1;
        const y = e < 0 ? 0 : innerHeight - e * (innerHeight + 10);
        if (e < 0) { if (lit) { document.querySelectorAll('.glw b').forEach(b => { b.style.opacity = 0; }); lit = false; } return; }
        lit = true;
        document.querySelectorAll(sel).forEach(el => {
          const g = blobOf(el), b = g.firstChild, r = el.getBoundingClientRect();
          if (e < 0 || !r.width || !r.height) { b.style.opacity = 0; return; }
          const bh = Math.round(Math.min(220, Math.max(54, r.height * 0.7)));
          g.style.setProperty('--bh', bh + 'px');
          const top = y - r.top - bh / 2;
          const on = top > -bh && top < r.height;
          b.style.opacity = on ? 1 : 0;
          if (on) b.style.translate = '0 ' + top + 'px';
        });
      }
    })();

    <!-- Login stack: swipe left on the Login card for "Are you a guest?" (same size, blur-out / fade-in); small "Be Thabit" card sits under it -->
    <script>
    (function () {
      'use strict';
      const $ = id => document.getElementById(id);
      const par = $('portalLayout'), card = $('cardLogin'), getIn = $('btnLoginBtn');
      if (getComputedStyle(par).position === 'static') par.style.position = 'relative';
      const T = {

        ar: { gt: 'هل أنت ضيف؟', gs: 'تصفّح بدون حساب.', gb: 'المتابعة كضيف', q: 'لست من ثابت بعد؟', be: 'كن ثابت' },

      /* the login card goes into a wrapper so the blur can be animated on it */

      card.parentNode.insertBefore(wLogin, card); wLogin.appendChild(card);

      const guest = document.createElement('div'); guest.className = 'gcard'; guest.setAttribute('data-glass', '');
      guest.innerHTML = '<h2 id="gT"></h2><p id="gS"></p><div class="xbtn" id="xGuest" role="button" tabindex="0"></div>';
      const be = document.createElement('div'); be.className = 'xcard bcard'; be.style.setProperty('--xd', '.3s');
      be.innerHTML = '<p class="xq" id="xQ"></p><div class="xbtn gold" id="xBe" role="button" tabindex="0"></div>';
      const dots = document.createElement('div'); dots.id = 'thDots';
      dots.innerHTML = '<div class="dpill"><button type="button" class="da dl" aria-label="Previous" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><span class="dd"><i class="on"></i><i></i></span><button type="button" class="da dr" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>';
      const dPill = dots.firstChild, dDots = dots.querySelector('.dd'), dL = dots.querySelector('.dl'), dR = dots.querySelector('.dr');

      const gBtn = $('xGuest'), bBtn = $('xBe');

      /* guest card = exactly the login card's box; Be Thabit card sits under it */

        const w = card.offsetWidth, h = card.offsetHeight, bw = getIn.offsetWidth;
