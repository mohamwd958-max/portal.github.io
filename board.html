<!doctype html>
<html lang="ar" dir="ltr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Thabit Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/board.css">
</head>
<body>

<canvas id="cv"></canvas>
<div id="editLayer"></div>

<!-- top left: board name + boards menu -->
<div class="panel" id="topLeft">
  <button class="ib" id="btnBoards" title="اللوحات"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <input id="title" dir="auto" spellcheck="false" maxlength="80" placeholder="اسم اللوحة" autocomplete="off">
  <span class="tag" id="kindTag" hidden></span>
</div>

<!-- top center: status -->
<div id="status" class="panel"><i></i><span id="statusTxt">...</span></div>
<button id="followBtn" class="panel pill" hidden>🎯 تابع المدرس</button>

<!-- top right -->
<div class="panel" id="topRight">
  <button class="ib" id="btnTheme" title="فاتح / غامق"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  <button class="ib" id="btnFull" title="ملء الشاشة"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  <button class="pill dark edit-only" id="btnShare"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg><span>مشاركة</span></button>
  <button class="pill view-only" id="btnExportV"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg><span>صورة</span></button>
</div>

<!-- left toolbar -->
<div class="panel col" id="toolbar">
  <button class="ib t" data-tool="select" title="تحديد (V)"><svg viewBox="0 0 24 24"><path d="M4.04 4.69a.5.5 0 0 1 .65-.65l16 6.5a.5.5 0 0 1-.06.95l-6.12 1.58a2 2 0 0 0-1.44 1.43l-1.58 6.13a.5.5 0 0 1-.95.06z"/></svg></button>
  <button class="ib t" data-tool="hand" title="تحريك اللوحة (Space)"><svg viewBox="0 0 24 24"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/></svg></button>
  <i class="sep edit-only"></i>
  <button class="ib t edit-only" data-tool="pen" title="قلم وألوان (P)"><svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
  <button class="ib t edit-only" data-tool="text" title="نص (T)"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg></button>
  <button class="ib t edit-only" data-tool="sticky" title="ستيكي نوت (S)"><svg viewBox="0 0 24 24"><path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/></svg></button>
  <button class="ib t edit-only" id="btnShapes" data-tool="shape" title="أشكال (R / O / A / L)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1"/><circle cx="17" cy="7" r="4"/><path d="M12 14l5 7H7z"/></svg></button>
  <button class="ib edit-only" id="btnImage" title="صورة / لقطة شاشة (أو Paste)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg></button>
  <i class="sep edit-only"></i>
  <button class="ib edit-only" id="btnTouch" title="اللمس بالإصبع: يرسم / يحرّك فقط"><svg viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v4M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3.2-2.4L8 15"/></svg></button>
</div>
<div class="panel col edit-only" id="undoBar">
  <button class="ib" id="btnUndo" title="تراجع (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
  <button class="ib" id="btnRedo" title="إعادة (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg></button>
</div>

<!-- shapes popover -->
<div class="panel pop" id="shapePop" hidden>
  <button class="ib" data-shape="rect" title="مستطيل (R)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg></button>
  <button class="ib" data-shape="ellipse" title="دائرة (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
  <button class="ib" data-shape="arrow" title="سهم (A)"><svg viewBox="0 0 24 24"><path d="M5 19 19 5M9 5h10v10"/></svg></button>
  <button class="ib" data-shape="line" title="خط (L)"><svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg></button>
</div>

<!-- pen / eraser flyout -->
<div class="panel col flyout" id="penPop" hidden>
  <button class="ib" data-ink="pen" title="قلم (P)"><svg viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
  <button class="ib" data-ink="hl" title="هايلايتر (H)"><svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg></button>
  <button class="ib" data-ink="er-part" title="ممحاة جزء (E)"><svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></button>
  <button class="ib" data-ink="er-obj" title="مسح العنصر كله"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m8.5 8.5 7 7M15.5 8.5l-7 7"/></svg></button>
  <i class="sep"></i>
  <div class="inkOpts" id="inkOpts"></div>
</div>

<!-- image popover -->
<div class="panel pop" id="imgPop" hidden>
  <button class="pill" data-img="file"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg><span>إضافة صورة</span></button>
  <button class="pill" data-img="shot"><svg viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg><span>لقطة شاشة كاملة</span></button>
  <button class="pill" data-img="snip"><svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M18 22V8a2 2 0 0 0-2-2H2"/></svg><span>قص جزء من الشاشة</span></button>
</div>

<!-- context / properties bar -->
<div class="panel" id="propBar" hidden></div>

<!-- bottom right: zoom -->
<div class="panel" id="zoomBar">
  <button class="ib" id="btnZoomOut" title="تصغير"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button class="pill ghost" id="zoomPct" title="رجوع 100%">100%</button>
  <button class="ib" id="btnZoomIn" title="تكبير"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  <button class="ib" id="btnFit" title="اعرض كل المحتوى (Shift+1)"><svg viewBox="0 0 24 24"><path d="M3 9V5a2 2 0 0 1 2-2h4M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></button>
</div>

<!-- boards list -->
<div class="panel sheet" id="boardsPanel" hidden></div>
<!-- share -->
<div class="panel sheet right" id="sharePanel" hidden></div>

<!-- login -->
<div id="login" hidden>
  <form class="panel card" id="loginForm">
    <b>تسجيل الدخول</b>
    <small>ادخل بنفس حسابك على التطبيق</small>
    <input id="lgEmail" type="email" dir="ltr" placeholder="Email" autocomplete="username" required>
    <input id="lgPass" type="password" dir="ltr" placeholder="Password" autocomplete="current-password" required>
    <div id="lgErr" class="err"></div>
    <button class="pill dark" type="submit">دخول</button>
  </form>
</div>
<!-- gone / error overlay -->
<div id="gone" hidden><div class="panel card"><b id="goneTxt"></b></div></div>

<div id="toast" hidden></div>
<input type="file" id="fileIn" accept="image/*" multiple hidden>

<script src="board.js"></script>
<script src="boardadmin.js"></script>
</body>
</html>
