<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thabit</title>
<style>
:root{--bg:#0f172a;--fg:#e2e8f0;--card:#1e293b}
@media (prefers-color-scheme:light){:root{--bg:#f4f6f9;--fg:#0f172a;--card:#fff}}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:600 16px/1.7 Cairo,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
.c{background:var(--card);border-radius:22px;padding:28px 22px;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2)}
h1{font-size:1.2rem;margin:0 0 6px}p{margin:4px 0;opacity:.8;font-size:.9rem}
button{margin-top:18px;border:0;border-radius:12px;padding:11px 22px;background:#fbbf24;color:#111;font:700 .95rem Cairo,system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="c">
  <h1>مفيش إنترنت دلوقتي</h1>
  <p>No internet connection</p>
  <p>أول ما النت يرجع ادخل تاني.</p>
  <button type="button" onclick="location.reload()">حاول تاني · Retry</button>
</div>
<script>addEventListener('online',function(){location.reload()})</script>
</body>
</html>
