<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thabit - Guest</title>
<link rel="icon" type="image/svg+xml" href="assets/thabit-favicon.svg">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050506;--fg:#f1f5f9;--gold:#fbbf24;--glass:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);--gear:#fbbf24;--gear2:#94a3b8}
  html.light{--bg:#f4f6f9;--fg:#0f172a;--gold:#b45309;--glass:rgba(255,255,255,.55);--line:rgba(15,23,42,.1);--gear:#d97706;--gear2:#64748b}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font-family:Cairo,Inter,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px env(safe-area-inset-bottom,0px);
    opacity:0;transition:opacity .6s ease}
  body.in{opacity:1}
  .card{width:min(100%,380px);text-align:center;padding:34px 24px 28px;border-radius:22px;background:var(--glass);border:1px solid var(--line);
    -webkit-backdrop-filter:blur(24px) saturate(1.3);backdrop-filter:blur(24px) saturate(1.3);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.11),0 10px 30px rgba(0,0,0,.35)}
  svg{width:190px;height:150px;display:block;margin:0 auto 6px;overflow:visible}
  .g1,.g2{transform-box:fill-box;transform-origin:center}
  .g1{animation:cw 16s linear infinite}
  .g2{animation:ccw 10.667s linear infinite}
  @keyframes cw{to{rotate:360deg}} @keyframes ccw{to{rotate:-360deg}}
  h1{margin:8px 0 8px;font-size:1.2rem;font-weight:800}
  p{margin:0 0 22px;font-size:.9rem;line-height:1.7;opacity:.65}
  .back{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 26px;border-radius:14px;cursor:pointer;color:var(--gold);text-decoration:none;
    border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);background:color-mix(in srgb,var(--gold) 8%,transparent);font-weight:800;font-size:.9rem;
    transition:scale .85s cubic-bezier(.22,1,.36,1);-webkit-tap-highlight-color:transparent}
  @media(hover:hover){.back:hover{scale:1.03}}
  .back:active{scale:.94;transition:scale .2s ease-out}
  @media(prefers-reduced-motion:reduce){.g1,.g2{animation:none}}
</style>
</head>
<body>
<div class="card">
  <svg viewBox="-70 -70 230 140" aria-hidden="true"><g class="g1"><path id="p1" fill="var(--gear)" fill-rule="evenodd"/></g><g class="g2"><path id="p2" fill="var(--gear2)" fill-rule="evenodd"/></g></svg>
  <h1 id="t"></h1>
  <p id="m"></p>
  <a class="back" id="b" href="index.html"></a>
</div>
<script>
(function(){
  /* gear outline: n teeth, outer / root radius, teeth centred on phase degrees, plus a centre hole */
  function gear(cx,cy,ro,ri,n,phase,hole){
    var pts=[],step=360/n,i,a,k,rad=Math.PI/180;
    for(i=0;i<n;i++){
      var c=phase+i*step;
      [[-.34,ri],[-.2,ro],[.2,ro],[.34,ri]].forEach(function(o){a=(c+o[0]*step)*rad;pts.push([cx+o[1]*Math.cos(a),cy+o[1]*Math.sin(a)]);});
    }
    var d='M'+pts.map(function(p){return p[0].toFixed(2)+' '+p[1].toFixed(2)}).join('L')+'Z';
    d+='M'+(cx+hole)+' '+cy+'A'+hole+' '+hole+' 0 1 0 '+(cx-hole)+' '+cy+'A'+hole+' '+hole+' 0 1 0 '+(cx+hole)+' '+cy+'Z';
    return d;
  }
  /* meshing pair: 12 teeth and 8 teeth, pitch radii 52 and 34.67 */
  document.getElementById('p1').setAttribute('d',gear(0,0,60,46,12,0,14));
  document.getElementById('p2').setAttribute('d',gear(86.67,0,42,29,8,202.5,10));
  var g2=document.querySelector('.g2'); g2.style.transformOrigin='86.67px 0px'; g2.style.transformBox='view-box';
  document.querySelector('.g1').style.transformOrigin='0px 0px'; document.querySelector('.g1').style.transformBox='view-box';

  var T={en:{t:'Guest area',m:'This page is not ready yet. We are working on it.',b:'Back to portal'},
         ar:{t:'منطقة الضيوف',m:'هذه الصفحة غير جاهزة بعد، نعمل عليها الآن.',b:'العودة إلى البوابة'},
         eg:{t:'منطقة الضيوف',m:'الصفحة دي لسه مش جاهزة، شغالين عليها.',b:'ارجع للبوابة'}};
  var l='en',th=null;
  try{l=localStorage.getItem('thabit_lang')||'en';th=localStorage.getItem('thabit_theme');}catch(e){}
  if(!T[l])l='en';
  if(th==='light')document.documentElement.classList.add('light');
  document.documentElement.lang=l==='ar'?'ar':(l==='eg'?'arz':'en');
  document.documentElement.dir=l==='en'?'ltr':'rtl';
  document.getElementById('t').textContent=T[l].t;
  document.getElementById('m').textContent=T[l].m;
  document.getElementById('b').textContent=T[l].b;
  requestAnimationFrame(function(){document.body.classList.add('in');});
})();
</script>
</body>
</html>
