<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thabit</title>
<link rel="icon" type="image/svg+xml" href="assets/thabit-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#ece8df;--ink2:rgba(236,232,223,.72);--gbg:rgba(255,255,255,.08);--gbd:rgba(255,255,255,.14);--gfield:rgba(255,255,255,.1);--btn:#ece8df;--onbtn:#15130f;--ease:cubic-bezier(.22,1,.36,1)}
body.light{--ink:#1c1a16;--ink2:rgba(28,26,22,.7);--gbg:rgba(255,255,255,.42);--gbd:rgba(28,26,22,.1);--gfield:rgba(255,255,255,.55);--btn:#1c1a16;--onbtn:#f4f1ea}
*{box-sizing:border-box;margin:0}
html{font-size:90%}
html,body{min-height:100%;background:#121419}
body{font-family:Inter,Cairo,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.ar{font-family:Cairo,Inter,system-ui,sans-serif}
@keyframes fadeIn{to{opacity:1}}
body.th-fade,body.th-fade *,body.th-fade *::before,body.th-fade *::after{transition:background-color 1.4s ease,color 1.4s ease,border-color 1.4s ease,box-shadow 1.4s ease,fill 1.4s ease,stroke 1.4s ease,opacity 1.4s ease!important}
.cb{position:relative;height:36px;min-width:36px;padding:0 14px;border-radius:20px;border:1px solid var(--gbd);background:var(--gbg);color:var(--ink);cursor:pointer;font:700 .8rem Inter,Cairo,sans-serif;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-tap-highlight-color:transparent;transition:scale .6s var(--ease)}
.cb:hover{scale:1.05}.cb:active{scale:.94}
.cb.ic{width:36px;padding:0}
.cb svg{position:absolute;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:opacity 1.2s ease,rotate 1.2s var(--ease)}
.cb .sun{opacity:0;rotate:-70deg}.cb .moon{opacity:1;rotate:0deg}
body.light .cb .sun{opacity:1;rotate:0deg}body.light .cb .moon{opacity:0;rotate:70deg}
.btn{width:100%;height:42px;border:0;border-radius:14px;background:var(--btn);color:var(--onbtn);font:800 .92rem Inter,Cairo,sans-serif;cursor:pointer;transition:opacity .25s,scale .9s var(--ease)}
@media(hover:hover){.btn:hover{opacity:.93;scale:1.02}}
.btn:active{scale:.975;transition:scale .45s ease-out}
.btn.ghost{background:var(--gfield);color:var(--ink);border:1px solid var(--gbd)}
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ov.on{display:flex;animation:fadeIn .35s ease forwards;opacity:0}
.pop{position:relative;width:min(100%,380px);padding:28px 24px 22px;border-radius:24px;border:1px solid var(--gbd);color:var(--ink);text-align:center;-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);animation:pop .5s cubic-bezier(.16,1,.3,1)}
body.light .pop{background:rgba(250,248,243,.88)}body:not(.light) .pop{background:rgba(18,22,34,.78)}
@keyframes pop{from{opacity:0;scale:.94;translate:0 14px}to{opacity:1;scale:1;translate:0 0}}
.pop h3{font:700 1.2rem/1.35 Inter,Cairo,sans-serif;margin:6px 0}
.pop p{font:500 .88rem/1.6 Inter,Cairo,sans-serif;color:var(--ink2);margin-bottom:18px}
</style>
<style id="thApp">
:root{--hh:60px}
html:has(body.app){background:#2a2d38}
html:has(body.app.light){background:#cfd2da}
body.app{min-height:100vh;--appbg:linear-gradient(160deg,#4d5262 0%,#383c49 45%,#2a2d38 100%);background:var(--appbg);--sb:rgba(255,255,255,.1);--sbd:rgba(255,255,255,.13);--chip:rgba(255,255,255,.14);--pcard:rgba(255,255,255,.12);--pn:rgba(30,33,44,.58)}
body.app.light{--appbg:linear-gradient(160deg,#eef0f4 0%,#dfe1e7 60%,#d0d3db 100%);--sb:rgba(255,255,255,.6);--sbd:rgba(28,26,22,.1);--chip:rgba(28,26,22,.08);--pcard:rgba(255,255,255,.65);--pn:rgba(250,248,243,.62)}
#app{opacity:0;animation:fadeIn .7s ease forwards}
body.lay,body.intro{overflow:hidden}

/* ---------- INTRO: T is placed whole, then H is drawn ---------- */
#intro{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;color:var(--ink);
  background:linear-gradient(160deg,#4d5262 0%,#383c49 45%,#2a2d38 100%);
  transition:opacity .9s ease,filter .9s ease,visibility 0s .9s}
body.light #intro{background:linear-gradient(160deg,#eef0f4 0%,#dfe1e7 60%,#d0d3db 100%)}
#intro.out{opacity:0;filter:blur(10px);visibility:hidden;pointer-events:none}
.ilight{position:absolute;left:50%;top:50%;width:min(90vw,560px);aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.22),rgba(255,255,255,0));opacity:0;animation:ilight 1.5s ease 2.35s 1 forwards}
body.light .ilight{background:radial-gradient(closest-side,rgba(255,255,255,.9),rgba(255,255,255,0))}
@keyframes ilight{0%{opacity:0;scale:.7}45%{opacity:1;scale:1}100%{opacity:.35;scale:1.1}}
.ilogo{position:relative;width:clamp(130px,34vw,200px);height:auto;overflow:visible;fill:currentColor;animation:iglow 1.5s ease 2.35s 1}
.ilogo .T{opacity:0;animation:fadeIn .45s ease .15s forwards}
.ilogo .mk{fill:none;stroke:#fff;stroke-width:56;stroke-dasharray:1;stroke-dashoffset:1}
.ilogo .m1{animation:idraw .6s cubic-bezier(.5,0,.3,1) .75s forwards}
.ilogo .m2{animation:idraw .42s cubic-bezier(.5,0,.3,1) 1.35s forwards}
.ilogo .m3{animation:idraw .6s cubic-bezier(.5,0,.3,1) 1.77s forwards}
@keyframes idraw{to{stroke-dashoffset:0}}
@keyframes iglow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}45%{filter:drop-shadow(0 0 12px rgba(255,255,255,.7)) drop-shadow(0 0 34px rgba(255,255,255,.32))}}
@media(prefers-reduced-motion:reduce){.ilogo .T,.ilogo .mk,.ilight,.ilogo{animation-duration:.01s!important;animation-delay:0s!important}}

/* ---------- header: logo (left) ... lang, theme, profile (right). The glass bar fades in only when content slides under it ---------- */
#hdr{position:fixed;top:0;left:0;right:0;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;z-index:25;display:flex;align-items:center;justify-content:space-between;direction:ltr}
#hbar{position:absolute;inset:0;z-index:-1;opacity:0;pointer-events:none;background:var(--sb);border-bottom:1px solid var(--sbd);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5)}
.sdlogo{display:block;width:34px;height:34px;background:var(--ink);-webkit-mask:url(assets/thabit-favicon.svg) center/contain no-repeat;mask:url(assets/thabit-favicon.svg) center/contain no-repeat}
#hctl{display:flex;gap:8px;align-items:center}
#hdr .cb,#sbtn,.bk{opacity:1}
#sbtn{position:fixed;z-index:29;left:14px;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 8px)}
#sbtn .g3,#sbtn .gx{transition:opacity .3s ease}
#sbtn .gx{opacity:0}
body.sbo #sbtn .g3{opacity:0}body.sbo #sbtn .gx{opacity:1}

/* ---------- sidebar: glass panel on the left ---------- */
#sbs{position:fixed;inset:0;z-index:27;display:none;background:rgba(0,0,0,.18)}
body.sbo #sbs{display:block;animation:fadeIn .35s ease both}
#side{position:fixed;z-index:28;left:12px;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 54px);width:clamp(244px,56vw,330px);max-height:calc(100dvh - var(--hh) - 76px - env(safe-area-inset-top,0px));overflow-y:auto;scrollbar-width:none;padding:16px 10px 12px;border-radius:26px;color:var(--ink);
  background:var(--pn);border:1px solid var(--sbd);-webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);box-shadow:0 18px 50px rgba(0,0,0,.28);
  transform-origin:top left;opacity:0;visibility:hidden;translate:-26px 0;scale:.96;transition:opacity .35s ease,translate .5s var(--ease),scale .5s var(--ease),visibility 0s .5s}
#side::-webkit-scrollbar{display:none}
body.sbo #side{opacity:1;visibility:visible;translate:0 0;scale:1;transition-delay:0s}
.sdh{font:800 1.02rem Cairo,Inter,sans-serif;color:var(--ink);margin:2px 14px 8px;letter-spacing:.01em}
.sdl{height:1px;margin:8px 16px;background:var(--sbd)}
.sdi{display:flex;align-items:center;gap:14px;width:100%;height:46px;padding:0 14px;margin:0;border:0;border-radius:14px;background:transparent;color:var(--ink);font:600 .95rem Cairo,Inter,sans-serif;text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .3s,scale .8s var(--ease)}
.sdi svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.sdi span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(hover:hover){.sdi:hover{background:var(--chip)}}
.sdi:active{scale:.975;transition:scale .3s ease-out}
.sdi.on{background:var(--chip)}

/* ---------- main page ---------- */
#pg{padding:calc(var(--hh) + 66px + env(safe-area-inset-top,0px)) 16px 48px}
#ptitle{font:800 1.35rem Cairo,Inter,sans-serif;text-align:center;color:var(--ink);margin-bottom:26px}
.pcard{max-width:1250px;margin:0 auto;min-height:180px;display:flex;align-items:center;justify-content:center;padding:24px;border-radius:28px;background:var(--pcard);border:1px solid var(--sbd);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);font:500 1rem Cairo,Inter,sans-serif;color:var(--ink2);text-align:center}
#pg .pcard{min-height:125vh;align-items:flex-start;padding-top:48px}
@media(min-width:861px){#pg{padding-left:32px;padding-right:32px}#side{left:20px}#sbtn{left:20px}#hdr{padding-left:20px;padding-right:20px}}

/* ---------- a chosen option opens as a full layer; Back returns to the main page ---------- */
#layer{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:var(--ink);background:var(--appbg);opacity:0;visibility:hidden;translate:0 22px;transition:opacity .4s ease,translate .5s var(--ease),visibility 0s .5s}
body.lay #layer{opacity:1;visibility:visible;translate:0 0;transition-delay:0s}
.ltop{flex:none;display:flex;align-items:center;gap:12px;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;border-bottom:1px solid var(--sbd);background:var(--sb);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}
.bk svg{transition:none}
[dir=rtl] .bk svg{scale:-1 1}
#ltitle{font:800 1.15rem Cairo,Inter,sans-serif}
#lbody{flex:1;overflow:auto;padding:22px 16px 40px}
@media(min-width:861px){.ltop{padding-left:20px;padding-right:20px}#lbody{padding:30px 32px 48px}}

/* ---------- profile pop-up ---------- */
#pov{z-index:80}
.pav{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--chip);border:1px solid var(--gbd)}
.pav svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 2px;border-bottom:1px solid var(--gbd);font:600 .88rem Cairo,Inter,sans-serif;text-align:start}
.prow b{font-weight:700;color:var(--ink2);flex:none}
.prow span{direction:ltr;unicode-bidi:plaintext;text-align:end;overflow-wrap:anywhere}
#gov{z-index:90}#gov .btn+.btn{margin-top:10px}
</style>
</head>
<body class="app">
<script>try{if(localStorage.getItem('thThemeChoice')==='light')document.body.classList.add('light')}catch(e){}</script>
<div id="app">
  <header id="hdr"><div id="hbar"></div>
    <span class="sdlogo" role="img" aria-label="Thabit"></span>
    <div id="hctl">
      <button class="cb js-lg" type="button" aria-label="Language"></button>
      <button class="cb ic js-tg" type="button" aria-label="Theme">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
      </button>
      <button class="cb ic" id="prof" type="button" aria-label="Profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.2 7-5.2s6.2 1.6 7 5.2"/></svg></button>
    </div>
  </header>
  <button class="cb ic" id="sbtn" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><g class="g3"><path d="M4 7h16M4 12h16M4 17h16"/></g><g class="gx"><path d="M6 6l12 12M18 6L6 18"/></g></svg></button>
  <div id="sbs"></div>
  <aside id="side" aria-label="Menu"></aside>
  <section id="pg"><h1 id="ptitle" data-t="services"></h1><div class="pcard" data-t="soonc"></div></section>
  <section id="layer" aria-hidden="true">
    <div class="ltop"><button class="cb ic bk" id="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="ltitle"></h2></div>
    <div id="lbody"><div class="pcard" data-t="soonc"></div></div>
  </section>
</div>

<div class="ov" id="pov"><div class="pop" id="ppop" role="dialog" aria-modal="true">
  <div class="pav"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.2 7-5.2s6.2 1.6 7 5.2"/></svg></div>
  <div class="prow"><b data-t="pName"></b><span id="pn"></span></div>
  <div class="prow"><b data-t="pPhone"></b><span id="pph"></span></div>
  <div class="prow" style="border-bottom:0"><b data-t="pEmail"></b><span id="pem"></span></div>
</div></div>

<div class="ov" id="gov" role="dialog" aria-modal="true"><div class="pop">
  <h3 data-t="gT"></h3><p data-t="gP"></p>
  <button class="btn" id="gStay" type="button" data-t="gStay"></button>
  <button class="btn ghost" id="gLeave" type="button" data-t="gLeave"></button>
</div></div>

<div id="intro" aria-hidden="true"><div class="ilight"></div>
<svg class="ilogo" viewBox="0 0 410 140" aria-hidden="true">
  <defs>
    <mask id="mH" maskUnits="userSpaceOnUse" x="-20" y="-20" width="260" height="190">
      <path class="mk m1" pathLength="1" d="M92.8 -4.5 L12.2 141.5"/>
      <path class="mk m2" pathLength="1" d="M20 71 L160 71" style="stroke-width:40"/>
      <path class="mk m3" pathLength="1" d="M174.8 -4.5 L94.2 141.5"/>
    </mask>
  </defs>
  <path class="T" d="M35 11 L191 6 L193 37 L120 41 L70 120 Q64 129 50 129 L4 131 Q30 125 40 110 L90 43 L15 44 Z"/>
  <g transform="translate(218 0)"><g mask="url(#mH)">
    <polygon points="70,6 104,6 35,131 1,131"/>
    <polygon points="152,6 186,6 117,131 83,131"/>
    <rect x="50" y="58" width="85" height="26"/>
  </g></g>
</svg></div>

<script>
(function(){'use strict';
const $=id=>document.getElementById(id),body=document.body,root=document.documentElement,AR_TZ=/^(Africa\/(Cairo|Tripoli|Tunis|Algiers|Casablanca|El_Aaiun|Khartoum|Djibouti|Nouakchott|Mogadishu)|Asia\/(Riyadh|Dubai|Baghdad|Amman|Beirut|Damascus|Kuwait|Qatar|Bahrain|Muscat|Aden|Gaza|Hebron)|Indian\/Comoro)$/,KEY='thabitGuest',LANDING='landing.html';
const STR={en:{name:'English',brand:'Thabit',
  services:'Services',grp:'Language Services',i_train:'Language Training',i_translate:'Translation',i_dict:'Dictation Pal',i_mirror:'Mirroring Room',i_space:'Space',i_voice:'Voice Over',i_digital:'Digital Solutions',i_consult:'Personal Consultation',i_store:'Our Store',
  soonc:'Page information will be shown here.',pName:'Name',pPhone:'Phone',pEmail:'Email',
  gT:'Leave guest mode?',gP:'You are browsing as a guest. Your session and any changes you make will not be saved when you leave, but we will still remember you if you come back.',gStay:'Stay as guest',gLeave:'Leave guest mode'},
ar:{name:'العربية',brand:'ثابت',
  services:'الخدمات',grp:'خدمات اللغة',i_train:'التدريب اللغوي',i_translate:'الترجمة',i_dict:'رفيق الإملاء',i_mirror:'غرفة المرآة',i_space:'المساحة',i_voice:'التعليق الصوتي',i_digital:'الحلول الرقمية',i_consult:'الاستشارة الشخصية',i_store:'متجرنا',
  soonc:'ستُعرض معلومات الصفحة هنا.',pName:'الاسم',pPhone:'الهاتف',pEmail:'البريد الإلكتروني',
  gT:'هل أنت متأكد أنك تريد الخروج من وضع الضيف؟',gP:'أنت تتصفح كضيف. ستنتهي جلستك ولن تُحفظ أي تعديلات عند الخروج، لكننا سنظل نتذكرك إن عدت.',gStay:'البقاء كضيف',gLeave:'الخروج من وضع الضيف'}};
function detect(){try{const v=localStorage.getItem('thLandLang');if(v==='ar'||v==='en')return v}catch(e){}let tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}return(AR_TZ.test(tz)||(navigator.language||'').toLowerCase().indexOf('ar')===0)?'ar':'en'}
let L=detect(),cur=null;

/* ---------- sidebar ---------- */
const IC={train:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v5"/>',
translate:'<circle cx="10" cy="14" r="8"/><ellipse cx="10" cy="14" rx="3.3" ry="8"/><path d="M2 14h16M3.2 9.5h13.6M3.2 18.5h13.6"/><path d="M19 2.5a3 3 0 0 1 3 3c0 2.2-3 5-3 5s-3-2.8-3-5a3 3 0 0 1 3-3z"/><circle cx="19" cy="5.5" r=".9"/>',
dict:'<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10 6.5h4M10 10h4M10 13.5h4"/>',
mirror:'<rect x="5.5" y="2.5" width="13" height="16" rx="6.5"/><path d="M9.5 7c.8-.8 1.7-1.2 2.7-1.2M12 18.5V21M8.5 21.5h7"/>',
space:'<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><circle cx="12" cy="12" r="2.5"/>',
voice:'<rect x="9" y="2.5" width="6" height="10" rx="3"/><path d="M6 10.5a6 6 0 0 0 12 0M12 16.5V20M8.5 21h7"/>',
digital:'<path d="M7 11a4 4 0 0 1 .6-7.9A5 5 0 0 1 17 5a3.5 3.5 0 0 1 0 6z"/><rect x="3.5" y="15" width="4" height="5" rx="1"/><rect x="10" y="15" width="4" height="5" rx="1"/><rect x="16.5" y="15" width="4" height="5" rx="1"/>',
consult:'<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4 4v-4H5.5A1.5 1.5 0 0 1 4 14.5z"/>',
store:'<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8M10 20v-4.5h4V20"/>'};
const GR=[['train','translate','dict','mirror','space'],['voice'],['digital'],['consult'],['store']];
const btn=k=>'<button type="button" class="sdi" data-k="'+k+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+IC[k]+'</svg><span data-t="i_'+k+'"></span></button>';
$('side').innerHTML='<div class="sdh" data-t="grp"></div>'+GR.map(g=>g.map(btn).join('')).join('<div class="sdl"></div>');

function setSide(on){body.classList.toggle('sbo',on)}
$('sbtn').onclick=e=>{e.stopPropagation();setSide(!body.classList.contains('sbo'))};
$('sbs').onclick=()=>setSide(false);

/* ---------- language / theme ---------- */
function apply(){const t=STR[L];root.dir=L==='ar'?'rtl':'ltr';root.lang=L;body.classList.toggle('ar',L==='ar');
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll('.js-lg').forEach(b=>b.textContent=t.name);
  document.title=t.brand;
  $('side').dir=root.dir;$('pov').dir=root.dir;$('layer').dir=root.dir;
  $('ptitle').textContent=t.services;if(cur)$('ltitle').textContent=t['i_'+cur];
  hb()}
document.querySelectorAll('.js-lg').forEach(b=>b.onclick=()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('thLandLang',L)}catch(e){}apply()});
document.querySelectorAll('.js-tg').forEach(b=>b.onclick=()=>{body.classList.add('th-fade');setTimeout(()=>body.classList.remove('th-fade'),1600);body.classList.toggle('light');try{localStorage.setItem('thThemeChoice',body.classList.contains('light')?'light':'dark')}catch(e){}});

/* ---------- header glass: shows only once content slides under its bottom edge ---------- */
function hb(){const bar=$('hbar');
  const h=$('hdr').offsetHeight,t=$('ptitle').getBoundingClientRect().top;
  bar.style.opacity=Math.max(0,Math.min(1,(h-t)/28))}
window.addEventListener('scroll',hb,{passive:true});window.addEventListener('resize',hb);

/* ---------- layers: an option opens as a full page; Back returns to the main page ---------- */
function openLayer(k){cur=k;$('ltitle').textContent=STR[L]['i_'+k];$('lbody').scrollTop=0;
  document.querySelectorAll('.sdi').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  setSide(false);body.classList.add('lay');$('layer').setAttribute('aria-hidden','false');
  try{history.pushState({th:k},'')}catch(e){}}
function closeLayer(){cur=null;body.classList.remove('lay');$('layer').setAttribute('aria-hidden','true');
  document.querySelectorAll('.sdi.on').forEach(b=>b.classList.remove('on'))}
$('side').addEventListener('click',e=>{const b=e.target.closest('.sdi');if(b)openLayer(b.dataset.k)});
$('back').onclick=()=>{if(history.state&&history.state.th)history.back();else closeLayer()};

/* ---------- profile pop-up ---------- */
function setPop(on){$('pov').classList.toggle('on',on)}
$('prof').onclick=e=>{e.stopPropagation();setSide(false);setPop(true)};
$('pov').addEventListener('click',e=>{if(e.target===$('pov'))setPop(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){setPop(false);setSide(false)}});

/* ---------- the guest: his details come from the landing page (sessionStorage) ---------- */
function load(){try{const g=JSON.parse(sessionStorage.getItem(KEY)||'null');return g&&g.firstName?g:null}catch(e){return null}}
function fill(g){$('pn').textContent=((g.firstName||'')+' '+(g.lastName||'')).trim();$('pph').textContent=g.phone||'';$('pem').textContent=g.email||''}

/* ---------- Back on the main page asks before leaving guest mode ---------- */
function leave(){try{sessionStorage.removeItem(KEY)}catch(e){}location.replace(LANDING)}
$('gStay').onclick=()=>$('gov').classList.remove('on');
$('gLeave').onclick=leave;
try{history.replaceState({th:'guard'},'');history.pushState({th:'main'},'')}catch(e){}
window.addEventListener('popstate',e=>{const s=e.state&&e.state.th;
  if(s==='guard'){closeLayer();try{history.pushState({th:'main'},'')}catch(x){}$('gov').classList.add('on')}
  else if(body.classList.contains('lay'))closeLayer()});

/* ---------- start: intro (T placed whole, H drawn), then the app with the sidebar open ---------- */
const g0=load();
if(!g0){location.replace(LANDING);return}
fill(g0);apply();
body.classList.add('intro');
const intro=$('intro'),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
setTimeout(()=>{intro.classList.add('out');body.classList.remove('intro');
  setTimeout(()=>setSide(true),350);
  setTimeout(()=>intro.remove(),1000)},reduce?300:3900);
})();
</script>
</body>
</html>
