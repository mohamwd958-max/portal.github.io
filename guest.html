<!DOCTYPE html>

<body>
<div id="thApp"></div>
<script>
const THAPP_CSS="\n#W{--hh:60px;--ink:#ece8df;--ink2:rgba(236,232,223,.72);--gbg:rgba(255,255,255,.08);--gbd:rgba(255,255,255,.14);--gfield:rgba(255,255,255,.1);--btn:#ece8df;--onbtn:#15130f;--ease:cubic-bezier(.22,1,.36,1)}\n#W.light{--ink:#1c1a16;--ink2:rgba(28,26,22,.7);--gbg:rgba(255,255,255,.42);--gbd:rgba(28,26,22,.1);--gfield:rgba(255,255,255,.55);--btn:#1c1a16;--onbtn:#f4f1ea}\n#W,#W *{box-sizing:border-box;margin:0}\n#W{min-height:100vh;font-family:Inter,Cairo,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:clip}\n#W.ar{font-family:Cairo,Inter,system-ui,sans-serif}\n@keyframes fadeIn{to{opacity:1}}\n#W.th-fade,#W.th-fade *,#W.th-fade *::before,#W.th-fade *::after{transition:background-color 1.4s ease,color 1.4s ease,border-color 1.4s ease,box-shadow 1.4s ease,fill 1.4s ease,stroke 1.4s ease,opacity 1.4s ease!important}\n.cb{position:relative;height:36px;min-width:36px;padding:0 14px;border-radius:20px;border:1px solid var(--gbd);background:var(--gbg);color:var(--ink);cursor:pointer;font:700 11.52px Inter,Cairo,sans-serif;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);-webkit-tap-highlight-color:transparent;transition:scale .6s var(--ease)}\n.cb:hover{scale:1.05}.cb:active{scale:.94}\n.cb.ic{width:36px;padding:0}\n.cb svg{position:absolute;width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:opacity 1.2s ease,rotate 1.2s var(--ease)}\n.cb .sun{opacity:0;rotate:-70deg}.cb .moon{opacity:1;rotate:0deg}\n#W.light .cb .sun{opacity:1;rotate:0deg}#W.light .cb .moon{opacity:0;rotate:70deg}\n.btn{width:100%;height:42px;border:0;border-radius:14px;background:var(--btn);color:var(--onbtn);font:800 13.25px Inter,Cairo,sans-serif;cursor:pointer;transition:opacity .25s,scale .9s var(--ease)}\n@media(hover:hover){.btn:hover{opacity:.93;scale:1.02}}\n.btn:active{scale:.975;transition:scale .45s ease-out}\n.btn.ghost{background:var(--gfield);color:var(--ink);border:1px solid var(--gbd)}\n.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}\n.ov.on{display:flex;animation:fadeIn .35s ease forwards;opacity:0}\n.pop{position:relative;width:min(100%,380px);padding:28px 24px 22px;border-radius:24px;border:1px solid var(--gbd);color:var(--ink);text-align:center;-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);animation:pop .5s cubic-bezier(.16,1,.3,1)}\n#W.light .pop{background:rgba(250,248,243,.88)}#W:not(.light) .pop{background:rgba(18,22,34,.78)}\n@keyframes pop{from{opacity:0;scale:.94;translate:0 14px}to{opacity:1;scale:1;translate:0 0}}\n.pop h3{font:700 17.28px/1.35 Inter,Cairo,sans-serif;margin:6px 0}\n.pop p{font:500 12.67px/1.6 Inter,Cairo,sans-serif;color:var(--ink2);margin-bottom:18px}\n\n\n\n#W{min-height:100vh;--appbg:linear-gradient(160deg,#4d5262 0%,#383c49 45%,#2a2d38 100%);background:var(--appbg);--sb:rgba(255,255,255,.1);--sbd:rgba(255,255,255,.13);--chip:rgba(255,255,255,.14);--pcard:rgba(255,255,255,.12);--pn:rgba(30,33,44,.58)}\n#W.light{--appbg:linear-gradient(160deg,#eef0f4 0%,#dfe1e7 60%,#d0d3db 100%);--sb:rgba(255,255,255,.6);--sbd:rgba(28,26,22,.1);--chip:rgba(28,26,22,.08);--pcard:rgba(255,255,255,.65);--pn:rgba(250,248,243,.62)}\n\n/* ---------- header: logo (left) ... lang, theme, profile (right). The glass bar fades in only when content slides under it ---------- */\n#hdr{position:fixed;top:0;left:0;right:0;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;z-index:25;display:flex;align-items:center;justify-content:space-between;direction:ltr}\n#hbar{position:absolute;inset:0;z-index:-1;opacity:0;pointer-events:none;background:var(--sb);border-bottom:1px solid var(--sbd);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5)}\n.sdlogo{display:block;width:34px;height:30px;background:var(--ink);-webkit-mask:var(--thlogo) center/contain no-repeat;mask:var(--thlogo) center/contain no-repeat}\n#hctl{display:flex;gap:8px;align-items:center}\n#hdr .cb,#sbtn,.bk{opacity:1}\n#sbtn{position:fixed;z-index:29;left:14px;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 8px)}\n#sbtn .g3,#sbtn .gx{transition:opacity .3s ease}\n#sbtn .gx{opacity:0}\n#W.sbo #sbtn .g3{opacity:0}#W.sbo #sbtn .gx{opacity:1}\n\n/* ---------- sidebar: glass panel on the left ---------- */\n#sbs{position:fixed;inset:0;z-index:27;display:none;background:rgba(0,0,0,.18)}\n#W.sbo #sbs{display:block;animation:fadeIn .35s ease both}\n#side{position:fixed;z-index:28;left:12px;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 54px);width:clamp(244px,56vw,330px);max-height:calc(100dvh - var(--hh) - 76px - env(safe-area-inset-top,0px));overflow-y:auto;scrollbar-width:none;padding:16px 10px 12px;border-radius:26px;color:var(--ink);\n  background:var(--pn);border:1px solid var(--sbd);-webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);box-shadow:0 18px 50px rgba(0,0,0,.28);\n  transform-origin:top left;opacity:0;visibility:hidden;translate:-26px 0;scale:.96;transition:opacity .35s ease,translate .5s var(--ease),scale .5s var(--ease),visibility 0s .5s}\n#side::-webkit-scrollbar{display:none}\n#W.sbo #side{opacity:1;visibility:visible;translate:0 0;scale:1;transition-delay:0s}\n.sdh{font:800 14.69px Cairo,Inter,sans-serif;color:var(--ink);margin:2px 14px 8px;letter-spacing:.01em}\n.sdl{height:1px;margin:8px 16px;background:var(--sbd)}\n.sdi{display:flex;align-items:center;gap:14px;width:100%;height:46px;padding:0 14px;margin:0;border:0;border-radius:14px;background:transparent;color:var(--ink);font:600 13.68px Cairo,Inter,sans-serif;text-align:start;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .3s,scale .8s var(--ease)}\n.sdi svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.85}\n.sdi span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n@media(hover:hover){.sdi:hover{background:var(--chip)}}\n.sdi:active{scale:.975;transition:scale .3s ease-out}\n.sdi.on{background:var(--chip)}\n\n/* ---------- main page ---------- */\n#pg{padding:calc(var(--hh) + 66px + env(safe-area-inset-top,0px)) 16px 48px}\n#ptitle{font:800 19.44px Cairo,Inter,sans-serif;text-align:center;color:var(--ink);margin-bottom:26px}\n.pcard{max-width:1250px;margin:0 auto;min-height:180px;display:flex;align-items:center;justify-content:center;padding:24px;border-radius:28px;background:var(--pcard);border:1px solid var(--sbd);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);font:500 14.4px Cairo,Inter,sans-serif;color:var(--ink2);text-align:center}\n#pg .pcard{min-height:125vh;align-items:flex-start;padding-top:48px}\n\n/* ---------- a chosen option opens as a full layer; Back returns to the main page ---------- */\n#layer{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;color:var(--ink);background:var(--appbg);opacity:0;visibility:hidden;translate:0 22px;transition:opacity .4s ease,translate .5s var(--ease),visibility 0s .5s}\n#W.lay #layer{opacity:1;visibility:visible;translate:0 0;transition-delay:0s}\n.ltop{flex:none;display:flex;align-items:center;gap:12px;height:calc(var(--hh) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;border-bottom:1px solid var(--sbd);background:var(--sb);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px)}\n.bk svg{transition:none}\n[dir=rtl] .bk svg{scale:-1 1}\n#ltitle{font:800 16.56px Cairo,Inter,sans-serif}\n#lbody{flex:1;overflow:auto;padding:22px 16px 40px}\n\n/* ---------- profile pop-up ---------- */\n#pov{z-index:80}\n.pav{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--chip);border:1px solid var(--gbd)}\n.pav svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}\n.prow{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 2px;border-bottom:1px solid var(--gbd);font:600 12.67px Cairo,Inter,sans-serif;text-align:start}\n.prow b{font-weight:700;color:var(--ink2);flex:none}\n.prow span{direction:ltr;unicode-bidi:plaintext;text-align:end;overflow-wrap:anywhere}\n#gov{z-index:90}#gov .btn+.btn{margin-top:10px}\n\n#W.hid{visibility:hidden}\n#W.shown{animation:appIn .7s ease both}\n@keyframes appIn{from{opacity:0}to{opacity:1}}\n#logo{cursor:pointer}\n.dframe{display:block;width:100%;height:100%;border:0;background:transparent}\n#lbody.full{padding:0;overflow:hidden}\n#lout{display:none}#W.canout #lout{display:block}\n/* ---- desktop: the sidebar stays open on the left, the chosen page is shown in the display area ---- */\n@media(min-width:861px){\n  #sbtn,#sbs{display:none!important}\n  #hdr{padding-left:20px;padding-right:20px}\n  #side{left:14px;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 6px);bottom:14px;width:290px;max-height:none;opacity:1;visibility:visible;translate:0 0;scale:1;transition:none}\n  #pg{padding:calc(var(--hh) + 34px + env(safe-area-inset-top,0px)) 32px 48px 336px}\n  #layer{left:322px;top:calc(var(--hh) + env(safe-area-inset-top,0px));background:transparent;translate:0 12px;z-index:20}\n  #W.lay #layer{translate:0 0}\n  #W.lay #pg{visibility:hidden}\n  .ltop{height:56px;padding:0 32px 0 14px;border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}\n  .bk{display:none}\n  #lbody{padding:6px 32px 40px 14px}\n  #lbody.full{padding:0 20px 20px 14px}\n  .dframe{border-radius:20px;background:var(--pcard)}\n}\n";
const THAPP_HTML="<div id=\"W\" class=\"hid\" dir=\"ltr\">\n<header id=\"hdr\"><div id=\"hbar\"></div>\n    <span class=\"sdlogo\" id=\"logo\" role=\"button\" tabindex=\"0\" aria-label=\"Thabit\"></span>\n    <div id=\"hctl\">\n      <button class=\"cb js-lg\" type=\"button\" aria-label=\"Language\"></button>\n      <button class=\"cb ic js-tg\" type=\"button\" aria-label=\"Theme\">\n        <svg class=\"moon\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z\"/></svg>\n        <svg class=\"sun\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6\"/></svg>\n      </button>\n      <button class=\"cb ic\" id=\"prof\" type=\"button\" aria-label=\"Profile\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"3.6\"/><path d=\"M5 20c.8-3.6 3.6-5.2 7-5.2s6.2 1.6 7 5.2\"/></svg></button>\n    </div>\n  </header>\n  <button class=\"cb ic\" id=\"sbtn\" type=\"button\" aria-label=\"Menu\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><g class=\"g3\"><path d=\"M4 7h16M4 12h16M4 17h16\"/></g><g class=\"gx\"><path d=\"M6 6l12 12M18 6L6 18\"/></g></svg></button>\n  <div id=\"sbs\"></div>\n  <aside id=\"side\" aria-label=\"Menu\"></aside>\n  <section id=\"pg\"><h1 id=\"ptitle\" data-t=\"services\"></h1><div class=\"pcard\" data-t=\"soonc\"></div></section>\n  <section id=\"layer\" aria-hidden=\"true\">\n    <div class=\"ltop\"><button class=\"cb ic bk\" id=\"back\" type=\"button\" aria-label=\"Back\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M15 5l-7 7 7 7\"/></svg></button><h2 id=\"ltitle\"></h2></div>\n    <div id=\"lbody\"><div class=\"pcard\" data-t=\"soonc\"></div></div>\n  </section>\n\n<div class=\"ov\" id=\"pov\"><div class=\"pop\" id=\"ppop\" role=\"dialog\" aria-modal=\"true\">\n  <div class=\"pav\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"3.6\"/><path d=\"M5 20c.8-3.6 3.6-5.2 7-5.2s6.2 1.6 7 5.2\"/></svg></div>\n  <div class=\"prow\" id=\"rN\"><b data-t=\"pName\"></b><span id=\"pn\"></span></div>\n  <div class=\"prow\" id=\"rU\"><b data-t=\"pUser\"></b><span id=\"pus\"></span></div>\n  <div class=\"prow\" id=\"rP\"><b data-t=\"pPhone\"></b><span id=\"pph\"></span></div>\n  <div class=\"prow\" id=\"rE\" style=\"border-bottom:0\"><b data-t=\"pEmail\"></b><span id=\"pem\"></span></div>\n  <button class=\"btn ghost\" id=\"lout\" type=\"button\" data-t=\"logout\"></button>\n</div></div>\n\n<div class=\"ov\" id=\"gov\" role=\"dialog\" aria-modal=\"true\"><div class=\"pop\">\n  <h3 data-t=\"gT\"></h3><p data-t=\"gP\"></p>\n  <button class=\"btn\" id=\"gStay\" type=\"button\" data-t=\"gStay\"></button>\n  <button class=\"btn ghost\" id=\"gLeave\" type=\"button\" data-t=\"gLeave\"></button>\n</div></div>\n</div>";
/* ===== Thabit app shell (sidebar + header + pages). Lives in a shadow root so it never clashes with the page around it.
   cfg: host, lang, light, setLight(b), getUser(), guard(bool), leave(), logout(), dashRoute() ===== */
function THApp(cfg) {
  'use strict';
  const R = cfg.host.attachShadow({ mode: 'open' });
  R.innerHTML = '<style>' + THAPP_CSS + '</style>' + THAPP_HTML;
  const $ = id => R.getElementById(id), W = $('W'), isDk = () => window.matchMedia('(min-width:861px)').matches, KEY_L = 'thLandLang';
  const STR = {
    en: { name: 'English', services: 'Services', grp: 'Language Services', i_dash: 'Dashboard', i_train: 'Language Training', i_translate: 'Translation', i_dict: 'Dictation Pal', i_mirror: 'Mirroring Room', i_space: 'Space', i_voice: 'Voice Over', i_digital: 'Digital Solutions', i_consult: 'Personal Consultation', i_store: 'Our Store',
      soonc: 'Page information will be shown here.', pName: 'Name', pUser: 'Username', pPhone: 'Phone', pEmail: 'Email', logout: 'Log out',
      gT: 'Leave guest mode?', gP: 'You are browsing as a guest. Your session and any changes you make will not be saved when you leave, but we will still remember you if you come back.', gStay: 'Stay as guest', gLeave: 'Leave guest mode' },
    ar: { name: 'العربية', services: 'الخدمات', grp: 'خدمات اللغة', i_dash: 'لوحة التحكم', i_train: 'التدريب اللغوي', i_translate: 'الترجمة', i_dict: 'رفيق الإملاء', i_mirror: 'غرفة المرآة', i_space: 'المساحة', i_voice: 'التعليق الصوتي', i_digital: 'الحلول الرقمية', i_consult: 'الاستشارة الشخصية', i_store: 'متجرنا',
      soonc: 'ستُعرض معلومات الصفحة هنا.', pName: 'الاسم', pUser: 'اسم المستخدم', pPhone: 'الهاتف', pEmail: 'البريد الإلكتروني', logout: 'تسجيل الخروج',
      gT: 'هل أنت متأكد أنك تريد الخروج من وضع الضيف؟', gP: 'أنت تتصفح كضيف. ستنتهي جلستك ولن تُحفظ أي تعديلات عند الخروج، لكننا سنظل نتذكرك إن عدت.', gStay: 'البقاء كضيف', gLeave: 'الخروج من وضع الضيف' }
  };
  let L = cfg.lang === 'ar' ? 'ar' : 'en', cur = null;

  /* ---------- sidebar ---------- */
  const IC = {
    dash: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
    train: '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v5"/>',
    translate: '<circle cx="10" cy="14" r="8"/><ellipse cx="10" cy="14" rx="3.3" ry="8"/><path d="M2 14h16M3.2 9.5h13.6M3.2 18.5h13.6"/><path d="M19 2.5a3 3 0 0 1 3 3c0 2.2-3 5-3 5s-3-2.8-3-5a3 3 0 0 1 3-3z"/><circle cx="19" cy="5.5" r=".9"/>',
    dict: '<rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M10 6.5h4M10 10h4M10 13.5h4"/>',
    mirror: '<rect x="5.5" y="2.5" width="13" height="16" rx="6.5"/><path d="M9.5 7c.8-.8 1.7-1.2 2.7-1.2M12 18.5V21M8.5 21.5h7"/>',
    space: '<path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><circle cx="12" cy="12" r="2.5"/>',
    voice: '<rect x="9" y="2.5" width="6" height="10" rx="3"/><path d="M6 10.5a6 6 0 0 0 12 0M12 16.5V20M8.5 21h7"/>',
    digital: '<path d="M7 11a4 4 0 0 1 .6-7.9A5 5 0 0 1 17 5a3.5 3.5 0 0 1 0 6z"/><rect x="3.5" y="15" width="4" height="5" rx="1"/><rect x="10" y="15" width="4" height="5" rx="1"/><rect x="16.5" y="15" width="4" height="5" rx="1"/>',
    consult: '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v9a1.5 1.5 0 0 1-1.5 1.5H10l-4 4v-4H5.5A1.5 1.5 0 0 1 4 14.5z"/>',
    store: '<path d="M4 9l1.5-5h13L20 9"/><path d="M4 9a2.7 2.7 0 0 0 5.3 0 2.7 2.7 0 0 0 5.4 0A2.7 2.7 0 0 0 20 9"/><path d="M5 12v8h14v-8M10 20v-4.5h4V20"/>'
  };
  const GR = [['dash', 'train', 'translate', 'dict', 'mirror', 'space'], ['voice'], ['digital'], ['consult'], ['store']];
  const sdi = k => '<button type="button" class="sdi" data-k="' + k + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + IC[k] + '</svg><span data-t="i_' + k + '"></span></button>';
  $('side').innerHTML = '<div class="sdh" data-t="grp"></div>' + GR.map(g => g.map(sdi).join('')).join('<div class="sdl"></div>');
  const setSide = on => { if (!isDk()) W.classList.toggle('sbo', on); };
  $('sbtn').onclick = e => { e.stopPropagation(); setSide(!W.classList.contains('sbo')); };
  $('sbs').onclick = () => setSide(false);

  /* ---------- language / theme ---------- */
  function hb() { const h = $('hdr').offsetHeight, t = $('ptitle').getBoundingClientRect().top; $('hbar').style.opacity = Math.max(0, Math.min(1, (h - t) / 28)); }
  function apply() {
    const t = STR[L]; W.dir = L === 'ar' ? 'rtl' : 'ltr'; W.classList.toggle('ar', L === 'ar');
    R.querySelectorAll('[data-t]').forEach(e => { e.textContent = t[e.dataset.t]; });
    R.querySelectorAll('.js-lg').forEach(b => { b.textContent = t.name; });
    if (cur) $('ltitle').textContent = t['i_' + cur];
    if (cfg.onLang) cfg.onLang(L); hb();
  }
  R.querySelectorAll('.js-lg').forEach(b => b.onclick = () => { L = L === 'ar' ? 'en' : 'ar'; try { localStorage.setItem(KEY_L, L); } catch (e) { } apply(); });
  W.classList.toggle('light', !!cfg.light);
  R.querySelectorAll('.js-tg').forEach(b => b.onclick = () => {
    W.classList.add('th-fade'); setTimeout(() => W.classList.remove('th-fade'), 1600);
    const on = !W.classList.contains('light'); W.classList.toggle('light', on); if (cfg.setLight) cfg.setLight(on);
  });
  window.addEventListener('scroll', hb, { passive: true }); window.addEventListener('resize', hb);

  /* ---------- pages: on a phone a chosen page opens as a full layer (Back returns to the main page);
                      on a computer it is shown in the display area next to the sidebar ---------- */
  function fillLayer(k) {
    const b = $('lbody'), dash = k === 'dash' && cfg.dashRoute;
    b.classList.toggle('full', !!dash);
    if (dash) { b.innerHTML = ''; const f = document.createElement('iframe'); f.className = 'dframe'; f.title = 'Dashboard'; f.src = cfg.dashRoute(); b.appendChild(f); }
    else { b.innerHTML = '<div class="pcard" data-t="soonc"></div>'; b.firstChild.textContent = STR[L].soonc; }
  }
  function openLayer(k) {
    cur = k; $('ltitle').textContent = STR[L]['i_' + k]; fillLayer(k); $('lbody').scrollTop = 0;
    R.querySelectorAll('.sdi').forEach(b => b.classList.toggle('on', b.dataset.k === k));
    setSide(false); W.classList.add('lay'); $('layer').setAttribute('aria-hidden', 'false');
    if (!isDk()) { document.body.style.overflow = 'hidden'; try { history.pushState({ th: k }, ''); } catch (e) { } }
  }
  function closeLayer() {
    cur = null; W.classList.remove('lay'); $('layer').setAttribute('aria-hidden', 'true'); document.body.style.overflow = '';
    R.querySelectorAll('.sdi.on').forEach(b => b.classList.remove('on'));
    setTimeout(() => { if (!W.classList.contains('lay')) $('lbody').innerHTML = ''; }, 500);
  }
  $('side').addEventListener('click', e => { const b = e.target.closest('.sdi'); if (b) openLayer(b.dataset.k); });
  $('logo').onclick = () => { if (cur) { if (!isDk() && history.state && history.state.th && history.state.th !== 'main') history.back(); else closeLayer(); } };
  $('back').onclick = () => { if (history.state && history.state.th && history.state.th !== 'main' && history.state.th !== 'guard') history.back(); else closeLayer(); };

  /* ---------- profile pop-up ---------- */
  const setPop = on => $('pov').classList.toggle('on', on);
  function fillUser() {
    const u = (cfg.getUser && cfg.getUser()) || {};
    [['rN', 'pn', 'name'], ['rU', 'pus', 'username'], ['rP', 'pph', 'phone'], ['rE', 'pem', 'email']].forEach(a => { $(a[1]).textContent = u[a[2]] || ''; $(a[0]).style.display = u[a[2]] ? '' : 'none'; });
    const rows = ['rN', 'rU', 'rP', 'rE'].map($).filter(r => r.style.display !== 'none'); rows.forEach(r => r.style.borderBottom = ''); if (rows.length) rows[rows.length - 1].style.borderBottom = '0';
  }
  $('prof').onclick = e => { e.stopPropagation(); setSide(false); fillUser(); setPop(true); };
  $('pov').addEventListener('click', e => { if (e.target === $('pov')) setPop(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { setPop(false); setSide(false); } });
  if (cfg.logout) { W.classList.add('canout'); $('lout').onclick = () => cfg.logout(); }

  /* ---------- guest: Back on the main page asks before leaving guest mode ---------- */
  if (cfg.guard) {
    $('gStay').onclick = () => $('gov').classList.remove('on');
    $('gLeave').onclick = () => cfg.leave();
    try { history.replaceState({ th: 'guard' }, ''); history.pushState({ th: 'main' }, ''); } catch (e) { }
    window.addEventListener('popstate', e => {
      const s = e.state && e.state.th;
      if (s === 'guard') { closeLayer(); try { history.pushState({ th: 'main' }, ''); } catch (x) { } $('gov').classList.add('on'); }
      else if (W.classList.contains('lay')) closeLayer();
    });
  } else {
    window.addEventListener('popstate', () => { if (W.classList.contains('lay') && !isDk()) closeLayer(); });
  }

  if (window.thLoader && thLoader.LOGO) W.style.setProperty('--thlogo', 'url(' + thLoader.LOGO + ')');
  apply();

  /* ---------- start: the logo intro first, then the page, with the sidebar open ---------- */
  function start() {
    const bg = () => W.classList.contains('light') ? '#e4e6ec' : '#121419';
    const go = () => { W.classList.remove('hid'); W.classList.add('shown'); hb(); if (!isDk()) setTimeout(() => setSide(true), 350); };
    if (window.thLoader && thLoader.intro) return thLoader.intro({ bg: bg }).then(go, go);
    go(); return Promise.resolve();
  }
  return { start: start, apply: apply, openLayer: openLayer, closeLayer: closeLayer };
}
function thDetectLang(){try{var v=localStorage.getItem('thLandLang');if(v==='ar'||v==='en')return v}catch(e){}var tz='';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){}return(/^(Africa\/(Cairo|Tripoli|Tunis|Algiers|Casablanca|El_Aaiun|Khartoum|Djibouti|Nouakchott|Mogadishu)|Asia\/(Riyadh|Dubai|Baghdad|Amman|Beirut|Damascus|Kuwait|Qatar|Bahrain|Muscat|Aden|Gaza|Hebron)|Indian\/Comoro)$/.test(tz)||(navigator.language||'').toLowerCase().indexOf('ar')===0)?'ar':'en'}

(function(){
  var g=null; try{g=JSON.parse(sessionStorage.getItem('thabitGuest')||'null')}catch(e){}
  if(!g||!g.firstName){location.replace('landing.html');return}
  var app=THApp({host:document.getElementById('thApp'),lang:thDetectLang(),light:(function(){try{return localStorage.getItem('thThemeChoice')==='light'}catch(e){return false}})(),
    setLight:function(b){try{localStorage.setItem('thThemeChoice',b?'light':'dark')}catch(e){}},
    onLang:function(l){document.documentElement.lang=l;document.title=l==='ar'?'ثابت':'Thabit'},
    getUser:function(){return{name:((g.firstName||'')+' '+(g.lastName||'')).trim(),phone:g.phone||'',email:g.email||''}},
    guard:true,dashRoute:null,
    leave:function(){try{sessionStorage.removeItem('thabitGuest')}catch(e){}var nav=function(){location.replace('landing.html')};if(window.thLoader)thLoader.show().then(nav);else nav()}});
  app.start();
})();
</script>
