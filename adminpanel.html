<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thabit Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--ink:#1c1a16;--ink2:rgba(28,26,22,.68);--gbg:rgba(255,255,255,.65);--gbd:rgba(28,26,22,.12);--pn:rgba(255,255,255,.94);--ac:#059669;--onac:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050506;--ink:#ece8df;--ink2:rgba(236,232,223,.7);--gbg:rgba(255,255,255,.08);--gbd:rgba(255,255,255,.14);--pn:rgba(26,26,30,.94);--ac:#34d399;--onac:#04231a}}
:root[data-theme="dark"]{--bg:#050506;--ink:#ece8df;--ink2:rgba(236,232,223,.7);--gbg:rgba(255,255,255,.08);--gbd:rgba(255,255,255,.14);--pn:rgba(26,26,30,.94);--ac:#34d399;--onac:#04231a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 14px Cairo,Inter,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#hdr{position:fixed;top:0;left:0;right:0;z-index:20;box-sizing:border-box;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;justify-content:space-between}
.logo{font:800 17px Inter,sans-serif;letter-spacing:.04em}
#hctl{display:flex;gap:8px;align-items:center}
.cb{height:36px;min-width:36px;padding:0 12px;border-radius:20px;border:1px solid var(--gbd);background:var(--gbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 12px Inter,Cairo,sans-serif;cursor:pointer}

.sh{font:700 10px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:8px 14px 4px}
.sdi{display:flex;align-items:center;gap:14px;width:100%;height:46px;padding:0 14px;border:0;border-radius:14px;background:transparent;font:600 14px Cairo,Inter,sans-serif;text-align:start;cursor:pointer}

.sdi.stu{background:var(--gbg)}

#layer{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:var(--bg)}
#layer.on{display:flex}
.ltop{flex:none;box-sizing:border-box;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 14px 0;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--gbd)}
.ltop h2{margin:0;font:700 16px Cairo,Inter,sans-serif}
#lbody{flex:1;overflow:auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
.card{display:block;background:var(--gbg);border:1px solid var(--gbd);border-radius:22px;padding:14px;margin-bottom:12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.card h4{margin:0 0 8px;font:700 11px Inter,Cairo,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:10px}
.in{width:100%;box-sizing:border-box;background:var(--gbg);border:1px solid var(--gbd);border-radius:14px;padding:11px 12px;outline:0}
textarea.in{min-height:96px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.num{font:800 28px Inter,sans-serif}
.seg{display:flex;gap:4px;padding:4px;border-radius:20px;background:var(--gbg);border:1px solid var(--gbd)}
.seg button{flex:1;height:34px;border:0;border-radius:16px;background:transparent;color:var(--ink2);font-weight:700;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.btn{height:44px;padding:0 20px;border-radius:22px;border:1px solid transparent;background:var(--ink);color:var(--bg);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--gbg);color:var(--ink);border-color:var(--gbd)}
.btn.ac,.tbtn.done{background:var(--ac);color:var(--onac)}
.tbtn{width:100%;height:54px;border-radius:27px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.pcard{max-width:520px;margin:40px auto;padding:28px;border-radius:28px;text-align:center;line-height:1.9;color:var(--ink2);background:var(--gbg);border:1px solid var(--gbd)}
#pov{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;box-sizing:border-box;padding:calc(64px + env(safe-area-inset-top,0px)) 14px 14px;background:rgba(0,0,0,.4)}
#pov.on{display:flex}
.pop{width:min(440px,100%);max-height:78dvh;overflow:auto;box-sizing:border-box;padding:14px;border-radius:26px;background:var(--pn);border:1px solid var(--gbd);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.pop details{margin-top:8px}
.pop summary{padding:8px 6px;font:700 12px Inter,Cairo,sans-serif;color:var(--ink2)}
.st,.chat{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border:0;border-radius:16px;background:transparent;text-align:start;cursor:pointer}
.st:hover,.chat:hover{background:var(--gbg)}
.av{width:38px;height:38px;border-radius:50%;background:var(--gbg);border:1px solid var(--gbd);display:grid;place-items:center;font-weight:800;flex:none}
.chat .av{width:46px;height:46px}
.chat .m{flex:1;min-width:0}
.chat b,.chat small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat small{color:var(--ink2)}
.chat .t{font:600 11px Inter,sans-serif;color:var(--ink2);text-align:end}
.bdg{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-top:4px;border-radius:10px;background:var(--ac);color:var(--onac);font:800 11px Inter,sans-serif}
.b{max-width:80%;width:fit-content;padding:8px 12px;border-radius:16px;margin:6px 0;background:var(--gbg);border:1px solid var(--gbd);line-height:1.6}
.b.me{margin-inline-start:auto;background:var(--ac);color:var(--onac);border-color:transparent}
.bar{display:flex;gap:8px;margin-top:14px}
.bar .btn{width:44px;padding:0;flex:none;display:grid;place-items:center}
#login{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
#login.on{display:flex}.lg{width:min(360px,100%);text-align:center}.lg .in{margin-bottom:10px;direction:ltr;text-align:center}
#lgerr{min-height:20px;color:#ef4444;font-size:13px;margin:0 0 8px}
.hint{margin:8px 0 0;font-size:12px;color:var(--ink2)}
fieldset{border:0;padding:0;margin:0;min-width:0}fieldset:disabled{opacity:.5}
.num.in{font-size:22px}.seg button:disabled{opacity:.35}
.pdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.ltop .pdot{margin-inline-start:auto}
.td{width:9px;height:9px;border-radius:50%;margin-inline-start:auto;flex:none}
#flt .dot{background:var(--gbd)}
.tkg{margin:14px 4px 6px;font:700 10px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.tkb{display:flex;align-items:center;width:100%;height:46px;padding:0 14px;margin-bottom:6px;border:1px solid var(--gbd);border-radius:14px;background:var(--gbg);font:600 14px Cairo,Inter,sans-serif;text-align:start;cursor:pointer}
.tkb:hover{border-color:var(--ac)}
.tkw{text-align:center}
.tkw h3{margin:6px 0 16px;font:700 16px Cairo,Inter,sans-serif}
.tkadd{height:40px;padding:0 22px;border-radius:20px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-weight:700;cursor:pointer}
.tkmeta{display:flex;justify-content:space-between;margin:0 0 12px;font:700 12px Inter,sans-serif;color:var(--ink2)}
.tkf .in{margin-bottom:10px}
.mgbar{position:sticky;bottom:0;padding:10px 0 2px;background:var(--bg)}
.tksm{display:block;height:34px;padding:0 16px;margin:0 auto 8px;border-radius:17px;border:1px solid var(--gbd);background:var(--gbg);font:700 12px Inter,Cairo,sans-serif;cursor:pointer}
</style>
</head>
<body>
<div id="login" class="on"><div class="card lg"><h2 style="margin:0 0 4px">THABIT Admin</h2><p style="margin:0 0 14px;color:var(--ink2)">Sign in with the admin account</p>
<input class="in" id="lge" type="email" placeholder="Email" autocomplete="username"><input class="in" id="lgp" type="password" placeholder="Password" autocomplete="current-password">
<p id="lgerr"></p><button class="btn ac" id="lgo" style="width:100%">Sign in</button></div></div>
<header id="hdr">
  <span class="logo">THABIT</span>
  <div id="hctl">
    <button class="cb" id="flt" aria-label="Filter"><i class="dot"></i><span id="fl">All</span></button>
    <button class="cb" id="tg" aria-label="Theme"></button>
    <button class="cb" id="acc" aria-label="Students"></button>
  </div>
</header>
<button class="cb" id="sbtn" aria-label="Menu"></button>
<div id="scrim"></div>
<aside id="side" aria-label="Menu"></aside>
<main id="home">اختار طالب من زرار الحساب فوق، أو افتح أداة من القايمة.<br>Pick a student from the account button, or open a tool from the menu.</main>
<section id="layer"><div class="ltop"><button class="cb" id="back" aria-label="Back"></button><h2 id="lt"></h2></div><div id="lbody"></div></section>
<div id="pov"><div class="pop" id="pop"></div></div>

<script>
const IC={menu:'M4 7h16M4 12h16M4 17h16',x:'M6 6l12 12M18 6L6 18',user:'M12 4a3.6 3.6 0 1 0 0 7.2A3.6 3.6 0 0 0 12 4zM5 20c.8-3.6 3.6-5.2 7-5.2s6.2 1.6 7 5.2',back:'M15 5l-7 7 7 7',theme:'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 3v18',pen:'M4 20l4-1 11-11-3-3L5 16zM14 6l3 3',grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',chat:'M4 5h16v11H9l-5 4z',bell:'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',task:'M5 6l2 2 3-3M13 7h7M5 14l2 2 3-3M13 15h7',cal:'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',up:'M12 16V4M7 9l5-5 5 5M5 20h14',flag:'M6 21V4M6 5h11l-2 4 2 4H6',box:'M4 5h16v4H4zM6 9v11h12V9M10 13h4',star:'M12 4l2.5 5 5.5.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.5-.8z',key:'M8 15a4 4 0 1 1 3-3l9 9M17 18l2-2',chart:'M4 20V11M10 20V4M16 20v-6M3 20h18',sq:'M4 4h16v16H4zM4 12h16M12 4v16',bot:'M5 8h14v10H5zM12 4v4M9 13h.01M15 13h.01',send:'M4 12l16-8-6 16-3-7z'};
const svg=n=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+IC[n]+'"/></svg>';
const $=id=>document.getElementById(id);
const TOOLS=[['dash','Dashboard','grid'],['msg','Messenger','chat'],['ann','Announcements','bell'],['task','Tasks','task'],['mo','Monthly obligations','cal'],['voi','Upload voices','up'],['rep','Reports','flag'],['arc','Archive','box'],['hl','Highlights','star'],['gen','Generator','key'],['stat','Statistics','chart'],['space','Space','sq'],['ai','Assistant','bot']];
const SB_URL='https://vkfexceitwjmxncwceqb.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrZmV4Y2VpdHdqbXhuY3djZXFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMzY5MTEsImV4cCI6MjEwNTkxMjkxMX0.6ArXtykrZhdNInphpg_LQTIvULkpwnnlzHA3dKhrNoI',SKEY='thabit_admin_session';
const ctx={email:'',uid:'',role:'—'};let ST=[],GROUPS=[];
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowS=()=>Math.floor(Date.now()/1000);
const sess={get(){try{return JSON.parse(sessionStorage.getItem(SKEY)||'null')}catch(e){return null}},
  set(s){try{sessionStorage.setItem(SKEY,JSON.stringify({access_token:s.access_token,refresh_token:s.refresh_token,expires_at:s.expires_at||nowS()+(s.expires_in||3600)}))}catch(e){}},
  clear(){try{sessionStorage.removeItem(SKEY)}catch(e){}}};
const connTxt=()=>ctx.ok===false?'● Connection problem':'● Connected';
const dot=ok=>{ctx.ok=ok;const e=document.getElementById('conn');if(e)e.textContent=connTxt()};
async function auth(grant,body){
  const r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Login failed');return j}
async function token(){
  let s=sess.get();if(!s)return null;
  if(s.expires_at-nowS()<120){try{sess.set(await auth('refresh_token',{refresh_token:s.refresh_token}))}catch(e){sess.clear();return null}s=sess.get()}
  return s.access_token}
function showLogin(m){$('login').classList.add('on');$('lgerr').textContent=m||''}
async function sb(path,opt){
  const t=await token();if(!t){showLogin('Session ended — sign in again');throw new Error('No session')}
  const r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},(opt&&opt.headers)||{})}));
  dot(r.ok);if(r.status===401){sess.clear();showLogin('Session expired — sign in again')}
  if(!r.ok)throw new Error((await r.text()).slice(0,160));return r}
const norm=x=>String(x).toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]/g,'');
function col(r,k){const ks=Object.keys(r),n=norm(k);let c=ks.find(x=>x===k)||ks.find(x=>norm(x)===n);if(!c&&k==='status_as_of_today')c=ks.find(x=>/status/i.test(x));return c||null}
const val=(r,k)=>{const c=col(r,k);return c?r[c]:undefined};
function stat(r){
  const raw=String(val(r,'status_as_of_today')||'').trim(),s=raw.toLowerCase();
  if(!s)return['active',''];
  if(/terminat|منته|ملغ|مفصول/.test(s))return['terminated',raw];
  if(/paus|موقوف|متوقف|ايقاف|إيقاف|وقف/.test(s))return['paused',raw];
  if(/past|سابق|قديم/.test(s))return['past',raw];
  if(/pend|انتظار|منتظر|معلق/.test(s))return['pending',raw];
  if(/^(active|نشط|شغال|شغّال|فعال|مفعل)/.test(s))return['active',raw];
  return['x:'+s.replace(/\s+/g,' '),raw]}
const BASE=[['active','Active · شغّالين'],['pending','Pending · منتظرين'],['paused','Paused · موقوفين'],['past','Past · سابقين'],['terminated','Terminated · منتهي']];
const nt=v=>{const s=String(v||'').toLowerCase();return /^full|كامل/.test(s)?'full':/^part|جزئ/.test(s)?'part':''};
async function loadStudents(){
  const rows=await(await sb('basic_info?select=*&order=trainee.asc')).json(),list=Array.isArray(rows)?rows:[];
  GROUPS=BASE.map(x=>x.slice());const custom=new Map();
  const st=list.map(r=>{const k=stat(r);if(k[0].startsWith('x:')&&!custom.has(k[0]))custom.set(k[0],k[1]);return[k[0],r]});
  [...custom.entries()].sort((a,b)=>a[1].localeCompare(b[1])).forEach(e=>GROUPS.push([e[0],e[1]]));
  ST=st.map(x=>[String(x[1].trainee||x[1].name||'?'),GROUPS.findIndex(g=>g[0]===x[0]),x[1],nt(val(x[1],'attendance_type'))])}
async function boot(){
  try{
    const t=await token();if(!t){showLogin('');return}
    const c=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));ctx.uid=c.sub;ctx.email=c.email||'';
    $('login').classList.remove('on');
    await loadStudents();cur=null;renderAcc();
    try{const r=await(await sb('staff_roles?select=*&user_id=eq.'+ctx.uid)).json(),x=r&&r[0];
      ctx.role=x?(x.role||Object.values(x).find(v=>typeof v==='string'&&/admin|trainer/i.test(v))||'?'):'no staff_roles row'}catch(e){ctx.role='role lookup failed'}
    renderSide();
    const nf=ST.filter(s=>s[3]==='full').length,np=ST.filter(s=>s[3]==='part').length;
    $('home').innerHTML='✅ '+ST.length+' طالب اتحمّلوا من Supabase<br>Full-timer: '+nf+' · Part-timer: '+np+' · غير محدد: '+(ST.length-nf-np)+'<br>اختار طالب من زرار الحساب فوق، أو افتح أداة من القايمة.'
  }catch(e){$('home').textContent='Error: '+e.message}}
async function logout(){
  if(dsBusy()||!canLeave())return;D=null;
  try{const t=await token();if(t)await fetch(SB_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+t}})}catch(e){}
  sess.clear();ST=[];STS.rows=null;STS.g=null;STS.sel=null;MG.msgs=new Map();MG.open=null;cur=null;page=null;$('layer').classList.remove('on');side(false);renderAcc();renderSide();showLogin('')}
$('lgo').onclick=async()=>{
  const e=$('lge').value.trim(),p=$('lgp').value;if(!e||!p){$('lgerr').textContent='Enter email and password';return}
  $('lgo').disabled=true;
  try{sess.set(await auth('password',{email:e,password:p}));$('lgp').value='';$('lgerr').textContent='';await boot()}catch(x){$('lgerr').textContent=x.message}
  $('lgo').disabled=false};
['lge','lgp'].forEach(id=>{$(id).onkeydown=e=>{if(e.key==='Enter')$('lgo').click()}});
let cur=null,page=null;
let flt='all';const FL={all:['All','var(--gbd)'],full:['Full-timer','#22c55e'],part:['Part-timer','#f97316']};
function paintFlt(){$('fl').textContent=FL[flt][0];document.querySelector('#flt .dot').style.background=FL[flt][1]}
$('flt').onclick=()=>{flt=flt==='all'?'full':flt==='full'?'part':'all';paintFlt();if($('pov').classList.contains('on'))students()};

$('sbtn').innerHTML=svg('menu');$('tg').innerHTML=svg('theme');$('back').innerHTML=svg('back');

function pdot(){const t=cur!==null&&ST[cur]?ST[cur][3]:'';return t?'<i class="pdot" style="background:'+FL[t][1]+'" role="img" aria-label="'+FL[t][0]+'" title="'+FL[t][0]+'"></i>':''}
function paintLt(){if(page==='ds'&&ST[cur])$('lt').parentNode.querySelectorAll('.pdot').forEach(x=>x.remove()),$('lt').parentNode.insertAdjacentHTML('beforeend',pdot());else $('lt').parentNode.querySelectorAll('.pdot').forEach(x=>x.remove())}
function renderAcc(){$('acc').innerHTML=svg('user')+(cur!==null&&ST[cur]?'<span dir="auto">'+esc(ST[cur][0])+'</span>':'')+pdot()}
function renderSide(){
  let h='';
  if(cur!==null&&ST[cur])h+='<div class="sh">Student</div><button class="sdi stu" data-p="ds">'+svg('pen')+'Daily supply</button>';
  h+='<div class="sh">Tools</div>'+TOOLS.map(t=>'<button class="sdi'+(page===t[0]?' on':'')+'" data-p="'+t[0]+'">'+svg(t[2])+t[1]+'</button>').join('');
  h+='<div class="sh" style="text-transform:none;letter-spacing:0">'+esc(ctx.email)+' · '+esc(ctx.role)+'</div><div class="sh" id="conn" style="text-transform:none;letter-spacing:0">'+connTxt()+'</div><button class="sdi" data-p="__out">'+svg('x')+'Sign out</button>';$('side').innerHTML=h;
}
function side(on){$('side').classList.toggle('on',on);$('scrim').classList.toggle('on',on);$('sbtn').innerHTML=svg(on?'x':'menu')}

function addPart(){
  if(D.dirty){dsSay('احفظ الأول، وبعدين ضيف جزء جديد.');return}
  if(!D.rec){dsSay('احفظ الجلسة الأولى الأول، وبعدين ضيف جزء.');return}

async function dsSave(){

  if(!Number.isInteger(no)||no<1){dsSay('❌ رقم الجلسة لازم يكون رقم صحيح من 1.');return}
  if(has&&(!(R>=0.5&&R<=720)||!Number.isInteger(rep)||rep<1||rep>5)){dsSay('❌ راجع الـ Range (0.5–720) والتكرار (1–5).');return}

  if(d.type==='separated'&&!part.start&&!part.end&&!part.notes.trim()&&!around(savedPart(d.part))){dsSay('❌ الجزء '+d.part+' فاضي، اكتب وقت أو ملاحظات.');return}

      const merged={};d.parts.forEach(p=>{merged[p.part_no]=p});
      const mk=(n,v,src)=>({trainee_id:d.id,supply_date:d.date,part_no:n,start_time:v.start||null,end_time:v.end||null,notes:v.notes.trim()||null,around_h:src?src.around_h:null,around_m:src?src.around_m:null,updated_at:new Date().toISOString()});
      d.drafts['separated'+d.part]=part;

      if(!merged[1]&&old&&!d.drafts.separated1&&(old.start_time||old.end_time||old.notes||around(old))){merged[1]=mk(1,{start:t5(old.start_time),end:t5(old.end_time),notes:old.notes||''},old);writes.push(merged[1])}

        if(n!==d.part&&!d.touched.has(n))return;
        merged[n]=mk(n,v,src);writes.push(merged[n])});
      const all=Object.values(merged).sort((a,b)=>a.part_no-b.part_no);
      body.start_time=all.map(p=>t5(p.start_time)).filter(Boolean).sort()[0]||null;
      body.end_time=all.map(p=>t5(p.end_time)).filter(Boolean).sort().pop()||null;
      body.around_h=null;body.around_m=null;body.parts_count=all.length;
      body.total_minutes=all.reduce((s,p)=>s+(around(p)||mins(p.start_time,p.end_time)||0),0)||null;
      body.notes=all.filter(p=>(p.notes||'').trim()).map(p=>'الجزء '+p.part_no+':\n'+p.notes.trim()).join('\n\n')||null;
    }else{
      body.start_time=part.start||null;body.end_time=part.end||null;body.notes=part.notes.trim()||null;body.parts_count=1;
      body.total_minutes=around(d.rec)||mins(part.start,part.end);
    }
    if(d.rec){d.rec=(await write('daily_supply?id=eq.'+encodeURIComponent(d.rec.id),'PATCH',body))[0]}
    else{
      const now=await getJ('daily_supply?select=id&'+dsKeyQ()+'&limit=1');
      if(now.length)throw new Error('السجل اتعمل من مكان تاني وإنت فاتح الصفحة. انسخ كلامك، وغيّر التاريخ وارجع له');
      d.rec=(await write('daily_supply','POST',Object.assign({trainee_id:d.id,supply_date:d.date},body)))[0];
    }
    saved=true;
    step='الأجزاء';
    for(const p of writes){
      const q='daily_supply_parts?'+dsKeyQ()+'&part_no=eq.'+p.part_no,ex=d.parts.some(x=>x.part_no===p.part_no);
      const row=(await write(ex?q:'daily_supply_parts',ex?'PATCH':'POST',p))[0];
      d.parts=d.parts.filter(x=>x.part_no!==p.part_no).concat(row).sort((a,b)=>a.part_no-b.part_no);
    }
    if(has){
      step='الـ Tasks / الدندنة';
      const fresh=await getJ('supply_items?select=*&'+dsKeyQ()+'&order=item_no.asc');
      const wall=ms=>new Date(ms).toISOString().slice(0,19),A=Date.parse(cairoDate()+'T'+cairoTime()+':00Z');
      const opens=Array.from({length:rep},(_,i)=>wall(Math.round((A+(rep<2?0:i/(rep-1))*R*36e5)/6e4)*6e4));
      const rows=[];
      add.forEach(a=>{const free=freeSlots(fresh,a.k);if(a.lines.length>free.length)throw new Error('الخانات الفاضية مش كفاية');
        a.lines.forEach((line,i)=>{const s=line.split('|'),dd=a.k==='dandana';
          rows.push({trainee_id:d.id,supply_date:d.date,kind:a.k,item_no:free[i],title:(dd?s[0]:line).trim()||null,badge:dd&&s.length>1?s.slice(1).join('|').trim():null,body:null,priority:'normal',repeats:rep,range_hours:R,as_of:wall(A),opens_at:opens,updated_at:new Date().toISOString()})})});
      d.items=fresh.concat(await write('supply_items','POST',rows));
      $('ds_task').value='';$('ds_dandana').value='';paintItems();
    }
    d.drafts={};d.touched=new Set();d.dirty=false;d.count=d.count||1;
    showPart();dsSay('اتحفظ ✓ · '+cairoTime());
  }catch(e){
    dsSay('❌ فشل حفظ '+step+(saved&&step!=='الجلسة'?' (الجلسة نفسها اتحفظت)':'')+': '+e.message+' · كلامك لسه في الخانات، دوس Save تاني.');
  }finally{
    d.busy=false;
    if(d===D&&page==='ds'){$('ds_form').disabled=false;$('ds_date').disabled=false;paintDs()}
  }
}

  const v=prompt('ده هيمسح الطالب "'+s[0]+'" وكل بياناته نهائياً (الحساب، الجلسات، الرسائل، الملاحظات، الإشعارات…) ومفيش رجوع.\nاكتب اسمه بالظبط للتأكيد:');
  if(v===null)return;
  if(v.trim()!==s[0].trim()){DB.msg='الاسم مش مطابق، المسح اتلغى.';dashPaint();return}
  DB.busy=true;DB.msg='جاري المسح…';dashPaint();
  try{await rpcA('admin_delete_trainee',{p_id:r.id});DB.open=null;cur=null;STS.rows=null;MG.msgs=new Map();await loadStudents();renderAcc();DB.msg='اتمسح ✓ '+s[0]}
  catch(e){DB.msg='❌ فشل المسح: '+e.message}
  DB.busy=false;dashPaint();
}
function dashAct(a,i){
  if(a==='prof'){DB.view='profile';DB.prof=i;dashPaint();$('lbody').scrollTop=0}
  else if(a==='view')dashOpen(i);else if(a==='del')dashDel(i);
}

$('sbtn').onclick=()=>side(!$('side').classList.contains('on'));
$('scrim').onclick=()=>side(false);
$('side').onclick=e=>{const b=e.target.closest('[data-p]');if(b){if(b.dataset.p==='__out')return logout();openPage(b.dataset.p)}};
$('acc').onclick=students;
$('pov').onclick=e=>{
  const s=e.target.closest('[data-s]');
  if(s){if(dsBusy()||(page==='ds'&&!canLeave()))return;D=null;page=null;cur=+s.dataset.s;renderAcc();$('pov').classList.remove('on');openPage('ds')}
  else if(e.target===$('pov'))$('pov').classList.remove('on');
};
$('pop').oninput=e=>{if(e.target.id!=='q')return;const v=e.target.value.trim();$('pop').querySelectorAll('.st').forEach(b=>b.style.display=b.textContent.includes(v)?'':'none')};
$('back').onclick=()=>{
  if(page==='dash'&&DB.view==='profile'){DB.view='list';DB.msg='';dashPaint();return}
  if(page==='msg'&&MG.open){MG.open=null;$('lt').textContent='Messenger';$('lbody').innerHTML=mgList();return}
  if(page==='ann'&&$('lbody').dataset.an){delete $('lbody').dataset.an;$('lt').textContent='Announcements';$('lbody').innerHTML=annList();return}
  closePage();
};
$('lbody').onclick=e=>{
  if(page==='dash'){
    const dt=e.target.closest('[data-dat]');if(dt){dbSetType(+dt.dataset.i,dt.dataset.dat);return}
    const da=e.target.closest('[data-dact]');if(da){dashAct(da.dataset.dact,+da.dataset.i);return}
    const dr=e.target.closest('[data-di]');if(dr){const k=+dr.dataset.di;DB.open=DB.open===k?null:k;DB.msg='';dashPaint();return}
  }
  if(page==='stat'){
    const t=e.target.closest('[data-stab]');if(t){STS.tab=t.dataset.stab;STS.open=false;statPaint();return}
    if(e.target.closest('[data-spick]')){STS.open=!STS.open;statPaint();return}
    const q=e.target.closest('[data-sst]');if(q){STS.sel=q.dataset.sst||null;STS.open=false;statPaint();return}
    if(e.target.closest('[data-sretry]')){statInit();return}
  }
  const tk=e.target.closest('[data-tk]');if(tk&&$('tk_ui')){$('tk_ui').innerHTML=tkWidget(tk.textContent);return}
  if(e.target.closest('[data-tkback]')&&$('tk_ui')){$('tk_ui').innerHTML=tkList();return}
  if(e.target.closest('[data-addtask]')&&$('tkbox')){$('tkbox').innerHTML=taskForm();return}
  const an=e.target.closest('[data-an]');if(an&&page==='ann'){$('lbody').dataset.an=an.dataset.an;$('lt').textContent='Announcement · '+an.textContent;$('lbody').innerHTML=annView(an.textContent);return}
  const mc=e.target.closest('[data-mc]');if(mc&&page==='msg'){mgOpen(MG.cells[+mc.dataset.mc].name);return}
  if(e.target.closest('[data-mgsend]')&&page==='msg'){mgSend();return}
  if(page==='ds'&&D)dsClick(e);
};
$('lbody').oninput=e=>{if(page==='dash'&&e.target.id==='dq'){DB.q=e.target.value;dashPaint();return}if(page==='ds'&&D&&!['ds_date','ds_range','ds_rep','tk_sub','tk_con'].includes(e.target.id)){markDirty();if(e.target.type==='time')paintDs()}};
$('lbody').onchange=e=>{if(e.target.id!=='ds_date'||!D)return;const v=e.target.value;if(!v||!canLeave()){e.target.value=D.date;return}dsInit(v)};
$('lbody').addEventListener('keydown',e=>{if(e.target.id==='mgin'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();mgSend()}});
window.addEventListener('beforeunload',e=>{if(D&&(D.dirty||D.busy)){e.preventDefault();e.returnValue=''}});
$('tg').onclick=()=>{
  const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme=d==='dark'?'light':'dark';
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('pov').classList.remove('on');side(false)}});
paintFlt();renderAcc();renderSide();if(sess.get())boot();
</script>
</body>
</html>
